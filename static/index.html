<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPORTS LIVE!</title>
<meta name="description" content="축구·농구·야구 순위표, 경기 일정·결과, 라인업을 한곳에서">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPORTS LIVE!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f0f2f7; --text:#131722; --muted:#5f6779;
  --border:#e1e5ee; --accent:#1d4ed8; --accent-soft:#e7eeff;
  --win:#15803d; --win-bg:#dcfce7; --draw:#5f6779; --draw-bg:#eceef3; --loss:#b91c1c; --loss-bg:#fee2e2;
  --live:#e11d48; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1016; --surface:#151a23; --surface-2:#1c2230; --text:#e7eaf0; --muted:#97a0b2;
    --border:#262d3b; --accent:#7096ff; --accent-soft:#1b2747;
    --win:#4ade80; --win-bg:#13301f; --draw:#a3abbb; --draw-bg:#262c38; --loss:#f87171; --loss-bg:#3a1a1c;
    --live:#fb7185; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:5;padding-top:env(safe-area-inset-top);overflow:hidden}
header.top>.wrap{position:relative;z-index:1}
/* 리그 색 배경 (은은한 그라데이션 + 위쪽 색 띠) */
header.top{background:linear-gradient(115deg, color-mix(in srgb, var(--lgc, #1d4ed8) 15%, var(--surface)) 0%, color-mix(in srgb, var(--lgc, #1d4ed8) 6%, var(--surface)) 45%, var(--surface) 75%, color-mix(in srgb, var(--lgc, #1d4ed8) 9%, var(--surface)) 100%);transition:background .3s}
header.top::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--lgc, #1d4ed8);z-index:2}
@media (prefers-color-scheme: dark){
  header.top{background:linear-gradient(115deg, color-mix(in srgb, var(--lgc, #1d4ed8) 28%, var(--surface)) 0%, color-mix(in srgb, var(--lgc, #1d4ed8) 10%, var(--surface)) 45%, var(--surface) 75%, color-mix(in srgb, var(--lgc, #1d4ed8) 16%, var(--surface)) 100%)}
}
/* 토너먼트 대진표 */
.stview{max-width:360px;margin:14px 0 12px}
.bwrap{overflow-x:auto;margin:0 -4px 16px;padding:0 4px 6px;-webkit-overflow-scrolling:touch}
.bracket{display:flex;gap:26px;min-width:max-content}
.bcol{display:flex;flex-direction:column;width:210px;flex:none}
.bhead{height:30px;font-size:12px;font-weight:800;color:var(--lgc, var(--accent));text-align:center;letter-spacing:-.2px}
.bbody{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.bpair{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.bpair::after{content:"";position:absolute;right:-14px;top:25%;bottom:25%;width:12px;border:2px solid var(--border);border-left:0;border-radius:0 8px 8px 0}
.bslot{flex:1;display:flex;align-items:center;position:relative}
.bcol.lnk .bslot::before{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--border)}
.btie{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px 8px;box-shadow:var(--shadow);font-size:12.5px}
.btie.live{border-color:var(--live)}
.btie.bye{background:transparent;box-shadow:none;border-style:dashed;text-align:center;padding:10px 6px;font-size:11px}
.bcol.fin .btie{border:2px solid color-mix(in srgb, #f59e0b 70%, var(--border));box-shadow:0 2px 10px color-mix(in srgb, #f59e0b 25%, transparent)}
.brow{display:flex;align-items:center;gap:6px;min-width:0;height:24px}
.brow .lg{width:18px;height:18px;flex:none}
.brow .bn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brow .bs{font-weight:800;font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
.brow.l{color:var(--muted)}
.brow.l .bs{font-weight:600}
.brow .wbadge{font-size:9.5px;padding:2px 3px}
.binfo{font-size:10.5px;text-align:right;margin-top:1px}
.btie.ph{border-style:dashed;box-shadow:none;background:color-mix(in srgb, var(--surface) 70%, transparent)}
.brow .bsd{flex:none;font-size:9.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.brow .bsd.proj{color:var(--accent)}
.planban{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;line-height:1.5;background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.planban .btn{margin-left:auto;font-size:12px;padding:4px 10px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-bottom:16px}
.sitefoot{margin-top:28px;padding-top:14px;padding-bottom:22px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;line-height:1.7;text-align:center}
.sitefoot b{color:var(--text)}
/* 경기 상세 배당 표 */
.otbl-wrap{padding:4px 6px;overflow-x:auto}
table.otbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
table.otbl thead th{font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 4px;text-align:center;border-bottom:1px solid var(--border)}
table.otbl tbody th{text-align:left;color:var(--muted);font-weight:700;padding:9px 6px;white-space:nowrap;width:70px}
table.otbl td{text-align:center;padding:5px 3px;border-top:1px solid var(--border)}
table.otbl tbody tr:first-child td,table.otbl tbody tr:first-child th{border-top:0}
table.otbl tbody th{border-top:1px solid var(--border)}
table.otbl td b{display:inline-block;min-width:46px;padding:4px 6px;border-radius:7px;background:var(--surface-2);font-weight:800}
table.otbl td small{display:block;font-size:10px;color:var(--muted);margin-bottom:1px}
table.otbl td.hit b{background:var(--win-bg);color:var(--win);box-shadow:inset 0 0 0 1px var(--win)}
table.otbl td.hit small{color:var(--win)}
table.otbl td.ln{color:var(--muted);font-weight:700;white-space:nowrap}
table.otbl td.ores{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
table.otbl td.ores.on{color:var(--live)}
/* 1·2차전: 차전별 결과 줄 */
.blegbox{margin-top:5px;padding-top:4px;border-top:1px dashed var(--border);display:grid;gap:2px}
.bleg{display:flex;align-items:center;gap:5px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--text)}
.bleg .lk{color:var(--muted);font-size:10.5px;font-weight:700;width:30px;flex:none}
.bleg .lg{width:15px;height:15px;flex:none}
.bleg b{min-width:10px;text-align:center;font-weight:800}
.bleg .col{color:var(--muted);font-size:10px}
.bleg .ab{font-size:9px;font-weight:800;color:var(--muted);width:24px;text-align:center;flex:none}
.bleg .hn{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px;min-width:0}
/* 경기 카드: 홈 배지 · 경기장 */
.match .hb{font-style:normal;flex:none;font-size:9.5px;font-weight:800;line-height:1;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:2px 4px}
.match .mvenue{grid-column:1/-1;text-align:center;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px;line-height:1.2}
.bleg .hb{flex:none;font-size:9px;font-weight:800;line-height:1;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:2px 3px;margin-right:-1px}
.bleg.live b{color:var(--live)}
/* 1·2차전 표 (이전 방식, 미사용) */
.bracket.two .bcol{width:250px}
table.blegs{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
table.blegs thead td{font-size:9.5px;color:var(--muted);text-align:center;padding:0 0 2px;font-weight:600}
table.blegs th{text-align:left;font-weight:600;padding:2px 0;white-space:nowrap;overflow:hidden}
table.blegs th .lg{width:18px;height:18px;vertical-align:middle;margin-right:5px}
table.blegs th>span:not(.lg),table.blegs th .bn{vertical-align:middle}
table.blegs th{text-overflow:ellipsis}
table.blegs th .wbadge{font-size:9.5px;padding:2px 3px;margin-left:3px;vertical-align:middle}
table.blegs tbody td{width:38px;text-align:center;font-weight:700;padding:2px 0;line-height:1.05}
table.blegs tbody td i{display:block;font-style:normal;font-size:8.5px;font-weight:600;color:var(--muted)}
table.blegs thead td:last-child,table.blegs td.agg{width:34px;border-left:1px solid var(--border)}
table.blegs td.agg{font-size:15px;font-weight:800}
table.blegs tr.l{color:var(--muted)}
table.blegs tr.l td.agg{font-weight:600}
table.blegs td.live{color:var(--live)}
/* 커뮤니티 */
.nickchip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text)}
.nickchip i{font-style:normal;opacity:.6;margin-left:2px}
.adm{font-size:11px;font-weight:800;color:#fff;background:#0f766e;border-radius:6px;padding:2px 6px}
.tkseg{display:flex;gap:4px;padding:3px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);margin-bottom:12px}
.tkseg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.tkseg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.14)}
.tkseg.sm{margin-bottom:10px}.tkseg.sm button{padding:7px 6px;font-size:13px}
.tkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:12.5px}
.btn.tkbtn{background:var(--lgc, var(--accent));border-color:var(--lgc, var(--accent));color:#fff;font-weight:700;white-space:nowrap}
.btn.tkbtn:hover{filter:brightness(1.1);background:var(--lgc, var(--accent))}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.on{background:var(--win-bg);color:var(--win);border-color:var(--win)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px 4px}
.tklist{display:grid;gap:8px;margin-bottom:16px}
.tkpost{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.tkpost:hover{border-color:var(--lgc, var(--accent))}
.tkthumb{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;background:var(--surface-2)}
.tkmain{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.tkpost.pinned{border-color:var(--accent,#2563eb);background:color-mix(in srgb, var(--accent,#2563eb) 6%, var(--surface))}
.pinb{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--accent,#2563eb);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.tkt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkb{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.tkm{font-size:12px;color:var(--muted)}
em.me{font-style:normal;font-size:10px;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 3px}
.tkin{display:block;width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;margin-bottom:8px;resize:vertical}
.tkin:focus{outline:2px solid color-mix(in srgb, var(--lgc, var(--accent)) 50%, transparent);border-color:transparent}
.tkerr{color:var(--loss);font-size:13px;min-height:1em;margin-top:4px}
.tkfile{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600}
.tkfile input{display:none}
.tkprev{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-top:8px}
.tkhead h2{margin:8px 0 4px;font-size:19px;word-break:break-word}
.tkimgfull{display:block;max-width:100%;max-height:520px;border-radius:12px;margin:12px 0;object-fit:contain;background:var(--surface-2)}
.tkbody{white-space:pre-wrap;word-break:break-word;line-height:1.6;margin:12px 0;font-size:14.5px}
.tkacts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
ul.tkcs{list-style:none;margin:0 0 10px;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:10px}
ul.tkcs li{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13.5px;word-break:break-word}
ul.tkcs li:last-child{border-bottom:0}
ul.tkcs li div{margin-top:2px;white-space:pre-wrap}
ul.tkcs li.adm{background:color-mix(in srgb, #0f766e 9%, var(--surface))}
ul.tkcs li.adm b{color:#0f766e}
ul.tkcs .linkbtn{float:right}
.faq{display:grid;gap:6px}
.faq details{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.faq summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq .chev{font-style:normal;color:var(--muted);transition:transform .15s;flex:none}
.faq details[open] .chev{transform:rotate(180deg)}
.faq details>div{padding:0 14px 12px;color:var(--muted);line-height:1.6;font-size:13.5px}
.faq details>div b{color:var(--text)}
nav.tabs button.tab-talk{white-space:nowrap}
/* 경기 카드 라운드 표시 */
.mid .rd{font-style:normal;font-size:10px;font-weight:700;color:var(--lgc, var(--accent));line-height:1.1;white-space:nowrap;letter-spacing:-.2px}
@media (prefers-color-scheme: dark){ .mid .rd{color:color-mix(in srgb, var(--lgc, #7096ff) 45%, #fff)} }
/* 헤더 배경의 리그 로고 (옅게) */
.lgwm{position:absolute;right:4%;top:50%;width:260px;height:260px;transform:translateY(-50%) rotate(-10deg);background:center/contain no-repeat;opacity:.09;pointer-events:none;z-index:0}
.lgwm.dk{display:none}
@media (prefers-color-scheme: dark){ .lgwm.lt{display:none} .lgwm.dk{display:block;opacity:.12} }
body{padding-bottom:env(safe-area-inset-bottom)}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
#install{border-color:var(--accent);color:var(--accent);font-weight:600}
#install[hidden]{display:none}
.ios-steps{margin:8px 0 0;padding-left:20px;line-height:1.9}
/* LIVE 탭 */
nav.tabs button.tab-live{color:var(--live);display:inline-flex;align-items:center;gap:6px;letter-spacing:.3px}
nav.tabs button.tab-live.on{color:var(--live);border-bottom-color:var(--live)}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--live);flex:none}
.tab-live.has .ldot{animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(225,29,72,.55)}80%,100%{box-shadow:0 0 0 7px rgba(225,29,72,0)}}
.lcnt{background:var(--live);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px;min-width:17px;text-align:center}
.lcnt:empty{display:none}
.live-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.live-bar h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.live-bar .auto{color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.live-bar .auto i{width:7px;height:7px;border-radius:50%;background:var(--win);animation:pulse 1.6s infinite}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:8px;margin-bottom:18px}
.lgrid>*{min-width:0}
.lcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--live);border-radius:10px;padding:8px 10px;cursor:pointer;box-shadow:var(--shadow)}
.lcard:hover{border-color:var(--live)}
.match .sc{white-space:nowrap}
.lmini .match .sc{font-size:15px}
.lmain{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.lt{min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.3;color:var(--muted)}
.lt.home{align-items:flex-end;text-align:right}
.lt.away{align-items:flex-start;text-align:left}
.lt.lead{color:var(--text)}
.nmrow{display:flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.nmrow .lg{width:22px;height:22px;flex:none}
.nmrow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lpbp{font-size:12px;line-height:1.35;color:#16a34a;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 26px 4px 0;min-height:16px}
.lpbp .pt{font-size:10px;font-weight:700;color:color-mix(in srgb, #16a34a 70%, var(--muted));margin-right:6px;font-variant-numeric:tabular-nums}
.lpbp.big{color:#15803d;font-weight:800}
.lpbp.new{animation:pbpin .6s ease-out}
@keyframes pbpin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-color-scheme: dark){ .lpbp{color:#4ade80} .lpbp.big{color:#86efac} .pbpl li.big{color:#86efac} }
.pbpl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;max-height:340px;overflow:auto}
.pbpl li{display:flex;gap:8px;padding:6px 12px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.4}
.pbpl li:last-child{border-bottom:0}
.pbpl li .pt{flex:none;min-width:52px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;padding-top:1px}
.pbpl li.big{color:#15803d;font-weight:700;background:color-mix(in srgb, #22c55e 8%, transparent)}
.pbpmore{margin-top:6px;font-size:12px}
.ptwrap{overflow-x:auto;margin:8px 0 2px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.ptab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px;text-align:center}
.ptab th{font-size:10.5px;font-weight:700;color:var(--muted);padding:5px 3px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.ptab td{padding:6px 3px;border-bottom:1px solid var(--border)}
.ptab tr:last-child td{border-bottom:0}
.ptab .ptm{text-align:left;padding-left:8px;white-space:nowrap}
.ptab td.ptm{font-weight:600}
.ptab .ptn{display:flex;align-items:center;gap:5px;max-width:190px}
.ptab .ptn>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptab td.ptm small{font-size:9.5px;color:var(--muted);font-weight:500}
.ptab td.ptm .lg{width:18px;height:18px;flex:none}
.ptab .cur{background:color-mix(in srgb, var(--live) 9%, transparent);color:var(--live);font-weight:800}
.ptab th.cur{background:color-mix(in srgb, var(--live) 14%, var(--surface-2))}

// kind별: 받아올 달, 라운드 구분, 라운드 이름
const BR_KIND = {facup:"cup", dfbpokal:"cup", copadelrey:"cup", coppaitalia:"cup", ucl:"uefa", uel:"uefa", unl:"unl", cnl:"cnl", nba:"nba", mlb:"mlb", mls:"mls", champ:"promo", laliga2:"promo"};
const BR_ROUNDS = {
  uefa:[["round-of-16", "16강"], ["quarterfinals", "8강"], ["semifinals", "4강"], ["final", "결승"]],
  unl:[["quarterfinals", "8강"], ["semifinals", "4강"], ["final", "결승"]],
  cnl:[["quarterfinals", "8강"], ["semifinals", "4강"], ["final", "결승"]],
  cup:[["round-of-16", "16강"], ["quarterfinals", "8강"], ["semifinals", "4강"], ["final", "결승"]],
  nba:[["1st Round", "1라운드"], ["Semifinals", "콘퍼런스 준결승"], ["Finals", "콘퍼런스 결승"], ["NBA Finals", "NBA 파이널"]],
  mlb:[["WC", "와일드카드"], ["DS", "디비전시리즈"], ["CS", "챔피언십시리즈"], ["World Series", "월드시리즈"]],
  mls:[["one", "1라운드"], ["semi", "콘퍼런스 준결승"], ["cf", "콘퍼런스 결승"], ["cup", "MLS컵"]],
  promo:[["semi", "준결승"], ["final", "결승"]],
};
const BR_TITLE = {nba:"플레이오프", mlb:"플레이오프", mls:"플레이오프", promo:"승격 PO"};
const PRE_TITLE = {uefa:["녹아웃 플레이오프", "리그 페이즈 9~24위 · 이긴 팀이 16강 진출"], mls:["와일드카드", "8위 vs 9위 단판 · 이긴 팀이 1위와 1라운드"], promo:["엘리미네이터", "5위 vs 8위, 6위 vs 7위 단판 · 이긴 팀이 준결승 진출"]};
const BR = {};  // lg → {state, yr, last, ties, rounds, extra}
function stViewBar(){
  if (!BR_KIND[S.lg] || L().cup) return "";
  const v = S.stView === "bracket" ? "bracket" : "table";
  return `<div class="tkseg sm stview"><button class="${v === "table" ? "on" : ""}" data-stview="table">📊 순위표</button><button class="${v === "bracket" ? "on" : ""}" data-stview="bracket">🏆 ${BR_TITLE[BR_KIND[S.lg]] || "토너먼트"}</button></div>`;
}
// 경기 하나의 라운드 번호 (BR_ROUNDS 순서), 해당 없으면 -1. 'po' = 챔스·유로파 녹아웃 PO
function brRound(kind, ev){
  const slug = (ev.season || {}).slug || "", note = ((ev.competitions || [{}])[0].notes || [{}])[0]?.headline || "";
  if (kind === "uefa" || kind === "unl" || kind === "cnl"){
    if (slug === "knockout-round-playoffs") return "po";
    if (slug === "3rd-place-match") return "3rd";
    return BR_ROUNDS[kind].findIndex(([s]) => s === slug);
  }
  if (kind === "cup"){  // FA컵 5라운드 = 16강
    if (slug === "round-of-16" || slug === "fifth-round") return 0;
    return ["", "quarterfinals", "semifinals", "final"].indexOf(slug);
  }
  if (kind === "mls"){
    if (/wild-card/.test(slug)) return "po";
    if (/round-one/.test(slug)) return 0;
    if (/semifinal/.test(slug)) return 1;
    if (/mls-cup/.test(slug)) return 3;
    if (/final/.test(slug)) return 2;
    return -1;
  }
  if (kind === "promo"){
    if (/eliminator/.test(slug)) return "po";
    if (/semifinal/.test(slug)) return 0;
    if (/final/.test(slug)) return 1;
    return -1;
  }
  const head = note.split(" - ")[0];
  if (kind === "nba"){
    if (/^NBA Finals/.test(head)) return 3;
    if (/Finals$/.test(head)) return 2;
    if (/Semifinals$/.test(head)) return 1;
    if (/1st Round$/.test(head)) return 0;
    return -1;
  }
  if (/^World Series/.test(head)) return 3;
  if (/^(AL|NL)CS$/.test(head)) return 2;
  if (/^(AL|NL)DS$/.test(head)) return 1;
  if (/^(AL|NL)WC$/.test(head)) return 0;
  return -1;
}
async function brFetch(lg, yr){
  const Lg = LEAGUES[lg], kind = BR_KIND[lg];
  // MLB 와일드카드는 9월 말이라 9월 전체를 받으면 정규시즌에 밀려 잘림 → 9/27~30은 하루씩
  const months = kind === "cup" ? [`${yr - 1}12`, "01", "02", "03", "04", "05"] : kind === "uefa" ? ["02", "03", "04", "05", "06"] : kind === "unl" ? ["03", "06"] : kind === "cnl" ? [`${yr - 1}11`, "03", "06"] : kind === "nba" ? ["04", "05", "06"] : kind === "mls" ? ["10", "11", "12"] : kind === "promo" ? ["05", "06"] : ["0927", "0928", "0929", "0930", "10", "11"];
  const st = kind === "nba" || kind === "mlb" ? "&seasontype=3" : "";
  const lists = await Promise.all(months.map(m => espn(`site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard?dates=${m.length === 6 ? m : yr + m}${st}&limit=300`, 600).then(j => j.events || []).catch(() => [])));
  return lists.flat();
}
// 같은 두 팀의 경기(1·2차전 또는 시리즈)를 하나의 '대결'로 묶음
function brTies(kind, events){
  const map = new Map();
  for (const ev of events){
    const r = brRound(kind, ev); if (r === -1) continue;
    const comp = (ev.competitions || [{}])[0], cs = comp.competitors || [];
    if (cs.length !== 2) continue;
    if (cs.every(c => /^TBD\b/.test(c.team?.displayName || ""))) continue;  // 두 팀 다 미정인 자리는 대진표 빈칸으로
    const ids = cs.map(c => String(c.team.id)).sort(), key = r + "|" + ids.join("-");
    let t = map.get(key);
    if (!t){ t = {key, round:r, teams:{}, games:[], order:[]}; map.set(key, t); }
    for (const c of cs){
      const id = String(c.team.id);
      if (!t.teams[id]){ t.teams[id] = {id, name:c.team.displayName, logo:c.team.logo || (c.team.logos || [{}])[0]?.href, goals:0, wins:0, seed:c.curatedRank?.current}; t.order.push(id); }
    }
    t.games.push({ev, comp, date:ev.date, done:!!comp.status?.type?.completed, state:comp.status?.type?.state});
  }
  for (const t of map.values()){
    t.games.sort((a, b) => a.date.localeCompare(b.date));
    const last = t.games[t.games.length - 1];
    for (const g of t.games) if (g.done || g.state === "in") for (const c of g.comp.competitors) t.teams[String(c.team.id)].goals += Number(c.score) || 0;
    const ser = last.comp.series;
    if (ser && Array.isArray(ser.competitors)){
      for (const sc of ser.competitors){ const tm = t.teams[String(sc.id)]; if (!tm) continue; if (sc.wins != null) tm.wins = sc.wins; if (sc.aggregateScore != null) tm.agg = sc.aggregateScore; if (sc.winner) t.winner = String(sc.id); }
      if (ser.completed && !t.winner && (kind === "nba" || kind === "mlb")){ const [a, b] = t.order.map(id => t.teams[id]); t.winner = a.wins > b.wins ? a.id : b.id; }
    }
    if (!t.winner){
      const adv = last.comp.competitors.find(c => c.advance === true) || (last.done && (t.games.length === 1 || kind === "uefa" || kind === "unl" || kind === "cnl" || kind === "cup") ? last.comp.competitors.find(c => c.winner === true) : null);
      if (adv && last.done && (t.games.length === 1 || adv.advance === true || (ser && ser.completed))) t.winner = String(adv.team.id);
    }
    t.done = !!t.winner;
    t.live = t.games.some(g => g.state === "in");
    t.series = kind === "nba" || kind === "mlb" || (kind === "mls" && t.round === 0);
    if (kind === "mls" && t.round === 0 && !t.winner){
      // MLS 1라운드: 3판 2선승(무승부는 승부차기). ESPN 시리즈 정보가 없으면 경기별 승리로 셈
      for (const id of t.order) t.teams[id].wins = 0;
      for (const g of t.games) if (g.done){ const w = g.comp.competitors.find(c => c.winner === true); if (w && t.teams[String(w.team.id)]) t.teams[String(w.team.id)].wins++; }
      const w2 = t.order.find(id => t.teams[id].wins >= 2); if (w2) t.winner = w2;
      t.done = !!t.winner;
    }

function brTree(ties, nRounds){

// 대진이 정해지기 전에는 현재 순위로 자리를 채운 '예상 대진'을 보여주고,

// ---------------------------------------------------------------- 팀 정보: 주목할 선수 · 부상자 · 뉴스 (팀 창 열 때마다 최신으로)
const flatRoster = r => (r && r.athletes || []).flatMap(a => a.items ? a.items : [a]);
const statMap = (names, vals) => { const o = {}; (names || []).forEach((k, i) => { o[k] = vals[i]; }); return o; };
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const md = iso => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };
const timeAgo = iso => { const s = (Date.now() - new Date(iso)) / 1000; if (!isFinite(s)) return "";
  return s < 60 ? "방금 전" : s < 3600 ? Math.round(s / 60) + "분 전" : s < 86400 ? Math.round(s / 3600) + "시간 전" : Math.round(s / 86400) + "일 전"; };

async function keyPlayers(lg, id, roster){
  const sp = LEAGUES[lg].sport, list = flatRoster(roster);
  if (!list.length) return [];
  if (sp === "soccer"){
    return list.map(a => {
      const cats = ((a.statistics || {}).splits || {}).categories || [];
      const s = {}; for (const c of cats) for (const x of c.stats || []) s[x.name] = x.value;
      const g = s.totalGoals || 0, as = s.goalAssists || 0, ap = s.appearances || 0;
      return {a, score:g * 3 + as * 2 + ap * .1 + (s.shotsOnTarget || 0) * .2,
        stats:[["출전", ap], ["골", g], ["도움", as], ["유효슈팅", s.shotsOnTarget ?? "-"]]};
    }).filter(x => x.score > 0).sort((x, y) => y.score - x.score).slice(0, 4);
  }
  // 농구·야구: 선수별 시즌 기록 (1시간 캐시)
  const path = a => `common/v3/sports/${sp}/${LEAGUES[lg].slug}/athletes/${a.id}/overview`;
  const out = [];
  for (let i = 0; i < list.length; i += 10)
    await Promise.all(list.slice(i, i + 10).map(a => espn(path(a), 3600).then(o => { if (o && o.statistics) out.push({a, st:o.statistics}); }).catch(() => {})));
  const rows = out.map(({a, st}) => {
    const split = (st.splits || []).find(x => /Regular|Season/i.test(x.displayName || "") && !/Career/i.test(x.displayName || "")) || (st.splits || [])[0];
    if (!split) return null;
    const m = statMap(st.names, split.stats);
    if (sp === "basketball"){
      if (!num(m.gamesPlayed)) return null;
      return {a, score:num(m.avgPoints) + num(m.avgRebounds) * .5 + num(m.avgAssists) * .7,
        stats:[["득점", m.avgPoints], ["리바", m.avgRebounds], ["어시", m.avgAssists], ["야투%", m.fieldGoalPct], ["경기", m.gamesPlayed]]};
    }
    const pitch = /Pitch/i.test(st.displayName || "") || m.ERA != null || m.earnedRunAverage != null;
    if (pitch){
      const ip = num(m.innings || m.inningsPitched), so = num(m.strikeouts), era = m.ERA ?? m.earnedRunAverage;
      if (!ip) return null;
      return {a, pitch:true, score:ip * .3 + so * .2 - num(era) * 2, stats:[["평균자책", era], ["승", m.wins ?? "-"], ["탈삼진", so], ["이닝", m.innings ?? m.inningsPitched ?? "-"]]};
    }
    const ab = num(m.atBats), h = num(m.hits);
    if (ab < 20) return null;
    return {a, score:num(m.homeRuns) * 3 + num(m.RBIs) + h * .3,
      stats:[["타율", (h / ab).toFixed(3).replace(/^0/, "")], ["홈런", m.homeRuns], ["타점", m.RBIs], ["안타", m.hits]]};
  }).filter(Boolean).sort((x, y) => y.score - x.score);
  if (sp === "baseball") return [...rows.filter(r => !r.pitch).slice(0, 2), ...rows.filter(r => r.pitch).slice(0, 2)];
  return rows.slice(0, 4);
}

function playedIn(sum, teamId, sp){
  const out = {};
  if (!sum) return out;
  if (sp === "soccer"){
    for (const r of sum.rosters || []) if (String(r.team?.id) === String(teamId))
      for (const p of r.roster || []) { const n = p.athlete?.displayName; if (n && (p.starter || p.subbedIn)) out[n] = p.starter ? "선발" : "교체"; }
    return out;
  }
  for (const t of sum.boxscore?.players || []) if (String(t.team?.id) === String(teamId))
    for (const st of t.statistics || []) for (const a of st.athletes || []) {
      const n = a.athlete?.displayName; if (!n || a.didNotPlay || !(a.stats || []).length) continue;
      if (!out[n] || a.starter) out[n] = a.starter ? "선발" : "교체";

}

async function teamInjuries(lg, id, roster, t){
  const Lg = LEAGUES[lg], sp = Lg.sport, list = [];
  const add = (name, status, note, date, img) => { if (name && !list.some(x => x.name === name)) list.push({name, status, note, date, img}); };
  if (sp !== "soccer"){
    const all = await espn(`site/v2/sports/${sp}/${Lg.slug}/injuries`, 600).catch(() => null);
    const mine = ((all || {}).injuries || []).find(x => String(x.id) === String(id));
    for (const i of (mine || {}).injuries || []) add(i.athlete?.displayName, i.status, i.shortComment || "", i.date, i.athlete?.headshot?.href);
  }
  for (const a of flatRoster(roster)) for (const i of a.injuries || [])
    add(a.displayName, i.status || i.type?.description || "부상", (i.details || {}).type || "", i.date, a.headshot?.href);
  // 다음 경기 미리보기의 부상자 명단 (축구는 여기서 주로 나옴)
  const next = t.upcoming[0], last = t.past[0];
  const [nsum, lsum] = await Promise.all([
    next ? espn(summaryPath(lg, next.id), 600).catch(() => null) : null,
    last ? espn(summaryPath(lg, last.id), 3600).catch(() => null) : null]);
  for (const g of (nsum || {}).injuries || []) if (String(g.team?.id) === String(id))
    for (const i of g.injuries || []) add(i.athlete?.displayName, i.status, (i.details || {}).type || "", i.date, i.athlete?.headshot?.href);
  // 복귀 확인: 부상 보고 이후 경기에서 뛰었으면 '복귀'
  const played = playedIn(lsum, id, sp), lastDate = last ? new Date(last.date) : null;
  for (const x of list){
    const how = played[x.name];
    if (!how || !lastDate) continue;
    if (!x.date || new Date(x.date) < lastDate) { x.back = how; x.backDate = last.date; }  // 보고 이후 경기에 뜀 → 복귀
    else { x.played = how; x.backDate = last.date; }  // 최근 경기엔 뛰었지만 그 뒤 새 보고가 있음 → 상태 유지 + 출전 기록 표시
  }
  return list.sort((a, b) => (a.back ? 1 : 0) - (b.back ? 1 : 0));
}

const decOdds = ml => { const n = Number(ml); if (ml == null || ml === "" || !isFinite(n) || n === 0) return null; return n > 0 ? 1 + n / 100 : 1 + 100 / Math.abs(n); };
const fOdds = ml => { const d = decOdds(ml); return d ? d.toFixed(2) : "-"; };
const sgn = v => { const n = Number(v); return n > 0 ? "+" + n : n === 0 ? "0" : String(n); };
function pickOdds(sum){

  return list.find(x => x.overUnder != null || x.spread != null || (x.homeTeamOdds && x.homeTeamOdds.moneyLine != null)) || null;
}
function oddsBlock(m, o, compact){

    rows.push(`<div class="orow"><span class="ok">핸디</span>${cell("홈 " + sgn(sp), fOdds(ho.spreadOdds), started && adj > 0)}${cell("원정 " + sgn(-sp), fOdds(ao.spreadOdds), started && adj < 0)}${st}</div>`);
  }
  if (o.overUnder != null && !isNaN(Number(o.overUnder))){

}
// 경기 상세 창용 배당 표: 구분 | 기준 | 홈 | (무) | 원정 | 결과
function oddsTable(m, o){
  const soccer = L().sport === "soccer", ho = o.homeTeamOdds || {}, ao = o.awayTeamOdds || {};
  const hs = Number(m.home.score) || 0, as = Number(m.away.score) || 0, started = m.state !== "pre", fin = m.state === "post";
  const td = (v, hit, sub) => `<td class="${hit && started ? "hit" : ""}">${sub ? `<small>${sub}</small>` : ""}<b>${v}</b></td>`;
  const res = (txt, good) => `<td class="ores ${good ? "on" : ""}">${txt}</td>`;
  const rows = [];
  if (ho.moneyLine != null || ao.moneyLine != null){
    const r = !started ? "-" : hs > as ? (fin ? "홈승" : "홈 우세") : hs < as ? (fin ? "원정승" : "원정 우세") : (fin ? "무승부" : "동점");
    rows.push(`<tr><th>${soccer ? "승무패" : "승패"}</th><td class="ln">-</td>${td(fOdds(ho.moneyLine), hs > as)}${soccer ? td(fOdds((o.drawOdds || {}).moneyLine), hs === as) : ""}${td(fOdds(ao.moneyLine), hs < as)}${res(r, started)}</tr>`);
  }
  if (o.spread != null && !isNaN(Number(o.spread))){
    const sp = Number(o.spread), adj = hs + sp - as;
    const r = !started ? "-" : adj > 0 ? (fin ? "홈 적중" : "홈 우세") : adj < 0 ? (fin ? "원정 적중" : "원정 우세") : (fin ? "적특" : "동점");
    rows.push(`<tr><th>핸디</th><td class="ln">홈 ${sgn(sp)}</td>${td(fOdds(ho.spreadOdds), adj > 0)}${soccer ? '<td class="na"></td>' : ""}${td(fOdds(ao.spreadOdds), adj < 0)}${res(r, started)}</tr>`);
  }
  if (o.overUnder != null && !isNaN(Number(o.overUnder))){
    const line = Number(o.overUnder), tot = hs + as;
    const r = !started ? "-" : fin ? `${tot}점 · ${tot > line ? "오버" : tot < line ? "언더" : "적특"}` : `현재 ${tot}${tot > line ? " · 오버" : ` · ${+(line - tot).toFixed(1)} 남음`}`;
    rows.push(`<tr><th>언더오버</th><td class="ln">${line}</td>${td(fOdds(o.overOdds), tot > line, "오버")}${soccer ? '<td class="na"></td>' : ""}${td(fOdds(o.underOdds), tot < line, "언더")}${res(r, started)}</tr>`);
  }
  if (!rows.length) return "";
  return `<div class="sec"><div class="sec-h"><h3>배당·기준점</h3><span class="muted sp">${esc((o.provider || {}).name || "ESPN")} 경기 전 기준 · 소수점 · 프로토와 다를 수 있음</span></div>
    <div class="card otbl-wrap"><table class="otbl"><thead><tr><th></th><th>기준</th><th>홈</th>${soccer ? "<th>무</th>" : ""}<th>원정</th><th>${fin ? "결과" : started ? "현재" : "결과"}</th></tr></thead><tbody>${rows.join("")}</tbody></table></div></div>`;
}

// ================================================================ 선수 한국어 이름·사진 (위키데이터)
const WD_KEY = "wdPlayers.v2";
let WD = {};
try { WD = JSON.parse(localStorage.getItem(WD_KEY) || "{}") || {}; } catch { WD = {}; }
const wk = (n, occ) => occ + "|" + n;
function playerNames(sum){
  const out = [];
  for (const r of sum?.rosters || []) for (const p of r.roster || []) out.push(p.athlete?.displayName);
  for (const t of sum?.boxscore?.players || []) for (const st of t.statistics || []) for (const a of st.athletes || []) out.push(a.athlete?.displayName);
  for (const t of sum?.injuries || []) for (const i of t.injuries || []) out.push(i.athlete?.displayName);
  return out.filter(Boolean);
}
async function lookupPlayers(names, occ){
  const need = [...new Set(names)].filter(n => !(wk(n, occ) in WD));
  for (let i = 0; i < need.length; i += 60){
    const chunk = need.slice(i, i + 60);
    const vals = chunk.map(n => JSON.stringify(n) + "@en").join(" ");
    const q = `SELECT ?name ?ko ?kow ?img WHERE { VALUES ?name { ${vals} } ?item rdfs:label|skos:altLabel ?name ; wdt:P106 wd:${occ} .
      OPTIONAL { ?item rdfs:label ?ko FILTER(LANG(?ko) = "ko") }
      OPTIONAL { ?art schema:about ?item ; schema:isPartOf <https://ko.wikipedia.org/> ; schema:name ?kow }
      OPTIONAL { ?item wdt:P18 ?img } }`;
    try {
      const r = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(q));
      if (!r.ok) continue;
      const rows = (await r.json()).results.bindings;
      chunk.forEach(n => { WD[wk(n, occ)] = 0; });  // 0 = 조회했지만 정보 없음
      for (const b of rows){
        const key = wk(b.name.value, occ), cur = WD[key] || {};
        const k = b.ko || b.kow;  // 한국어 레이블이 없으면 한국어 위키백과 문서 제목
        if (k && !cur.ko) cur.ko = k.value.replace(/\s*\(.*?\)\s*/g, " ").trim();
        if (b.img && !cur.img) cur.img = b.img.value;
        WD[key] = cur;
      }
    } catch { /* 위키데이터 실패 시 영어 이름 그대로 */ }
  }
  try { localStorage.setItem(WD_KEY, JSON.stringify(WD)); } catch {}
}
const curOcc = () => OCC[L().sport];
const wd = (n, occ = curOcc()) => WD[wk(n, occ)] || null;
const lastName = n => { const p = (n || "").trim().split(/\s+/); return p.length > 1 ? p.slice(1).join(" ") : (n || ""); };
const koFull = n => (wd(n) && wd(n).ko) || (n ? hangul(n, enSport()) : "");
function koShort(n, occ){
  const ko = wd(n, occ) && wd(n, occ).ko, en = lastName(n);
  if (!ko) return hangul(en, enSport());
  const kt = ko.split(/\s+/);
  if (kt.length < 2) return ko;
  return kt.slice(-Math.min(en.split(/\s+/).length, kt.length - 1)).join(" ");
}
const imgOf = (n, w = 120) => { const u = wd(n) && wd(n).img; return u ? u.replace(/^http:/, "https:") + "?width=" + w : null; };
const nameTitle = n => esc(koFull(n) === n ? n : `${koFull(n)} (${n})`);
const headImg = (url, cls = "hs") => url ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";

// ================================================================ 축구 라인업
const parseLineups = sum => {
  const evs = {};
  const get = id => evs[id] || (evs[id] = {goals:[], og:[], y:[], r:[], in:null, out:null});
  for (const k of sum.keyEvents || []){
    const t = (k.type || {}).type || "", min = (k.clock || {}).displayValue || "";
    const ps = (k.participants || []).map(p => String((p.athlete || {}).id));
    if (!ps.length) continue;
    if (t === "own-goal") get(ps[0]).og.push(min);
    else if (t.startsWith("goal")) get(ps[0]).goals.push(min);
    else if (t === "yellow-card") get(ps[0]).y.push(min);
    else if (t === "red-card") get(ps[0]).r.push(min);
    else if (t === "substitution"){ get(ps[0]).in = min; if (ps[1]) get(ps[1]).out = min; }
  }
  const out = {};
  for (const r of sum.rosters || []){
    const players = (r.roster || []).map(p => {
      const id = String((p.athlete || {}).id);
      return {id, name:(p.athlete || {}).displayName, no:p.jersey, pos:(p.position || {}).abbreviation || "",
              place:Number(p.formationPlace) || 99, starter:!!p.starter, subIn:!!p.subbedIn, ev:evs[id]};
    });
    const used = p => !!(p.subIn || (p.ev && p.ev.in));
    out[r.homeAway] = {teamId:String((r.team || {}).id), formation:r.formation,
      starters:players.filter(p => p.starter),
      subs:players.filter(p => !p.starter).sort((a, b) => used(b) - used(a) || (Number(a.no) || 99) - (Number(b.no) || 99))};
  }
  return out;
};
// ---------------------------------------------------------------- 축구 경기 상세: 주목할 선수 + 결장 의심 선수
// 주목할 선수 = ESPN 경기 데이터의 팀별 득점·도움·슈팅·선방 1위 / 결장 의심 = 최근 주전인데 직전 경기에 안 뛴 선수

async function fillSoccerIntel(lg, m, h, a, sum){
  const box = () => { const el = document.getElementById("sintel"); return el && el.dataset.mid === m.id && modal.open && S.modalMatch === m.id ? el : null; };
  const LEAD = [["goals", "⚽ 득점", /^goals$/i], ["goalAssists", "🅰️ 도움", /assist/i], ["totalShots", "🎯 슈팅", /shot/i], ["saves", "🧤 선방", /save/i]];
  const val = (cat, dv) => { const g = String(dv || "").match(/Matches:\s*(\d+),\s*\w+:\s*(\d+)/); return g ? `${g[1]}경기 ${g[2]}${cat === "goals" ? "골" : "도움"}` : `${dv}${cat === "saves" ? "회" : cat === "totalShots" ? "개" : ""}`; };
  const leaders = tid => { const t = (sum?.leaders || []).find(x => String(x.team?.id) === tid); if (!t) return [];
    return LEAD.map(([k, lab, re]) => { const c = (t.leaders || []).find(x => x.name === k || re.test(x.name || "") || re.test(x.displayName || "")); const x = c?.leaders?.[0]; return x ? {lab, name:x.athlete?.displayName, img:x.athlete?.headshot?.href, v:val(k, x.displayValue)} : null; }).filter(Boolean); };
  const absences = async (t, tid) => {
    const games = t.past.filter(e => e.id !== m.id && e.date < m.date).slice(0, 4);
    if (games.length < 2) return [];
    const sums = await Promise.all(games.map(e => getSummary(e, lg).catch(() => null)));
    const lus = sums.map(s => { if (!s) return null; const lu = parseLineups(s); return [lu.home, lu.away].find(x => x && x.teamId === tid && x.starters.length) || null; });
    const last = lus[0]; if (!last) return [];
    const inLast = new Set([...last.starters, ...last.subs].map(p => p.id)), playedLast = new Set([...last.starters, ...last.subs.filter(p => p.subIn || (p.ev && p.ev.in))].map(p => p.id));
    const starts = {}, info = {};
    for (const lu of lus.slice(1)) if (lu) for (const p of lu.starters){ starts[p.id] = (starts[p.id] || 0) + 1; info[p.id] = p; }
    const older = lus.slice(1).filter(Boolean).length;
    const out = [];
    for (const [id, n] of Object.entries(starts)) if (n >= Math.min(2, older) && !playedLast.has(id))
      out.push({p:info[id], why:inLast.has(id) ? "벤치(미출전)" : "명단 제외", n, of:older});

    return out.sort((x, y) => (y.red ? 1 : 0) - (x.red ? 1 : 0) || (x.why === "명단 제외" ? -1 : 1) - (y.why === "명단 제외" ? -1 : 1));
  };
  const [ah, aa] = await Promise.all([absences(h, m.home.id).catch(() => []), absences(a, m.away.id).catch(() => [])]);
  const lh = leaders(m.home.id), la = leaders(m.away.id);
  await withTimeout(lookupPlayers([...lh, ...la].map(x => x.name).concat([...ah, ...aa].map(x => x.p.name)), OCC.soccer), 4000);
  const el = box(); if (!el) return;
  const col = (t, L1, A1, last) => `<div>${teamHead(m, t.id)}
    ${L1.length ? `<ul class="slead">${L1.map(x => `<li>${headImg(x.img || imgOf(x.name, 80))}<span class="sl">${x.lab}</span><b title="${nameTitle(x.name)}">${esc(koFull(x.name))}</b><span class="sv">${esc(x.v)}</span></li>`).join("")}</ul>` : '<div class="card empty">이번 시즌 선수 기록이 없습니다.</div>'}
    <div class="sabs-h">🚑 결장 의심 <small class="muted">${last ? `직전 경기(${md(last.date)}) 기준` : ""}</small></div>
    ${A1.length ? `<ul class="inj">${A1.map(x => `<li>${headImg(imgOf(x.p.name, 80))}<span class="inn"><span title="${nameTitle(x.p.name)}">${esc(koFull(x.p.name))}</span><small class="muted">${esc(x.p.pos || "")}${x.n ? ` · 이전 ${x.of}경기 중 ${x.n}경기 선발` : ""}</small></span><span class="stt">${esc(x.why)}</span></li>`).join("")}</ul>`
      : '<div class="card empty" style="font-size:12px">최근 주전 중 빠진 선수가 없습니다.</div>'}</div>`;
  const lastOf = t => t.past.find(e => e.id !== m.id && e.date < m.date);
  el.innerHTML = `<div class="sec-h"><h3>주목할 선수 · 결장 의심</h3><span class="muted sp">${m.state === "pre" ? "이번 시즌" : "이 경기"} 팀 내 1위 · 결장은 라인업 기록으로 추정(부상·징계·로테이션 구분 불가)</span></div>
    <div class="cols">${col(m.home, lh, ah, lastOf(h))}${col(m.away, la, aa, lastOf(a))}</div>`;

function evIcons(e, starter){

    <ul class="inj">${t.injuries.map(i => `<li>${headImg(i.athlete?.headshot?.href || imgOf(i.athlete?.displayName, 80))}<span title="${nameTitle(i.athlete?.displayName)}">${esc(koFull(i.athlete?.displayName))}</span>
      <small class="muted">${esc((i.details || {}).type || "")}</small><span class="stt">${esc(INJ[i.status] || i.status || "")}</span></li>`).join("")}</ul></div>`).join("")}</div></div>`;
}

// ---------------------------------------------------------------- 농구
const BB_COLS = [["MIN","출전"],["PTS","득점"],["REB","리바"],["AST","어시"],["STL","스틸"],["BLK","블록"],["TO","턴오버"],["FG","야투"],["3PT","3점"],["FT","자유투"],["+/-","+/-"]];
function basketballSection(m, sum){
  const teams = orderTeams(m, sum?.boxscore?.players || [], x => x.team?.id).filter(t => (t.statistics?.[0]?.athletes || []).length);
  if (!teams.length && m.state !== "post")  // 경기 전·기록 나오기 전: 예상 선발 + 전체 명단 (fillBbPre가 채움)

      <div id="bb-pre" data-mid="${esc(m.id)}"><div class="card empty">선수 명단을 불러오는 중…</div></div></div>` + injuriesBlock(m, sum);

      if (a.didNotPlay || !(a.stats || []).length) return `<tr class="dnp">${playerCell(a)}<td colspan="${cols.length}" class="tl">${esc(({"COACH'S DECISION":"감독 결정","DNP-COACH'S DECISION":"감독 결정","INJURED":"부상","NOT WITH TEAM":"팀 미합류","ILLNESS":"컨디션 난조","SUSPENDED":"출장 정지","PERSONAL REASONS":"개인 사정","REST":"휴식"})[String(a.reason || "").toUpperCase().replace(/^DNP-\s*/, "")] || a.reason || "출전하지 않음")}</td></tr>`;
      return `<tr>${playerCell(a)}${cols.map(([k]) => { const v = a.stats[lab.indexOf(k)]; return `<td class="${k === "PTS" && Number(v) === top && top > 0 ? "hi" : ""}">${esc(v ?? "")}</td>`; }).join("")}</tr>`;

// 경기 전 농구: 팀 명단(ESPN roster) + 직전 경기 선발로 '예상 선발'을 만들고 나머지는 벤치로
async function fillBbPre(m, h, a){
  const Lg = L(), prevOf = t => t.past.find(e => e.id !== m.id && e.date < m.date);
  const ph = prevOf(h), pa = prevOf(a);
  const roster = tid => espn(`site/v2/sports/basketball/${Lg.slug}/teams/${tid}/roster`, 1800).catch(() => null);
  const [rh, ra, sh, sa] = await Promise.all([roster(m.home.id), roster(m.away.id), ph ? getSummary(ph).catch(() => null) : null, pa ? getSummary(pa).catch(() => null) : null]);
  const flat = r => (r?.athletes || []).flatMap(x => x.items || [x]);
  await withTimeout(lookupPlayers([...flat(rh), ...flat(ra)].map(x => x.displayName), OCC.basketball), 6000);
  const box = document.querySelector(`#bb-pre[data-mid="${m.id}"]`);
  if (!box || S.modalMatch !== m.id) return;
  const team = (tid, r, psum, pev) => {
    const pt = (psum?.boxscore?.players || []).find(x => String(x.team?.id) === tid), st = pt?.statistics?.[0], lab = st?.names || [];
    const pa = st?.athletes || [], prevOfId = id => pa.find(y => String(y.athlete?.id) === id);
    let list = flat(r).map(p => ({id:String(p.id), name:p.displayName, pos:p.position?.abbreviation || "", no:p.jersey || "", img:p.headshot?.href, inj:(p.injuries || [])[0]?.status || ""}));
    if (!list.length) list = pa.map(x => ({id:String(x.athlete.id), name:x.athlete.displayName, pos:x.athlete.position?.abbreviation || "", no:x.athlete.jersey || "", img:x.athlete.headshot?.href, inj:""}));
    if (!list.length) return "";
    const out = p => /^(Out|Suspension)$|IL/i.test(p.inj);
    const min = p => { const x = prevOfId(p.id); return x && (x.stats || []).length ? Number(x.stats[lab.indexOf("MIN")]) || 0 : null; };
    const starters = list.filter(p => prevOfId(p.id)?.starter && !out(p));
    const rest = list.filter(p => !starters.includes(p)).sort((x, y) => out(x) - out(y) || (min(y) ?? -1) - (min(x) ?? -1));
    // 직전 선발 중 결장자가 있으면 직전 경기 출전 시간이 가장 긴 벤치 선수로 채움
    if (starters.length) while (starters.length < 5 && rest.length && !out(rest[0]) && min(rest[0]) != null){ const x = rest.shift(); x.alt = true; starters.push(x); }
    const row = p => `<tr class="${out(p) ? "dnp" : ""}"><td class="pn"><span class="pn-in">${headImg(p.img || imgOf(p.name, 80))}<span title="${nameTitle(p.name)}">${esc(koFull(p.name))}</span><small>${esc(p.pos)}</small></span></td>
      <td class="hide-sm">${esc(p.no)}</td><td>${min(p) ?? "-"}</td><td class="tl">${p.inj ? `<span class="bst ${out(p) ? "out" : ""}">${esc(INJ[p.inj] || p.inj)}</span>` : p.alt ? '<span class="bst alt">대체 선발 예상</span>' : ""}</td></tr>`;
    const r5 = pev && resultFor(pev, tid);
    const note = r5 ? `<div class="note lu-note">직전 경기: ${dShort(pev.date)} vs ${esc(ko(r5.op.name))} ${r5.gf}-${r5.ga} · '직전 출전'은 그 경기 출전 시간(분)</div>` : "";
    return `<div class="sec">${teamHead(m, tid)}<div class="box-wrap"><table class="box bbpre">
      <thead><tr><th class="tl">선수</th><th class="hide-sm">번호</th><th>직전<br>출전</th><th class="tl">상태</th></tr></thead>
      <tbody><tr class="grp-row"><td colspan="4">예상 선발</td></tr>${starters.length ? starters.map(row).join("") : '<tr><td colspan="4" class="tl muted">직전 경기 정보가 없습니다</td></tr>'}
      <tr class="grp-row"><td colspan="4">벤치·명단</td></tr>${rest.map(row).join("")}</tbody></table></div>${note}</div>`;
  };
  const html = team(m.home.id, rh, sh, ph) + team(m.away.id, ra, sa, pa);
  box.innerHTML = html || '<div class="card empty">선수 명단 정보가 없습니다.</div>';
}

// ---------------------------------------------------------------- 야구
const BAT_COLS = [["AB","타수"],["R","득점"],["H","안타"],["RBI","타점"],["HR","홈런"],["BB","볼넷"],["K","삼진"],["AVG","타율"]];
const PIT_COLS = [["IP","이닝"],["H","피안타"],["R","실점"],["ER","자책"],["BB","볼넷"],["K","삼진"],["HR","피홈런"],["PC","투구수"],["ERA","평균자책"]];
// 쿼터(농구)·이닝(야구)별 점수표. rows: [{name, logo, ls:[숫자…], total, hits, errors, side}]
function periodTable(sp, rows, live, period, compact){
  const bb = sp === "basketball";
  const n = Math.max(bb ? 4 : 9, ...rows.map(r => r.ls.length));
  const lab = i => bb ? (i < 4 ? `${i + 1}Q` : `OT${i > 4 ? i - 3 : ""}`) : String(i + 1);
  const cur = live ? (Number(period) || Math.max(...rows.map(r => r.ls.length))) - 1 : -1;
  const tail = bb ? ["합"] : ["R", "H", "E"];
  const short = n => { const k = ko(n), p = k.split(" "); return p.length > 1 ? p[p.length - 1] : k; };
  // 합산 줄: 쿼터(이닝)마다 두 팀 점수 합 + 전체 합 (언더오버 볼 때)
  const num = v => v == null || v === "" || !Number.isFinite(Number(v)) ? null : Number(v);
  const add = (a, b) => a == null && b == null ? "" : (a ?? 0) + (b ?? 0);
  const sumRow = () => rows.length !== 2 ? "" : `<tr class="sumrow"><td class="ptm"><span class="ptn"><span>합산</span></span></td>${[...Array(n)].map((_, i) =>
      `<td class="${i === cur ? "cur" : ""}">${add(num(rows[0].ls[i]), num(rows[1].ls[i]))}</td>`).join("")}<td class="tot">${add(num(rows[0].total), num(rows[1].total))}</td>${bb ? "" : `<td>${add(num(rows[0].hits), num(rows[1].hits))}</td><td>${add(num(rows[0].errors), num(rows[1].errors))}</td>`}</tr>`;
  return `<div class="ptwrap"><table class="ptab ${compact ? "cp" : ""} ${bb ? "" : "bsb"}"><thead><tr><th class="ptm"></th>${[...Array(n)].map((_, i) => `<th class="${i === cur ? "cur" : ""}">${lab(i)}</th>`).join("")}${tail.map(t => `<th class="tot">${t}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr><td class="ptm"><span class="ptn">${logo(r.logo)}<span>${esc(compact ? short(r.name) : ko(r.name))}</span>${r.side ? `<small>${r.side}</small>` : ""}</span></td>${[...Array(n)].map((_, i) => { const v = r.ls[i];
      return `<td class="${i === cur ? "cur" : ""}">${v == null || v === "" ? "" : esc(Number.isFinite(Number(v)) ? Number(v) : v)}</td>`; }).join("")}
      <td class="tot">${esc(r.total ?? "")}</td>${bb ? "" : `<td>${esc(r.hits ?? "")}</td><td>${esc(r.errors ?? "")}</td>`}</tr>`).join("")}${sumRow()}</tbody></table></div>`;
}
function lineScore(m, sum){
  const comps = sum?.header?.competitions?.[0]?.competitors || [];
  const rows = orderTeams(m, comps, c => c.team?.id || c.id).filter(c => (c.linescores || []).length);
  if (rows.length < 2) return "";
  const sp = L().sport, st = sum?.header?.competitions?.[0]?.status || {};
  const rs = rows.map(c => ({name:c.team?.displayName, logo:c.team?.logo || (c.team?.logos || [{}])[0]?.href, ls:c.linescores.map(v => v.displayValue ?? v.value),
    total:c.score, hits:c.hits, errors:c.errors, side:String(c.team?.id || c.id) === m.home.id ? "홈" : "원정"}));
  return `<div class="sec"><div class="sec-h"><h3>${sp === "basketball" ? "쿼터별 점수" : "이닝별 점수"}</h3></div>${periodTable(sp, rs, m.state === "in", st.period)}</div>`;
}
function probablesBlock(m){
  const p = [m.home, m.away];
  if (!p.some(t => t.probable)) return "";
  return `<div class="sec"><div class="sec-h"><h3>선발 투수 예고</h3></div><div class="prob">${p.map(t => `<div class="card">
    ${headImg(t.probable?.img || imgOf(t.probable?.name, 96))}<div><div class="muted" style="font-size:12px">${esc(ko(t.name))}</div>
    <b title="${nameTitle(t.probable?.name || "")}">${esc(t.probable ? koFull(t.probable.name) : "미정")}</b>${t.probable?.stat ? `<div class="note">${esc(t.probable.stat)}</div>` : ""}</div></div>`).join("")}</div></div>`;
}
function baseballSection(m, sum){
  const teams = orderTeams(m, sum?.boxscore?.players || [], x => x.team?.id);
  const has = teams.some(t => (t.statistics || []).some(s => (s.athletes || []).length));
  if (!has){
    const msg = m.state === "pre" ? "타순은 보통 경기 몇 시간 전에 발표됩니다." : "이 경기의 선수 기록이 없습니다.";
    return probablesBlock(m) + `<div class="sec"><div class="sec-h"><h3>타순·투수 기록</h3></div><div class="card empty">${msg}</div></div>` + injuriesBlock(m, sum);
  }
  const html = teams.map(t => {
    const bat = (t.statistics || []).find(s => s.type === "batting"), pit = (t.statistics || []).find(s => s.type === "pitching");
    const table = (st, defs, isBat) => {
      if (!st || !(st.athletes || []).length) return "";
      const lab = st.names || st.labels || [], cols = defs.filter(([k]) => lab.includes(k));
      const rows = st.athletes.map(a => {
        const sub = isBat && !a.starter;
        const bo = isBat ? `<span class="bo">${a.starter && a.batOrder ? a.batOrder : ""}</span>` : "";
        return `<tr class="${sub ? "sub" : ""}">${playerCell(a, bo)}${cols.map(([k]) => `<td>${esc((a.stats || [])[lab.indexOf(k)] ?? "")}</td>`).join("")}</tr>`;
      }).join("");
      return `<div class="box-wrap" style="margin-top:8px"><table class="box"><thead><tr><th class="tl">${isBat ? "타자" : "투수"}</th>${cols.map(([, h]) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
    };
    return `<div class="sec">${teamHead(m, String(t.team.id))}${table(bat, BAT_COLS, true)}${table(pit, PIT_COLS, false)}</div>`;
  }).join("");
  return `<div class="sec"><div class="sec-h"><h3>타순·투수 기록</h3><span class="muted sp">숫자는 타순, 들여쓴 선수는 교체 출전</span></div></div>${html}`;
}

// ================================================================ LIVE 탭 (자동 갱신)
const LV = {};            // 리그별 실시간 데이터 {events, raw, t, err, loading}
const LIVE_FAST = 20000;  // 경기 중 갱신 간격
const LIVE_SLOW = 60000;  // 진행 중 경기가 없을 때

function liveCount(lg = S.lg){
  const lv = LV[lg];
  const list = lv && lv.t ? lv.events : D(lg).matches;
  return list.filter(m => m.state === "in").length;
}
function updateLiveBadge(){
  const n = L().disabled ? 0 : liveCount();
  const b = document.querySelector("#tabs .tab-live");
  if (!b) return;
  b.classList.toggle("has", n > 0);
  $("#lcnt").textContent = n ? String(n) : "";
}

async function loadLive(lg){
  const Lg = LEAGUES[lg], base = `site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard`;
  // ESPN 기준 '오늘' + 이 기기 날짜 기준 오늘 (한국은 미국보다 하루 빠름)
  const paths = [base, `${base}?dates=${ymd(new Date())}`];
  const lists = await Promise.all(paths.map(p => espn(p, 0).then(j => j.events || []).catch(() => null)));
  if (lists.every(x => x === null)) throw new Error("데이터를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
  const raw = {};
  for (const e of lists.filter(Boolean).flat()) raw[String(e.id)] = e;
  const events = dedupe(Object.values(raw));
  // 다른 탭(경기 일정 등)도 같은 점수를 보도록 반영
  const d = D(lg);
  for (const m of events){
    const i = d.matches.findIndex(x => x.id === m.id);
    if (i >= 0) d.matches[i] = m;
  }
  // 진행 중인 경기 배당 (경기 상세 데이터에 들어 있음, 2분마다만 새로 받기)
  const odds = {};
  // + 문자중계(카드 위 초록 글씨)용 플레이 기록: 진행 중 경기는 15초마다 새로
  await withTimeout(Promise.all(events.filter(m => m.state === "in").map(m =>
    espn(summaryPath(lg, m.id), 15).then(async s => { odds[m.id] = pickOdds(s);
      if (Lg.sport !== "soccer") await withTimeout(lookupPlayers(playerNames(s), OCC[Lg.sport]), 2500);
      PBP[lg + "|" + m.id] = pbpBuild(lg, m, s); }).catch(() => {}))), 6000);
  if (Lg.sport === "soccer"){
    const names = [];
    for (const e of Object.values(raw)) for (const x of ((e.competitions || [{}])[0].details || [])) for (const a of x.athletesInvolved || []) names.push(a.displayName);
    if (names.length) await withTimeout(lookupPlayers([...new Set(names)], OCC.soccer), 3000);
  }
  return {events, raw, odds};
}

async function refreshLive(){
  const lg = S.lg;
  if (L().disabled) return;
  const lv = LV[lg] || (LV[lg] = {events:[], raw:{}, t:0, prev:{}});
  if (lv.loading) return;
  if (document.hidden && lv.t){ scheduleLive(); return; }  // 화면이 꺼져 있으면 쉬기
  lv.loading = true;
  try {
    const r = await loadLive(lg);
    lv.prev = Object.fromEntries(lv.events.map(m => [m.id, [m.home.score, m.away.score]]));
    lv.events = r.events; lv.raw = r.raw; lv.odds = {...(lv.odds || {}), ...r.odds}; lv.t = Date.now(); lv.err = null;
  } catch (e) { lv.err = e.message; if (!lv.t) lv.t = -1; }
  finally { lv.loading = false; }
  if (S.lg === lg){
    updateLiveBadge();
    if (S.tab === "live") renderLive(true);
    updateModalScore();
  }
  scheduleLive();
}
function scheduleLive(){
  clearTimeout(S.livePoll);
  if (S.tab !== "live" || L().disabled) return;
  const lv = LV[S.lg], now = Date.now();
  const busy = lv && lv.events.some(m => m.state === "in" || (m.state === "pre" && new Date(m.date) - now < 15 * 60000 && new Date(m.date) - now > -3 * 3600000));
  S.livePoll = setTimeout(refreshLive, busy ? LIVE_FAST : LIVE_SLOW);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.tab === "live" && LV[S.lg] && Date.now() - LV[S.lg].t > 10000) refreshLive();
});

// 경기 상세 창이 열려 있으면 점수만 바꿔 줌
function updateModalScore(){
  if (!modal.open || !S.modalMatch) return;
  const m = (LV[S.lg] || {events:[]}).events.find(x => x.id === S.modalMatch);
  const sc = document.querySelector("#mbody .mh .sc");
  if (!m || !sc || m.state === "pre") return;
  sc.textContent = `${m.home.score ?? "-"} : ${m.away.score ?? "-"}`;
  const w = document.querySelector("#mbody .mh .when .live");
  if (w) w.textContent = "● " + (m.state === "in" ? liveText(m) : "경기 종료");
}

// 축구 득점·퇴장 [홈[], 원정[]]
function soccerEvents(m, comp){
  const cols = [[], []];
  for (const x of comp.details || []){
    const id = String((x.team || {}).id), s = id === m.home.id ? 0 : id === m.away.id ? 1 : -1;
    if (s < 0) continue;
    const who = (x.athletesInvolved || [])[0], nm = who ? koShort(who.displayName, OCC.soccer) : "", t = (x.clock || {}).displayValue || "";
    if (x.scoringPlay) cols[s].push(`⚽${esc(nm)} ${esc(t)}${x.penaltyKick ? "(PK)" : ""}${x.ownGoal ? "(자책)" : ""}`);
    else if (x.redCard) cols[s].push(`🟥${esc(nm)} ${esc(t)}`);
  }
  return cols;
}
// 배당 한 줄 요약 (LIVE 카드용)
function oddsLine(m, o, sp = L().sport){
  if (!o) return "";
  const soccer = sp === "soccer", ho = o.homeTeamOdds || {}, ao = o.awayTeamOdds || {};
  const hs = Number(m.home.score) || 0, as = Number(m.away.score) || 0;
  const live = m.state !== "pre";
  const td = (txt, hit) => `<td class="${hit && live ? "hit" : ""}">${txt}</td>`;
  const rows = [];
  if (ho.moneyLine != null || ao.moneyLine != null)
    rows.push(`<tr><th>${soccer ? "승무패" : "승패"}</th><td class="ln">-</td>${td(fOdds(ho.moneyLine), hs > as)}${soccer ? td(fOdds((o.drawOdds || {}).moneyLine), hs === as) : ""}${td(fOdds(ao.moneyLine), hs < as)}</tr>`);
  if (o.spread != null && !isNaN(Number(o.spread))){
    const adj = hs + Number(o.spread) - as;
    rows.push(`<tr><th>핸디</th><td class="ln">홈 ${sgn(o.spread)}</td>${td(fOdds(ho.spreadOdds), adj > 0)}${soccer ? "<td></td>" : ""}${td(fOdds(ao.spreadOdds), adj < 0)}</tr>`);
  }
  if (o.overUnder != null && !isNaN(Number(o.overUnder))){
    const line = Number(o.overUnder), tot = hs + as;
    rows.push(`<tr><th>언오버</th><td class="ln">${line}</td>${td(`<small>오버</small> ${fOdds(o.overOdds)}`, tot > line)}${soccer ? "<td></td>" : ""}${td(`<small>언더</small> ${fOdds(o.underOdds)}`, tot < line)}</tr>`);
  }

  return `<table class="otab"><thead><tr><th></th><th>기준</th><th>홈</th>${soccer ? "<th>무</th>" : ""}<th>원정</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
}

// ctx: {lg, raw, odds, prev, my} — My 경기 탭에서는 다른 리그 경기도 그림
function liveCard(m, ctx){
  if (!ctx || typeof ctx !== "object"){ const lv = LV[S.lg]; ctx = {lg:S.lg, raw:lv.raw, odds:lv.odds || {}, prev:lv.prev || {}}; }
  const Lg = LEAGUES[ctx.lg], sp = Lg.sport;
  const e = ctx.raw[m.id], comp = (e && (e.competitions || [{}])[0]) || {};
  const prev = (ctx.prev || {})[m.id];
  const up = [prev && prev[0] !== m.home.score, prev && prev[1] !== m.away.score];
  const hs = Number(m.home.score) || 0, as = Number(m.away.score) || 0;
  const cOf = side => (comp.competitors || []).find(c => c.homeAway === side) || {};
  const ev = sp === "soccer" ? soccerEvents(m, comp) : [[], []];
  const qs = side => sp === "basketball" ? (cOf(side).linescores || []).map(x => x.value) : [];
  // 좁은 화면에서는 NBA·MLB 팀을 애칭만 (골든스테이트 워리어스 → 워리어스)
  const nm = t => { const full = ko(t.name), parts = full.split(" ");
    return sp !== "soccer" && parts.length > 1 ? `<span class="fulln">${esc(full)}</span><span class="shortn">${esc(parts[parts.length - 1])}</span>` : esc(full); };
  const fin = m.state === "post", pre = m.state === "pre";
  const team = (t, side, i) => {
    const q = qs(side), lead = !pre && (i === 0 ? hs > as : as > hs);
    const win = fin && lead ? `<em class="wbadge">승</em>` : "";
    const sub = [ ev[i].length ? `<small>${ev[i].join(" ")}</small>` : ""].join("");
    return `<div class="lt ${i ? "away" : "home"} ${lead || pre ? "lead" : ""}">
      <div class="nmrow">${i ? logo(t.logo) : win}<span class="nm">${nm(t)}</span>${i ? win : logo(t.logo)}</div>${sub}</div>`;
  };
  let extra = "";
  // 쿼터(농구)·이닝(야구)별 점수표
  if (!pre && sp !== "soccer"){
    const row = (t, side) => { const c = cOf(side); return {name:t.name, logo:t.logo, ls:(c.linescores || []).map(x => x.value), total:side === "home" ? hs : as, hits:c.hits, errors:c.errors}; };
    const rs = [row(m.home, "home"), row(m.away, "away")];
    if (rs.some(r => r.ls.length)) extra += periodTable(sp, rs, m.state === "in", m.period, true);
  }
  if (sp === "baseball" && comp.situation && m.state === "in"){
    const s = comp.situation;
    const dia = `<span class="dia"><i class="${s.onSecond ? "on" : ""}" style="left:10px;top:0"></i><i class="${s.onThird ? "on" : ""}" style="left:2px;top:8px"></i><i class="${s.onFirst ? "on" : ""}" style="left:18px;top:8px"></i></span>`;
    const outs = `<span class="outs">아웃${[0, 1, 2].map(i => `<i class="${i < (s.outs || 0) ? "on" : ""}"></i>`).join("")}</span>`;
    const bat = s.batter?.athlete?.shortName, pit = s.pitcher?.athlete?.shortName;
    extra = `<div class="lx">${dia}${outs}${s.balls != null ? `<span>B-S ${s.balls}-${s.strikes}</span>` : ""}${bat ? `<span>타자 ${esc(bat)}</span>` : ""}${pit ? `<span>투수 ${esc(pit)}</span>` : ""}</div>`;
  }
  const sum = sp === "soccer" || pre ? "" : `<span class="ltot">합 ${hs + as}</span>`;
  const center = pre
    ? `<div class="lsc"><b style="font-size:.8em">${timeOnly(m.date)}</b></div><div class="lclk muted">${esc(new Date(m.date).toLocaleDateString("ko-KR", {month:"numeric", day:"numeric", weekday:"short"}))} 예정</div>`
    : `<div class="lsc"><b class="${up[0] ? "up" : ""}">${hs}</b><span>:</span><b class="${up[1] ? "up" : ""}">${as}</b>${sum}</div>
        <div class="lclk ${fin ? "muted" : "live"}">${fin ? "경기 종료" : "● " + esc(liveText(m, sp))}</div>`;
  const head = ctx.my ? `<div class="myhd">${pickBtn(ctx.lg, m.id, true)}<span class="mk" style="background:${Lg.color}">${Lg.mark}</span>${Lg.short !== Lg.mark ? esc(Lg.short) : ""}</div>` : pickBtn(ctx.lg, m.id);
  const open = ctx.my ? `data-mymatch="${ctx.lg}|${m.id}"` : `data-match="${m.id}"`;
  return `<div class="lcard ${fin ? "fin" : pre ? "pre" : ""} ${up[0] || up[1] ? "flash" : ""}" ${open} role="button" tabindex="0">
    ${head}
    ${pbpTicker(ctx.lg, m)}
    <div class="lmain">
      ${team(m.home, "home", 0)}
      <div class="lc">${center}</div>
      ${team(m.away, "away", 1)}
    </div>
    ${extra}${oddsLine(m, (ctx.odds || {})[m.id], sp)}</div>`;
}

    : `<div class="card live-empty" style="margin-bottom:18px"><b>지금 진행 중인 경기가 없습니다</b><span class="muted">경기가 시작되면 이 화면에 점수가 자동으로 나타납니다.</span></div>`;
  const list = (title, ms) => {

    for (const m of ms){
      const k = dkey(m.date);
      if (k !== last){ body += `<div class="muted" style="font-size:12px;margin:4px 0 0 2px;grid-column:1/-1">${esc(dayLabel(m.date))}</div>`; last = k; }
      body += matchCard(m, true);
    }
    return `<div class="strip-h"><h3>${title}</h3><span class="muted">${ms.length}경기</span></div>
      <div class="lmini">${body}</div>`;
  };

  $("#main").innerHTML = html;
}

// ================================================================ My 경기 (내가 담은 경기만 따로)
const MY_KEY = "myPicks.v1";

// 경기일(또는 담은 날) 기준 7일 지난 경기는 자동 정리

const MY = {ev:{}, raw:{}, odds:{}, prev:{}, t:0, loading:false, err:null};
// 묶음: 담은 경기마다 grp(1, 2, 3…). 빈 묶음도 유지하려고 따로 저장
PICKS.forEach(p => { if (!p.grp) p.grp = 1; });
let MYGRPS = (() => { try { return JSON.parse(localStorage.getItem("my.groups") || "[]"); } catch { return []; } })();
const grpList = () => [...new Set([1, ...MYGRPS, ...PICKS.map(p => p.grp)])].sort((a, b) => a - b);
const saveGrps = () => { try { localStorage.setItem("my.groups", JSON.stringify(MYGRPS)); } catch {} try { syncDirty(); } catch {} };
const addGrp = () => { const g = Number((() => { try { return localStorage.getItem("my.addGrp"); } catch { return 1; } })()) || 1; return grpList().includes(g) ? g : 1; };
// 새 묶음 = 아직 안 쓰인 가장 작은 번호 (My가 비어 있으면 1묶음부터)
const freeGrps = n => { const used = new Set([...MYGRPS, ...PICKS.map(p => p.grp)]), out = []; for (let g = 1; out.length < n; g++) if (!used.has(g)) out.push(g); return out; };
const newGrp = () => { const g = freeGrps(1)[0]; MYGRPS.push(g); saveGrps(); return g; };
// 묶음 삭제 뒤 1, 2, 3… 으로 다시 번호 매김
function renumberGrps(){
  const used = [...new Set([...PICKS.map(p => p.grp), ...MYGRPS])].sort((a, b) => a - b), map = {};
  used.forEach((g, i) => map[g] = i + 1);
  PICKS.forEach(p => p.grp = map[p.grp] || 1); MYGRPS = MYGRPS.map(g => map[g]).filter(Boolean);
  if (typeof S.myGrp === "number") S.myGrp = map[S.myGrp] || "all";
  saveGrps(); savePicks();
}
const savePicks = () => { try { localStorage.setItem(MY_KEY, JSON.stringify(PICKS)); } catch {} try { syncDirty(); } catch {} };
const isPicked = (lg, id) => PICKS.some(p => p.lg === lg && p.id === id);
const pickBtn = (lg, id, inline) => { const on = isPicked(lg, id);
  return `<span class="pick ${inline ? "inl" : ""} ${on ? "on" : ""}" data-pick="${lg}|${id}" role="button" title="${on ? "My 경기에서 빼기" : "My 경기에 담기"}">${on ? "★" : "☆"}</span>`; };
function findMatch(lg, id){
  return D(lg).matches.find(x => x.id === id) || ((LV[lg] || {}).events || []).find(x => x.id === id) || MY.ev[lg + "|" + id] || (IDX.list.find(x => x.lg === lg && x.m.id === id) || {}).m || null;
}
function togglePick(lg, id){
  const i = PICKS.findIndex(p => p.lg === lg && p.id === id);
  if (i >= 0) PICKS.splice(i, 1);
  else {
    const m = findMatch(lg, id);
    if (!m) return;
    PICKS.push({lg, id, date:m.date, home:m.home.name, away:m.away.name, at:Date.now(), grp:addGrp()});
    MY.t = 0;  // 다음에 My 탭을 열 때 새로 받기
  }

}

// 미국 동부 날짜 + UTC 날짜 (ESPN 일정 날짜 기준이 리그마다 달라 둘 다 조회)
const espnDates = iso => { const d = new Date(iso);
  return [...new Set([d.toLocaleDateString("en-CA", {timeZone:"America/New_York"}), d.toISOString().slice(0, 10)].map(s => s.replace(/-/g, "")))]; };

async function loadMy(){
  const reqs = new Map();
  for (const p of PICKS){ const Lg = LEAGUES[p.lg]; for (const dd of espnDates(p.date)) reqs.set(`site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard?dates=${dd}`, p.lg); }
  const raw = {};
  const res = await Promise.all([...reqs].map(([path, lg]) => espn(path, 15).then(j => { for (const e of j.events || []) raw[lg + "|" + e.id] = e; return true; }).catch(() => false)));
  if (res.length && !res.some(Boolean)) throw new Error("데이터를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
  const ev = {};
  for (const p of PICKS){ const k = p.lg + "|" + p.id; if (raw[k]){ const n = dedupe([raw[k]])[0]; if (n) ev[k] = n; } }
  // 다른 화면에도 반영
  for (const [k, m] of Object.entries(ev)){ const lg = k.split("|")[0], d = D(lg), i = d.matches.findIndex(x => x.id === m.id); if (i >= 0) d.matches[i] = m; }
  const odds = {};
  await withTimeout(Promise.all(Object.entries(ev).map(([k, m]) => espn(summaryPath(k.split("|")[0], m.id), m.state === "post" ? 3600 : m.state === "in" ? 15 : 120)
    .then(async s => { odds[k] = pickOdds(s); const lg = k.split("|")[0];
      if (m.state === "in" && LEAGUES[lg].sport !== "soccer") await withTimeout(lookupPlayers(playerNames(s), OCC[LEAGUES[lg].sport]), 2500);
      if (m.state !== "pre") PBP[k] = pbpBuild(lg, m, s); }).catch(() => {}))), 7000);
  const names = [];
  for (const [k, e] of Object.entries(raw)) if (ev[k] && LEAGUES[k.split("|")[0]].sport === "soccer")
    for (const x of ((e.competitions || [{}])[0].details || [])) for (const a of x.athletesInvolved || []) names.push(a.displayName);
  if (names.length) await withTimeout(lookupPlayers([...new Set(names)], OCC.soccer), 3000);
  return {ev, raw, odds};
}
async function refreshMy(){

    const r = await loadMy();
    MY.prev = Object.fromEntries(Object.entries(MY.ev).map(([k, m]) => [k, [m.home.score, m.away.score]]));
    MY.ev = r.ev; MY.raw = r.raw; MY.odds = {...MY.odds, ...r.odds}; MY.t = Date.now(); MY.err = null;
  } catch (e) { MY.err = e.message; if (!MY.t) MY.t = -1; }
  finally { MY.loading = false; }
  updateMyBadge();

document.addEventListener("click", e => { if (e.target.closest("[data-syncopen]")) openSync(); });
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-sync]"); if (!b) return;
  const act = b.dataset.sync;
  if (act === "start"){ SYNC.code = newCode(); lsSet("sync.code", SYNC.code); SYNC.t = Date.now(); lsSet("sync.t", String(SYNC.t)); await syncPush(); toast("연동을 시작했습니다 · 다른 기기에서 QR을 찍거나 코드를 입력하세요"); openSync(); }
  else if (act === "join"){
    const c = normCode(document.getElementById("synccode").value);
    if (c.length !== 16){ toast("코드 16자리를 확인해 주세요"); return; }
    b.disabled = true; b.textContent = "연결 중…";
    try {
      const r = await rpc("sync_get", {p_code:c});
      if (!r || !r.data){ toast("그 코드로 연동된 기기가 없습니다. 코드를 확인해 주세요"); b.disabled = false; b.textContent = "연결"; return; }
      SYNC.code = c; lsSet("sync.code", c);
      applySync(mergeSync(r.data, syncState())); await syncPush();
      toast("연결했습니다 · 두 기기 내용을 합쳤습니다"); openSync();
    } catch (err) { toast("연결 실패: " + err.message); b.disabled = false; b.textContent = "연결"; }
  }
  else if (act === "copy"){ try { await navigator.clipboard.writeText(fmtCode(SYNC.code)); toast("코드를 복사했습니다"); } catch { toast(fmtCode(SYNC.code)); } }
  else if (act === "now"){ await syncPull(); toast(SYNC.err ? "동기화 실패: " + SYNC.err : "동기화했습니다"); openSync(); }
  else if (act === "off"){ if (!confirm("이 기기의 연동을 끊을까요? (이 기기 데이터는 그대로 남고, 더 이상 맞추지 않습니다)")) return; SYNC.code = ""; lsSet("sync.code", ""); toast("연동을 끊었습니다"); openSync(); }
});
// QR로 열린 주소(#sync=코드) → 바로 연결 창
function syncFromHash(){
  const m = location.hash.match(/^#sync=([A-Za-z0-9-]{16,24})$/); if (!m) return false;
  history.replaceState(null, "", location.pathname);
  const c = normCode(m[1]);
  if (SYNC.code === c){ toast("이미 연결된 코드입니다"); return true; }
  setTimeout(() => openSync(c), 300); return true;
}

async function loadTalk(cat, force){
  if (!sbOn() || cat === "faq") return;
  if (!force && TK.t[cat] && Date.now() - TK.t[cat] < 30000) return;
  TK.loading = true;
  try {
    const q = pin => `/rest/v1/posts?select=id,created_at,category,nickname,title,body,image_url,likes,comment_count${pin ? ",pinned" : ""}&category=eq.${cat}&order=${pin ? "pinned.desc," : ""}created_at.desc&limit=60`;
    // pinned 칸이 아직 없으면(supabase_pin.sql 실행 전) 고정 없이 불러옴
    try { TK.posts[cat] = await sb(q(TK.pinOk !== false)); } catch (e) { if (TK.pinOk === false) throw e; TK.pinOk = false; TK.posts[cat] = await sb(q(false)); }
    TK.t[cat] = Date.now(); TK.err = null;
  } catch (e) { TK.err = e.message; }
  finally { TK.loading = false; }
  if (S.tab === "talk" && TK.cat === cat) renderTalk(true);
}

// 사진은 긴 변 1280px JPEG로 줄여서 올림
function shrinkImage(file){
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("사진을 처리하지 못했습니다")), "image/jpeg", .85);
    };
    img.onerror = () => rej(new Error("사진을 열지 못했습니다")); img.src = URL.createObjectURL(file);
  });
}

const BIG = {day:"", list:null, loading:false};
async function loadBig(){
  const today = dkey(new Date().toISOString());
  if (BIG.day === today && (BIG.list || BIG.loading)) return;
  BIG.day = today; BIG.loading = true;
  const games = IDX.list.filter(x => dkey(x.m.date) === today && x.m.state !== "post");
  const lgs = [...new Set(games.map(x => x.lg))];
  if (lgs.some(lg => LEAGUES[lg].national)) await withTimeout(loadFifa(), 3000);
  const ranks = {};
  await Promise.all(lgs.filter(lg => !LEAGUES[lg].national).map(async lg => {
    try { const st = await loadStandings(lg); const r = {}; for (const g of st.groups) for (const row of g.rows) r[row.id] = {...row, n:g.rows.length}; ranks[lg] = r; } catch {}
  }));
  const out = [];
  for (const x of games){
    const Lg = LEAGUES[x.lg], sp = Lg.sport;
    if (Lg.national){
      const a = fifaOf(x.m.home.name), b = fifaOf(x.m.away.name);
      if (a && b && a.rank <= 40 && b.rank <= 40) out.push({...x, sc:100 - a.rank - b.rank, why:`FIFA ${a.rank}위 vs ${b.rank}위`});
      continue;
    }
    const R = ranks[x.lg] || {}, a = R[x.m.home.id], b = R[x.m.away.id];
    if (!a || !b || (!a.p && !a.w && !a.l)) continue;
    if (sp === "soccer"){
      const top = Math.max(4, Math.round(a.n / 3));
      if (a.rank <= top && b.rank <= top) out.push({...x, sc:90 - (a.rank + b.rank) * 3, why:`${a.rank}위 vs ${b.rank}위 ${Math.min(a.rank, b.rank) <= 2 && Math.abs(a.rank - b.rank) <= 2 ? "선두 경쟁" : "상위권 맞대결"}`});
    } else if (a.wp >= .58 && b.wp >= .58) out.push({...x, sc:(a.wp + b.wp) * 50, why:`승률 ${a.pct} vs ${b.pct} 강팀 맞대결`});
  }
  BIG.list = out.sort((p, q) => q.sc - p.sc).slice(0, 5);
  BIG.loading = false;
  if (S.tab === "home") renderHome(true);
}

const BETLOG_KEY = "betLog.v1";
let BETLOG = lsJson(BETLOG_KEY, []);  // [{k, lg, date, home, away, res, ou, line, rHit, oHit}]
const saveBet = () => { lsSet(BETLOG_KEY, JSON.stringify(BETLOG.slice(-500))); try { syncDirty(); } catch {} };
function setBet(k, field, val){
  const p = PICKS.find(x => x.lg + "|" + x.id === k); if (!p) return;
  const m = MY.ev[k]; if (m && m.state !== "pre"){ toast("경기가 시작돼 예측을 바꿀 수 없습니다"); return; }
  p.bet = p.bet || {};
  p.bet[field] = p.bet[field] === val ? null : val;
  if (field === "ou") p.bet.line = p.bet.ou ? Number((MY.odds[k] || {}).overUnder) : null;
  savePicks();
  const i = BETLOG.findIndex(b => b.k === k);
  if (!p.bet.res && !p.bet.ou){ if (i >= 0) BETLOG.splice(i, 1); }
  else { const e = {k, lg:p.lg, date:p.date, home:p.home, away:p.away, res:p.bet.res || null, ou:p.bet.ou || null, line:p.bet.line ?? null, rHit:null, oHit:null}; if (i >= 0) BETLOG[i] = e; else BETLOG.push(e); }
  saveBet();
}
// 끝난 경기 채점
function gradeBets(){
  let ch = false;
  for (const b of BETLOG){
    if (b.rHit !== null || b.oHit !== null) continue;
    const [lg, id] = b.k.split("|"), m = MY.ev[b.k] || (IDX.list.find(x => x.lg === lg && x.m.id === id) || {}).m;
    if (!m || m.state !== "post") continue;
    const hs = Number(m.home.score) || 0, as = Number(m.away.score) || 0;
    let w = hs > as ? "home" : hs < as ? "away" : "draw";
    if (w === "draw" && sportOf(lg) !== "soccer") w = m.home.winner ? "home" : m.away.winner ? "away" : "draw";
    if (b.res) b.rHit = b.res === w;
    if (b.ou && b.line != null && !isNaN(b.line)){ const t = hs + as; b.oHit = t === b.line ? null : (b.ou === "over") === (t > b.line); if (b.oHit === null) b.ou = null; }
    if (!b.res) b.rHit = null;
    b.done = true; ch = true;
  }
  if (ch) saveBet();
}
function betRow(it){
  const p = it.p, m = it.m, k = it.k; if (!m) return "";
  const sp = sportOf(p.lg), bet = p.bet || {}, pre = m.state === "pre", post = m.state === "post", log = BETLOG.find(b => b.k === k) || {};
  if (!pre && !bet.res && !bet.ou) return "";
  const o = MY.odds[k] || {}, ho = o.homeTeamOdds || {}, ao = o.awayTeamOdds || {};
  const nm = t => { const s = ko(t.name).split(" "); return sp === "soccer" ? ko(t.name) : s[s.length - 1]; };
  const hs = Number(m.home.score) || 0, as = Number(m.away.score) || 0;
  const actual = post ? (hs > as ? "home" : hs < as ? "away" : sp === "soccer" ? "draw" : m.home.winner ? "home" : "away") : null;
  const line = pre ? Number(o.overUnder) : bet.line;
  const ouAct = post && line != null && !isNaN(line) && hs + as !== line ? (hs + as > line ? "over" : "under") : null;
  // 한 칸 = 선택지 이름 + 배당. 고른 칸은 파란색, 끝난 경기는 실제 결과 칸에 테두리 + 내 선택에 ✅/❌

    return `<button class="bcell ${on ? "on" : ""} ${act === v ? "act" : ""}" ${pre ? `data-bet="${esc(k)}|${f}|${v}"` : "disabled"}>
      <span class="bn">${esc(lab)}</span>${odd && odd !== "-" ? `<small>${odd}</small>` : ""}${on && post ? `<em>${hit === true ? "✅" : hit === false ? "❌" : ""}</em>` : ""}</button>`; };
  const res = [["home", `${nm(m.home)} 승`, fOdds(ho.moneyLine)], ...(sp === "soccer" ? [["draw", "무승부", fOdds((o.drawOdds || {}).moneyLine)]] : []), ["away", `${nm(m.away)} 승`, fOdds(ao.moneyLine)]];
  const hasOU = line != null && !isNaN(line) && (pre || bet.ou);
  return `<div class="betbox"><div class="bh"><b>🎯 내 예측</b><small>${pre ? "시작 전까지 고르기 · 다시 누르면 취소" : m.state === "in" ? "경기 중 · 끝나면 채점" : "결과 · 테두리 = 실제 결과"}</small></div>
    <div class="bgrid c${res.length}"><span class="bk">승패</span>${res.map(([v, l, od]) => cell("res", v, l, od, actual)).join("")}</div>
    ${hasOU ? `<div class="bgrid c2"><span class="bk">언오버<b>${line}</b></span>${cell("ou", "over", "오버", fOdds(o.overOdds), ouAct)}${cell("ou", "under", "언더", fOdds(o.underOdds), ouAct)}</div>` : ""}</div>`;
}

// 홈 적중률 카드
function betStats(){
  gradeBets();
  if (!BETLOG.length) return "";
  const today = dkey(new Date().toISOString()), wk = Date.now() - 7 * 864e5;

function teamKeys(lg, t){
  const k = ko(t.name), en = t.name || "", strong = new Set([normS(k), normS(en), ...(ALIAS[en] || []).map(normS)]), weak = new Set();
  const kw = k.split(/\s+/), ew = en.split(/\s+/);

    if (ew.length > 1 && ew[ew.length - 1].length >= 4) weak.add(normS(ew[ew.length - 1]));
    if (kw.length > 1 && /[가-힣]/.test(kw[0]) && kw[0].length >= 2) weak.add(normS(kw[0]));
    if (ew.length > 1 && ew[0].length >= 5) weak.add(normS(ew[0]));
  } else {
    const kn = normS(k);
    if (kn.length >= 4) weak.add(kn.slice(0, 4));          // 5글자 줄임 (울버햄튼 → 울버햄)
    if (kn.length >= 3 && ew.length > 1) weak.add(kn.slice(0, 3) + ew[ew.length - 1][0].toLowerCase());  // 맨체스C · 레스터C
