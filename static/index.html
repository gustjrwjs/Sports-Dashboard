function slipMatch(text){
  const from = Date.now() - 2 * 864e5, until = Date.now() + 10 * 864e5;
  // 한 줄(+다음 줄) 안에 두 팀이 같이 나와야 한 경기로 봄 → 다른 줄의 팀끼리 잘못 엮이지 않음
  const lines = text.split(/\n+/).map(normS).filter(x => x.length > 1);
  const wins = lines.map((l, i) => l + (lines[i + 1] || ""));
  const ALL = normS(text);
  // 한 글자만 다른 표기도 인정 (선즈↔선스, 호네츠↔호니츠): 한글 3글자 이상, 앞 글자 또는 뒤 글자가 같아야 함
  const near = (T, k) => { if (k.length < 3 || !/[가-힣]/.test(k)) return false;
    for (let i = 0; i <= T.length - k.length; i++){ let d = 0; for (let j = 0; j < k.length && d < 2; j++) if (T[i + j] !== k[j]) d++; if (d < 2 && (T[i] === k[0] || T[i + k.length - 1] === k[k.length - 1])) return true; }
    return false; };
  const keys = new Map();
  const hit = (T, lg, t) => { const id = lg + t.id; let k = keys.get(id); if (!k){ k = teamKeys(lg, t); keys.set(id, k); }
    return k.strong.some(s => T.includes(s)) ? 2 : k.weak.some(s => T.includes(s)) || [...k.strong, ...k.weak].some(s => near(T, s)) ? 1 : 0; };
  const both = [], one = [];
  for (const x of IDX.list){
    const d = new Date(x.m.date).getTime(); if (d < from || d > until) continue;
    if (!hit(ALL, x.lg, x.m.home) && !hit(ALL, x.lg, x.m.away)) continue;
    let best = 0;
    for (const w of wins){ const h = hit(w, x.lg, x.m.home), a = hit(w, x.lg, x.m.away); if (h && a) best = Math.max(best, h + a); }
    if (best) both.push({...x, sc:best, both:true});
    else { const h = hit(ALL, x.lg, x.m.home), a = hit(ALL, x.lg, x.m.away); if (Math.max(h, a) === 2) one.push({...x, sc:1, both:false}); }
  }
  // 같은 두 팀 경기가 여러 개면(홈·원정 2연전 등) 지금과 가장 가까운 경기만 (진행 중 우선)
  const dist = x => x.m.state === "in" ? -1 : Math.abs(new Date(x.m.date) - Date.now());
  const pairKey = x => x.lg + [x.m.home.id, x.m.away.id].sort().join("-");
  const pick = list => { const m = new Map(); for (const x of list.sort((a, b) => b.sc - a.sc || dist(a) - dist(b))) if (!m.has(pairKey(x))) m.set(pairKey(x), x); return [...m.values()]; };
  // 점수 높은(더 확실한) 경기부터 담고, 이미 쓴 팀이 들어간 경기는 버림 → 한 줄의 팀이 두 경기에 쓰이지 않음
  const used = new Set(), strong = [];
  for (const x of pick(both).sort((a, b) => b.sc - a.sc || dist(a) - dist(b))){
    const ks = [x.lg + x.m.home.id, x.lg + x.m.away.id];
    if (ks.some(k => used.has(k))) continue;
    ks.forEach(k => used.add(k)); strong.push(x);
  }
  // 한 팀만 읽힌 경우: 그 팀의 가장 가까운 경기 하나만 후보로
  const byTeam = new Map();
  for (const x of one.sort((a, b) => dist(a) - dist(b))){
    if (used.has(x.lg + x.m.home.id) || used.has(x.lg + x.m.away.id)) continue;
    const ks = [x.lg + x.m.home.id, x.lg + x.m.away.id].filter(k => !byTeam.has(k));
    if (ks.length === 2) { byTeam.set(ks[0], x); byTeam.set(ks[1], x); }
  }
  const weak = [...new Set(byTeam.values())];

}

      if (S.lg === lg) render();

      if (d.forms === null || force) loadForms(lg);
      schedulePoll();
    } catch (e) {
      $("#upd").textContent = "";
      if (S.lg === lg && !d.loaded) $("#main").innerHTML = errBox(e) + '<button class="btn" data-retry="1">다시 시도</button>';
      else $("#upd").textContent = "업데이트 실패";
    } finally { d.loading = null; }
  })();
  return d.loading;
}
function schedulePoll(){
  clearTimeout(S.poll);
  const now = Date.now(), lg = S.lg;
  const active = D().matches.some(m => m.state === "in" || (m.state === "pre" && new Date(m.date).getTime() < now + 10 * 60000 && new Date(m.date).getTime() > now - 4 * 3600000));
  if (active) S.poll = setTimeout(async () => {  // 경기 중에는 1분마다 자동 갱신
    if (S.lg !== lg || S.season) return;  // 지난 시즌은 자동 갱신 안 함
    try { applyStandings(lg, await loadStandings(lg)); await loadMatches(lg); if (S.lg === lg && !modal.open) render(); } catch {}
    schedulePoll();
  }, 60000);
}
// 시즌 이름: 축구(가을~봄) 2025-26, NBA 2025-26(연도는 끝나는 해), MLB·MLS 2025
function seasonLabel(lg, y){
  y = Number(y);
  if (lg === "nba") return `${y - 1}-${String(y).slice(2)}`;
  if (lg === "mlb" || lg === "mls" || lg === "intfr") return String(y);
  return `${y}-${String(y + 1).slice(2)}`;
}
function setSeason(y){
  const cur = (ST[S.lg] || {}).curYear;
  S.season = !y || Number(y) === cur ? null : Number(y);
  S.chip = "ALL"; S.mStatus = "ALL";
  if (S.tab === "live" || S.tab === "my" || S.tab === "talk") S.tab = "standings";  // 지난 시즌엔 실시간 탭 대신 순위표
  window.scrollTo(0, 0);
  render();
  if (!D().loaded) loadLeague(S.lg);
}
document.addEventListener("change", e => { if (e.target.id === "seasonSel") setSeason(e.target.value); });
// 선택한 경기를 다른 묶음으로 옮기기
document.addEventListener("change", e => {
  if (!e.target.matches("[data-myact-move]") || !S.mySel || !S.mySel.size) return;
  let g = e.target.value; if (!g) return;
  g = g === "new" ? newGrp() : Number(g);
  const n = S.mySel.size;
  PICKS.forEach(p => { if (S.mySel.has(p.lg + "|" + p.id)) p.grp = g; });
  S.mySel = null; renumberGrps(); savePicks(); toast(`${n}경기를 ${g}묶음으로 옮겼습니다`); renderMy(true);
});

function setLeague(lg){
  if (!LEAGUES[lg]) lg = DEFAULT_LG;
  if (LEAGUES[lg].national) loadFifa();
  if (S.lg !== lg) S.season = null;  // 리그를 바꾸면 현재 시즌으로
  S.lg = lg; S.chip = "ALL"; S.mStatus = "ALL";
  try { localStorage.setItem("league", lg); } catch {}
  if (location.hash.slice(1) !== lg) history.replaceState(null, "", "#" + lg);
  window.scrollTo(0, 0);
  render();
  if (!LEAGUES[lg].disabled && !D(lg).loaded) loadLeague(lg);
  else schedulePoll();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-pick],[data-mymatch],[data-season],[data-stview],[data-lg],[data-tab],[data-gnav],[data-chip],[data-mstatus],[data-week],[data-match],[data-team],[data-retry]");
  if (!t) return;
  if (t.dataset.pick){ e.preventDefault(); const [lg, id] = t.dataset.pick.split("|"); togglePick(lg, id); return; }
  if (t.dataset.mymatch){ const [lg, id] = t.dataset.mymatch.split("|"); openMyMatch(lg, id); return; }
  if (t.dataset.season !== undefined){ setSeason(t.dataset.season); return; }
  if (t.dataset.stview){ S.stView = t.dataset.stview; try { localStorage.setItem("stView", S.stView); } catch {} render(); return; }
  if (t.dataset.lg){ if (!LG_TABS.includes(S.tab)) S.tab = S.lastLgTab || "standings"; setLeague(t.dataset.lg); }
  else if (t.dataset.tab){ S.tab = t.dataset.tab; window.scrollTo(0, 0); render(); }
  else if (t.dataset.gnav){ const g = t.dataset.gnav; S.tab = g === "league" ? (S.lastLgTab || "standings") : g; window.scrollTo(0, 0); render(); if (g === "league" && !L().disabled && !D().loaded) loadLeague(S.lg); }
  else if (t.dataset.chip){ S.chip = t.dataset.chip; render(); }
  else if (t.dataset.mstatus){ S.mStatus = t.dataset.mstatus; render(); }
  else if (t.dataset.week){ moveWeek(Number(t.dataset.week)); }
  else if (t.dataset.match){ openMatch(t.dataset.match); }
  else if (t.dataset.team){ openTeam(t.dataset.team, Number(t.dataset.n) || 5); }
  else if (t.dataset.retry){ loadLeague(S.lg); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr[data-team]")) openTeam(e.target.dataset.team); });
$("#mclose").onclick = () => modal.close();
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
// 왼쪽 위 앱 이름 → 홈 (새로고침 없이)
$("#homeLink").onclick = e => { if (e.ctrlKey || e.metaKey || e.shiftKey) return; e.preventDefault(); if (modal.open) modal.close(); S.tab = "home"; history.replaceState(null, "", location.pathname); window.scrollTo(0, 0); render(); };
$("#searchBtn").onclick = () => openSearch();
$("#notiBtn").onclick = () => openNoti();
updateNotiBtn(); if (NOTI.on) setTimeout(notiTick, 3000);
setTimeout(syncPull, 1500);  // 연동돼 있으면 다른 기기 변경 받기
$("#pipBtn").onclick = () => openPip();
$("#refresh").onclick = () => {
  if (L().disabled) return;
  memo.clear();
  const d = D(); d.teamCache = {}; d.sumCache = {}; d.forms = null;
  loadLeague(S.lg, true);
};
window.addEventListener("hashchange", () => { if (syncFromHash()){ S.tab = "my"; render(); return; } const k = location.hash.slice(1); if (LEAGUES[k] && k !== S.lg) setLeague(k); });

const fromSyncLink = syncFromHash();  // QR로 연 경우(#sync=코드)
let start = location.hash.slice(1);
if (!LEAGUES[start]) S.tab = fromSyncLink ? "my" : "home";  // 주소에 리그가 없으면 홈부터
if (!LEAGUES[start]) { try { start = localStorage.getItem("league") || DEFAULT_LG; } catch { start = DEFAULT_LG; } }
setLeague(start);

// ================================================================ 앱 설치 (PWA)
(() => {
  const btn = $("#install");
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (standalone) return;
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  window.addEventListener("appinstalled", () => { btn.hidden = true; deferred = null; });
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const inApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua);
  const isMobile = isIOS || /Android/i.test(ua);
  if (isMobile && location.protocol !== "file:") btn.hidden = false; // 안내라도 보여줌
  btn.onclick = async () => {
    if (deferred) {
      deferred.prompt();
      await deferred.userChoice.catch(() => {});
      deferred = null;
      return;
    }
    let steps;
    if (inApp) {
      steps = `<p>카카오톡·네이버 같은 앱 안의 브라우저에서는 설치할 수 없습니다.</p>
        <ol class="ios-steps"><li>오른쪽 아래(또는 위) <b>⋮ / 공유</b> 메뉴를 누르세요.</li>
        <li><b>${isIOS ? "Safari로 열기" : "다른 브라우저로 열기(Chrome)"}</b>를 고르세요.</li>
        <li>열린 화면에서 다시 <b>앱 설치</b>를 누르세요.</li></ol>`;
    } else if (isIOS) {
      steps = `<p>아이폰은 Safari에서 이렇게 설치합니다.</p>
        <ol class="ios-steps"><li>화면 아래(또는 주소창 옆) <b>공유 버튼</b>(네모에 위쪽 화살표)을 누르세요.</li>
        <li>목록을 내려 <b>홈 화면에 추가</b>를 누르세요.</li>
        <li>오른쪽 위 <b>추가</b>를 누르면 홈 화면에 앱 아이콘이 생깁니다.</li></ol>`;
    } else {
      steps = `<p>브라우저 메뉴에서 설치할 수 있습니다.</p>
        <ol class="ios-steps"><li>Chrome 오른쪽 위 <b>⋮</b> 메뉴를 누르세요.</li>
        <li><b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.</li></ol>`;
    }
    $("#mbody").innerHTML = `<h2 style="margin:4px 0 8px">앱으로 설치하기</h2>${steps}
      <p class="muted" style="margin-top:12px">설치하면 홈 화면 아이콘으로 바로 열리고, 주소창 없이 앱처럼 보입니다. 업데이트는 자동으로 반영됩니다.</p>`;
    $("#modal").showModal();
  };
})();
</script>
