<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스포츠 대시보드</title>
<meta name="description" content="축구·농구·야구 순위표, 경기 일정·결과, 라인업을 한곳에서">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스포츠">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f0f2f7; --text:#131722; --muted:#5f6779;
  --border:#e1e5ee; --accent:#1d4ed8; --accent-soft:#e7eeff;
  --win:#15803d; --win-bg:#dcfce7; --draw:#5f6779; --draw-bg:#eceef3; --loss:#b91c1c; --loss-bg:#fee2e2;
  --live:#e11d48; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1016; --surface:#151a23; --surface-2:#1c2230; --text:#e7eaf0; --muted:#97a0b2;
    --border:#262d3b; --accent:#7096ff; --accent-soft:#1b2747;
    --win:#4ade80; --win-bg:#13301f; --draw:#a3abbb; --draw-bg:#262c38; --loss:#f87171; --loss-bg:#3a1a1c;
    --live:#fb7185; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
body{padding-bottom:env(safe-area-inset-bottom)}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
#install{border-color:var(--accent);color:var(--accent);font-weight:600}
#install[hidden]{display:none}
.ios-steps{margin:8px 0 0;padding-left:20px;line-height:1.9}
/* LIVE 탭 */
nav.tabs button.tab-live{color:var(--live);display:inline-flex;align-items:center;gap:6px;letter-spacing:.3px}
nav.tabs button.tab-live.on{color:var(--live);border-bottom-color:var(--live)}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--live);flex:none}
.tab-live.has .ldot{animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(225,29,72,.55)}80%,100%{box-shadow:0 0 0 7px rgba(225,29,72,0)}}
.lcnt{background:var(--live);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px;min-width:17px;text-align:center}
.lcnt:empty{display:none}
.live-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.live-bar h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.live-bar .auto{color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.live-bar .auto i{width:7px;height:7px;border-radius:50%;background:var(--win);animation:pulse 1.6s infinite}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:8px;margin-bottom:18px}
.lgrid>*{min-width:0}
.lcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--live);border-radius:10px;padding:8px 10px;cursor:pointer;box-shadow:var(--shadow)}
.lcard:hover{border-color:var(--live)}
.match .sc{white-space:nowrap}
.lmini .match .sc{font-size:15px}
.lmain{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.lt{min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.3;color:var(--muted)}
.lt.home{align-items:flex-end;text-align:right}
.lt.away{align-items:flex-start;text-align:left}
.lt.lead{color:var(--text)}
.nmrow{display:flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.nmrow .lg{width:22px;height:22px;flex:none}
.nmrow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lt .lq{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.5px;white-space:nowrap}
.lt small{font-size:10.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc{text-align:center;padding:0 2px}
.lsc{position:relative;display:inline-flex;align-items:center;gap:5px;font-size:22px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.lsc span{color:var(--muted);font-weight:600}
.lsc b{border-radius:5px;padding:0 3px}
.lsc b.up{animation:goal 2.2s ease-out}
.ltot{margin-left:2px;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:1px 5px;white-space:nowrap}
.lclk{font-size:11.5px;white-space:nowrap;margin-top:1px}
.lmini{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:6px;margin-bottom:18px}
.lmini>*{min-width:0}
.lmini .match{padding:6px 10px}
@media (max-width:640px){ .lmini{grid-template-columns:1fr} }
/* 승 표시, My 경기 */
.wbadge{font-style:normal;flex:none;display:inline-block;border:1.5px solid var(--live);color:var(--live);background:rgba(225,29,72,.08);border-radius:5px;font-size:11px;font-weight:800;line-height:1;padding:3px 4px}
.match,.lcard{position:relative}
.pick{position:absolute;top:2px;right:6px;font-size:15px;line-height:1;color:var(--muted);opacity:.55;cursor:pointer;padding:2px;z-index:1}
.pick:hover{opacity:1}
.pick.on{color:#f59e0b;opacity:1}
.pick.inl{position:static;margin-left:auto;font-size:17px}
.chip-pick{position:static;display:inline-block;font-size:13px;font-weight:700;border:1px solid var(--border);border-radius:999px;padding:5px 12px;opacity:1;color:var(--text);background:var(--surface)}
.chip-pick.on{border-color:#f59e0b;color:#b45309;background:#fef3c7}
nav.tabs button.tab-my{display:inline-flex;align-items:center;gap:5px}
nav.tabs button.tab-my.on{border-bottom-color:#f59e0b}
.mystar{color:#f59e0b}
.tab-my .lcnt{background:#f59e0b}
.tab-my.has .lcnt{background:var(--live)}
.myhd{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);margin:-2px 0 4px}
.myhd .mk{width:20px;height:20px;font-size:7px;border-radius:5px}
.lcard.fin{border-left-color:var(--muted)}
.lcard.pre{border-left-color:var(--accent)}
.otab{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px;font-variant-numeric:tabular-nums;table-layout:fixed}
.otab th,.otab td{padding:3px 4px;text-align:center;border-top:1px solid var(--border)}
.otab thead th{border-top:1px dashed var(--border);color:var(--muted);font-weight:600;font-size:11px}
.otab tbody th{text-align:left;color:var(--muted);font-weight:700;width:52px}
.otab thead th:nth-child(2){width:62px}
.otab td{font-weight:700}
.otab td.ln{font-weight:600;color:var(--muted)}
.otab td small{font-weight:500;color:var(--muted);font-size:10.5px}
.otab td.hit{background:var(--win-bg);color:var(--win)}
.otab td.hit small{color:var(--win)}
.lx,.lodds{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:11px;color:var(--muted);border-top:1px dashed var(--border);padding-top:4px;margin-top:3px}
.og{display:inline-flex;align-items:center;gap:3px}
.og em{font-style:normal;font-weight:700;margin-right:1px}
.og b{font-weight:700;color:var(--text);background:var(--surface-2);border-radius:4px;padding:0 4px;font-variant-numeric:tabular-nums}
.og b.hit{background:var(--win-bg);color:var(--win)}
.lc-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.lc-t{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:600;min-width:0}
.lc-t span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-t .lg{width:34px;height:34px}
.lc-t.lead{color:var(--text)}
.lc-c{text-align:center}
.lc-sc{font-size:30px;font-weight:800;letter-spacing:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lc-sc b{display:inline-block;border-radius:6px;padding:0 4px}
.lc-sc b.up{animation:goal 2.2s ease-out}
@keyframes goal{0%{background:var(--live);color:#fff}100%{background:transparent}}
.lcard.flash{animation:cardflash 2.2s ease-out}
@keyframes cardflash{0%{box-shadow:0 0 0 3px var(--live)}100%{box-shadow:var(--shadow)}}
.lc-st{font-size:12px}
.lc-ex{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted)}
.lc-ex .r{text-align:right}
.lc-ex.one{grid-template-columns:1fr}
.qt{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.qt th,.qt td{padding:2px 4px;text-align:center}
.qt th{color:var(--muted);font-weight:600}
.qt td:first-child,.qt th:first-child{text-align:left;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt td.tot{font-weight:800}
.bases{display:inline-flex;align-items:center;gap:10px;color:var(--text)}
.dia{position:relative;width:30px;height:24px}
.dia i{position:absolute;width:9px;height:9px;border:1.5px solid var(--muted);transform:rotate(45deg);border-radius:1px}
.dia i.on{background:#f59e0b;border-color:#f59e0b}
.outs i{display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);margin-left:2px}
.outs i.on{background:var(--live);border-color:var(--live)}
.live-empty{text-align:center;padding:28px 16px}
.live-empty b{display:block;font-size:16px;margin-bottom:4px;color:var(--text)}
.shortn{display:none}
@media (max-width:640px){ .lgrid{grid-template-columns:1fr} .lcard{padding:7px 8px} .lmain{gap:6px} .lsc{font-size:19px;gap:4px} .nmrow{gap:4px} .nmrow .lg{width:18px;height:18px} .ltot{font-size:10px;padding:1px 4px} }
@media (max-width:480px){ .fulln{display:none} .shortn{display:inline} }
/* 배당 */
.odds{display:grid;gap:6px}
.odds.compact{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)}
.orow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ok{width:56px;flex:none;font-size:12px;font-weight:700;color:var(--muted)}
.oc{display:inline-flex;align-items:baseline;gap:5px;background:var(--surface-2);border:1px solid transparent;border-radius:7px;padding:3px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.oc small{color:var(--muted)}
.oc b{font-weight:800}
.oc.hit{border-color:var(--win);background:var(--win-bg)}
.oc.hit b{color:var(--win)}
.onow{font-size:11px;color:var(--live);font-weight:700;margin-left:auto}
.osrc{font-size:11px;color:var(--muted);text-align:right}
@media (max-width:480px){
  .top-in .btn{padding:5px 9px;font-size:13px}
  .top-in:has(#install:not([hidden])) .upd{display:none}
}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 0 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mk{border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-.4px;flex:none}
.brand .mk{width:36px;height:36px;font-size:12px}
.brand h1{font-size:17px;margin:0;letter-spacing:-.3px}
.brand .sub{color:var(--muted);font-size:12px}
.upd{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.lgbar{display:flex;flex-wrap:wrap;gap:8px 14px;padding:12px 0 4px}
.lggrp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lggrp + .lggrp{padding-left:14px;border-left:1px solid var(--border)}
.lgcat{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px;white-space:nowrap}
.lgbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:5px 12px 5px 5px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}
.lgbtn .mk{width:26px;height:26px;border-radius:7px;font-size:9px}
.lgbtn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.lgbtn.off{opacity:.6}
.lgbtn small{font-size:10px;color:var(--muted);font-weight:500}
nav.tabs{display:flex;gap:4px;margin-top:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
main{padding:18px 0 48px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.7;margin-left:4px;font-size:12px}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;gap:8px;padding:12px 14px 6px}
.card-h h3{margin:0;font-size:15px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:14px}
.groups.wide{grid-template-columns:1fr}
.groups>*,.mlist>*,.cols>*,.lineups>*{min-width:0}
.tbl-wrap{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.st th{font-size:12px;color:var(--muted);font-weight:600;padding:6px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.st td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.st tr:last-child td{border-bottom:0}
table.st tbody tr{cursor:pointer}
table.st tbody tr:hover td{background:var(--surface-2)}
.tl{text-align:left!important}
td.rk{font-weight:700;box-shadow:inset 4px 0 0 var(--zone);width:34px}
td.pts{font-weight:800}
.tm{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.lg{width:20px;height:20px;object-fit:contain;flex:none}
.lg.big{width:44px;height:44px}
.lg.mid{width:28px;height:28px}
.form{display:inline-flex;gap:3px}
.f{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;font-weight:700}
.f-W{background:var(--win-bg);color:var(--win)}
.f-D{background:var(--draw-bg);color:var(--draw)}
.f-L{background:var(--loss-bg);color:var(--loss)}
.f-x{background:var(--surface-2);animation:pulse 1.2s infinite ease-in-out}
@keyframes pulse{50%{opacity:.4}}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* 경기 목록 */
.day{margin-bottom:16px}
.day h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.day h4 .today{color:var(--accent);margin-left:6px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:8px}
.match{display:grid;grid-template-columns:34px 1fr 92px 1fr;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow)}
.match.nogrp{grid-template-columns:1fr 92px 1fr}
.match:hover{border-color:var(--accent)}
.grp{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 0;text-align:center}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side.home{justify-content:flex-end;text-align:right}
.side.won{font-weight:700}
.mid{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.sc{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.vs{font-weight:700;color:var(--muted)}
.mid small{font-size:11px;color:var(--muted)}
.live{color:var(--live)!important;font-weight:700}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.strip .match{min-width:310px;grid-template-columns:1fr 86px 1fr}
.strip .sc{white-space:nowrap}
.strip-h{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}
.strip-h h3{margin:0;font-size:15px}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav .rng{font-weight:700;min-width:140px;text-align:center}

/* 팀 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.tbtn:hover{border-color:var(--accent)}
.tbtn .meta{font-size:12px;color:var(--muted)}
.lsec{margin-bottom:20px}
.lsec h3{font-size:15px;margin:0 0 10px}

/* 모달 */
dialog{border:0;padding:0;border-radius:16px;background:var(--bg);color:var(--text);width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(5,8,14,.55)}
.m-in{padding:0 18px 18px}
.m-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 10px 6px;background:var(--bg)}
.m-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.m-head h2{margin:0;font-size:20px}
.pill{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.kpi .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted)}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:15px}
.sec-h .sp{margin-left:auto}
ul.res{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:10px}
ul.res li{display:grid;grid-template-columns:76px 96px 36px 1fr auto 26px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border)}
ul.res li:last-child{border-bottom:0}
ul.res .d,ul.res .c,ul.res .ha{font-size:12px;color:var(--muted)}
ul.res .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.res .o{display:flex;align-items:center;gap:8px;min-width:0}
ul.res .o span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.res .s{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
ul.res .s small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
ul.res.fx li{grid-template-columns:120px 96px 36px 1fr}
.empty{padding:14px;color:var(--muted);text-align:center}
.mh{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.mh .t{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:16px;cursor:pointer}
.mh .t small{font-weight:500;color:var(--muted);font-size:12px}
.mh .ctr .sc{font-size:30px}
.mh .ctr .when{font-size:13px;color:var(--muted)}
.meta-line{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.cmp{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cmp .r{display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;padding:7px 14px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.cmp .r:last-child{border-bottom:0}
.cmp .r>div:first-child{text-align:right}
.cmp .r .k{text-align:center;color:var(--muted);font-size:12px}
.cmp .best{font-weight:800;color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols ul.res li{grid-template-columns:64px 1fr auto 26px}
.err{background:var(--loss-bg);color:var(--loss);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.soon{padding:28px;text-align:center;line-height:1.7}
.soon h2{margin:0 0 6px;font-size:18px}

/* 축구 라인업 */
.goals{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.goals>div:first-child{text-align:right}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lu-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
.lu-h .fm{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.lu-note{margin:0 0 6px}
.pitch{position:relative;background:linear-gradient(180deg,#2f8f4e,#287a42);border-radius:10px;padding:18px 4px 14px;display:flex;flex-direction:column-reverse;justify-content:space-around;gap:12px;min-height:380px;overflow:hidden}
.pitch::before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(255,255,255,.3);border-radius:3px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:28%;right:28%;bottom:7px;height:13%;border:1.5px solid rgba(255,255,255,.3);border-bottom:0;pointer-events:none}
.prow{display:flex;justify-content:space-around;position:relative;z-index:1}
.pl{display:flex;flex-direction:column;align-items:center;width:66px;min-width:0;text-align:center;color:#fff}
.av{position:relative;width:42px;height:42px;border-radius:50%;background:#fff;color:#111;font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#dfe5ec;border:2px solid #fff;box-sizing:border-box}
.av.has .n{position:absolute;right:-6px;bottom:-3px;z-index:1;width:18px;height:18px;border-radius:50%;font-size:10px;background:#fff;color:#111;display:grid;place-items:center;border:1.5px solid #111}
.pitch.away .av,.pitch.away .av.has .n{background:#1e293b;color:#fff}
.pitch.away .av{border:1.5px solid rgba(255,255,255,.85)}
.pitch.away .av.has .n{border-color:#fff}
.pitch.away .av img{border-color:rgba(255,255,255,.85)}
.pitch .pl.gk .av,.pitch .pl.gk .av.has .n{background:#facc15;color:#111;border-color:#111}
.pitch .pl.gk .av img{border-color:#facc15}
.pl .nm{font-size:11px;line-height:1.25;margin-top:3px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pe{display:inline-flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;font-size:10px;line-height:1.2}
.pl .pe{margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.card-y,.card-r{display:inline-block;width:7px;height:10px;border-radius:1px;background:#facc15}
.card-r{background:#ef4444}
.so{color:#fca5a5;font-weight:700}
.si{color:var(--win);font-weight:700}
.subs-h{font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 6px}
ul.subs{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:10px}
ul.subs li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);font-size:13px}
ul.subs li:last-child{border-bottom:0}
ul.subs li.unused{color:var(--muted)}
ul.subs .no{font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
ul.subs .nm{display:flex;align-items:center;gap:8px;min-width:0}
ul.subs .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sav{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:50% 18%;flex:none;background:var(--surface-2)}
ul.subs li.unused .sav{opacity:.6}
ul.subs .so{color:var(--loss)}

/* 농구·야구 박스스코어 */
.box-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px}
table.box{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
table.box th{font-size:11px;color:var(--muted);font-weight:600;padding:6px 7px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.box td{padding:6px 7px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.box tr:last-child td{border-bottom:0}
table.box td.pn{text-align:left}
table.box td.hi{font-weight:800}
.pn-in{display:flex;align-items:center;gap:8px}
.pn-in small{color:var(--muted);font-size:11px}
.pn-in .bo{width:16px;text-align:right;color:var(--muted);font-size:12px;font-weight:700}
.hs{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:var(--surface-2);flex:none}
tr.dnp td{color:var(--muted)}
tr.sub td.pn .pn-in{padding-left:24px}
tr.grp-row td{background:var(--surface-2);font-size:11px;color:var(--muted);text-align:left;font-weight:700}
.prob{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prob .card{display:flex;align-items:center;gap:12px;padding:12px}
.prob .hs{width:48px;height:48px}
ul.inj{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:10px}
ul.inj li{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:13px}
ul.inj li:last-child{border-bottom:0}
ul.inj .stt{margin-left:auto;font-size:12px;color:var(--loss);font-weight:600}

@media (max-width:640px){
  .groups,.mlist,.cols,.lineups,.prob{grid-template-columns:1fr}
  .hide-sm{display:none}
  .match{grid-template-columns:30px 1fr 74px 1fr;padding:9px 8px;gap:6px}
  .match.nogrp{grid-template-columns:1fr 74px 1fr}
  .lg{width:18px;height:18px}
  ul.res li{grid-template-columns:52px 1fr auto 26px}
  ul.res .c,ul.res .ha{display:none}
  ul.res.fx li{grid-template-columns:96px 1fr}
  .cmp .r{grid-template-columns:1fr 96px 1fr;padding:7px 8px}
  .cmp .f{width:16px;height:16px;font-size:10px}
  .cmp .form{gap:2px}
  .mh .t{font-size:14px}
  .m-in{padding:0 12px 12px}
  .pl{width:58px}
  .pl .nm{max-width:58px}
  .av{width:38px;height:38px}
  .brand .sub{display:none}
  header.top{position:static}
  .lgbar{gap:6px;padding-top:10px}
  .lggrp{width:100%}
  .lggrp + .lggrp{padding-left:0;border-left:0}
  .lgcat{width:52px;flex:none}
  .lgbtn{padding:3px 9px 3px 3px;font-size:12px;gap:6px}
  .lgbtn .mk{width:22px;height:22px;font-size:8px}
}

// ================================================================ 데이터 (로컬 서버 → 실패 시 ESPN 직접)
const ESPN = "https://site.api.espn.com/apis/";
let MODE = location.protocol.startsWith("http") ? "server" : "direct";
const memo = new Map();
function espn(path, ttl = 60){
  const hit = memo.get(path);
  if (hit && Date.now() - hit.t < ttl * 1000) return hit.p;
  const p = (async () => {
    if (MODE === "server"){
      try {
        const r = await fetch("/espn/" + path, {cache:"no-store"});
        if (r.ok) return await r.json();
        if (r.status !== 404) throw new Error("서버 " + r.status);
      } catch (e) { /* 서버가 없거나 오래된 버전이면 직접 호출 */ }
      MODE = "direct";
    }
    let r;
    try { r = await fetch(ESPN + path, {cache:"no-store"}); }
    catch { throw new Error("데이터를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."); }
    if (!r.ok) throw new Error("ESPN 응답 오류 (" + r.status + ")");
    return r.json();
  })();
  memo.set(path, {t:Date.now(), p});
  p.catch(() => memo.delete(path));
  return p;
}

function nTeam(c){
  const t = c.team || {};
  const prob = (c.probables || [])[0];
  return {id:String(t.id), name:t.displayName || t.name, abbr:t.abbreviation, logo:t.logo || (t.logos || [{}])[0]?.href,
          score:toInt(c.score), shootout:toInt(c.shootoutScore), winner:c.winner,
          probable: prob && prob.athlete ? {name:prob.athlete.displayName, img:prob.athlete.headshot?.href || prob.athlete.headshot, stat:(prob.statistics || []).map(s => `${s.abbreviation || s.name} ${s.displayValue}`).join(" · ")} : null,
          record:(c.records || []).find(r => r.type === "total" || r.name === "overall")?.summary};
}
function nEvent(ev){
  const comp = (ev.competitions || [{}])[0], status = comp.status || ev.status || {}, st = status.type || {};
  let home = null, away = null;
  for (const c of comp.competitors || []) { if (c.homeAway === "home") home = nTeam(c); else away = nTeam(c); }
  return {id:String(ev.id), date:ev.date, state:st.state, completed:!!st.completed, status:st.name, detail:st.shortDetail || st.detail,
          clock:status.displayClock, period:status.period, home, away, venue:(comp.venue || {}).fullName, neutral:!!comp.neutralSite,
          competition:(ev.league || {}).name || "", note:((comp.notes || [])[0] || {}).headline || ""};
}
const dedupe = evs => { const seen = new Set(), out = []; for (const e of evs){ const n = nEvent(e); if (seen.has(n.id) || !n.home || !n.away) continue; seen.add(n.id); out.push(n); } return out.sort((a, b) => (a.date || "").localeCompare(b.date || "")); };

function lettersInclude(spec, x){
  for (const tok of spec.replace(/\s/g, "").split(",")){
    if (tok.includes("-")){ const [a, b] = tok.split("-"); if (x >= a && x <= b) return true; }
    else if (tok === x) return true;
  }
  return false;
}
function noteKo(desc, letter){
  if (!desc) return "";
  if (!letter) return NOTE[desc] || desc;
  for (const part of desc.split(";")){
    const m = part.trim().match(/^([A-D](?:\s*[-,]\s*[A-D])*)\s*:\s*(.+)$/);
    if (m && lettersInclude(m[1], letter)) return NOTE[m[2].trim()] || m[2].trim();
  }
  return "";
}
const MLB_DIV = {ALE:"AL 동부", ALC:"AL 중부", ALW:"AL 서부", NLE:"NL 동부", NLC:"NL 중부", NLW:"NL 서부"};
function groupLabel(lg, g){
  if (lg === "unl") return g.name.replace(/^Group\s*/i, "") + "조";
  if (LEAGUES[lg].sport === "soccer") return LEAGUES[lg].name;  // 단일 리그 표
  if (lg === "mlb") return MLB_DIV[g.abbreviation] || g.name;
  return (g.name || "").replace("Eastern Conference", "동부 콘퍼런스").replace("Western Conference", "서부 콘퍼런스");
}

async function loadStandings(lg){
  const Lg = LEAGUES[lg], d = await espn(`v2/sports/${Lg.sport}/${Lg.slug}/standings${Lg.standingsQuery || ""}`, 60);
  const season = (d.seasons || [{}])[0], groups = [];
  (function walk(n){ if (n.standings?.entries?.length) groups.push(n); (n.children || []).forEach(walk); })(d);
  const out = groups.map(g => {
    const code = lg === "unl" ? (g.name || "").replace(/^Group\s*/i, "") : (g.abbreviation || g.name);
    const letter = lg === "unl" ? code[0] : null;
    let rows = g.standings.entries.map(e => {
      const v = {}, dv = {};
      for (const x of e.stats || []){ v[x.name] = x.value; dv[x.name] = x.displayValue; }
      const t = e.team || {}, note = e.note || {};
      const w = toInt(v.wins) || 0, l = toInt(v.losses) || 0, d = toInt(v.ties) || 0;
      return {id:String(t.id), name:t.displayName, abbr:t.abbreviation, logo:(t.logos || [{}])[0]?.href,
        rank:toInt(v.rank) || 0, seed:toInt(v.playoffSeed) || 0, p:toInt(v.gamesPlayed) ?? (w + l + d), w, d, l,
        gf:toInt(v.pointsFor) || 0, ga:toInt(v.pointsAgainst) || 0, gd:toInt(v.pointDifferential) || 0, pts:toInt(v.points) || 0,
        wp:Number(v.winPercent) || 0, pct:dv.winPercent || "-", gb:dv.gamesBehind || "-", home:dv.Home || "-", road:dv.Road || "-",
        l10:dv["Last Ten Games"] || "-", streak:dv.streak || "-", avgFor:dv.avgPointsFor || "-", avgAgainst:dv.avgPointsAgainst || "-",
        clincher:dv.clincher || "", note:note.description, noteColor:note.color};
    });
    if (Lg.sport === "soccer") rows.sort((a, b) => (a.rank || 99) - (b.rank || 99));
    else if (lg === "nba" && rows.every(r => r.seed)) rows.sort((a, b) => a.seed - b.seed);
    else rows.sort((a, b) => b.wp - a.wp || b.w - a.w);
    rows.forEach((r, i) => {
      if (Lg.sport !== "soccer") r.rank = i + 1;
      // 순위 구간 표시
      if (Lg.sport === "soccer") r.zone = noteKo(r.note, letter);
      else if (lg === "nba"){ if (r.seed && r.seed <= 6){ r.zone = "플레이오프 직행"; r.noteColor = "#81D6AC"; } else if (r.seed && r.seed <= 10){ r.zone = "플레이-인"; r.noteColor = "#FEE59A"; } }
      else if (lg === "mlb" && /^[xyzw*]$/.test(r.clincher)){ r.zone = "포스트시즌 진출"; r.noteColor = "#81D6AC"; }
    });
    return {name:g.name, code, letter, label:groupLabel(lg, g), rows};
  });
  if (lg === "unl") out.sort((a, b) => a.code.localeCompare(b.code));
  const yr = (season.displayName || "").match(/\d{4}(-\d{2})?/);
  return {season:yr ? yr[0] + " 시즌" : "", year:season.year, start:season.startDate, groups:out};
}
function applyStandings(lg, st){
  const d = D(lg);
  d.season = st.season; d.year = st.year; d.start = st.start; d.groups = st.groups; d.info = {};
  for (const g of st.groups) for (const r of g.rows) d.info[r.id] = {...r, group:g.code, groupLabel:g.label, letter:g.letter};
}

async function loadSeasonMatches(lg){
  const Lg = LEAGUES[lg], y = Number(D(lg).year) || new Date().getFullYear();
  const months = [`${y}09`, `${y}10`, `${y}11`, `${y+1}03`, `${y+1}06`];
  const lists = await Promise.all(months.map(m => espn(`site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard?dates=${m}&limit=300`, 60).then(j => j.events || []).catch(() => [])));
  return dedupe(lists.flat());
}
function weekStart(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
async function loadWeek(lg, start){
  const Lg = LEAGUES[lg];
  const days = [...Array(7)].map((_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return ymd(d); });
  const lists = await Promise.all(days.map(dd => espn(`site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard?dates=${dd}`, 60).then(j => j.events || []).catch(() => [])));
  return dedupe(lists.flat());
}
async function initialWeek(lg){
  const Lg = LEAGUES[lg];
  try {
    const sb = await espn(`site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard`, 60);
    const day = sb.day?.date || (sb.events || [])[0]?.date;
    if (day) return weekStart(new Date(day.length === 10 ? day + "T12:00:00" : day));
  } catch {}
  return weekStart(new Date());
}
async function loadMatches(lg){
  const d = D(lg);
  if (LEAGUES[lg].sched === "months") { d.matches = await loadSeasonMatches(lg); return; }
  if (!d.week) d.week = await initialWeek(lg);
  d.matches = await loadWeek(lg, d.week);
}

    const [p, f] = await Promise.all([espn(base, 600), espn(base + "?fixture=true", 300).catch(() => ({}))]);
    info = p.team || {};
    past = (p.events || []).map(nEvent);
    upcoming = (f.events || []).map(nEvent);
    if (!Lg.national) past = past.filter(e => !/Friendly|Emirates Cup|Trofeo|Gamper/i.test(e.competition));  // 클럽 친선·프리시즌 경기 제외
  } else {
    const base = `site/v2/sports/${Lg.sport}/${Lg.slug}/teams/${id}/schedule`;
    const p = await espn(base, 600);
    info = p.team || {};
    let evs = (p.events || []).map(nEvent);
    if (Lg.sport === "baseball" || evs.filter(e => e.completed).length < 10){  // 기본 일정이 포스트시즌뿐일 수 있어 정규시즌도 합침
      const r = await espn(base + "?seasontype=2", 600).catch(() => ({}));
      evs = evs.concat((r.events || []).map(nEvent));
    }
    const seen = new Set(); evs = evs.filter(e => !seen.has(e.id) && seen.add(e.id));
    past = evs; upcoming = evs;
  }
  past = past.filter(e => e.completed && e.home && e.away).sort((a, b) => b.date.localeCompare(a.date));
  upcoming = upcoming.filter(e => !e.completed && e.state !== "post" && e.home && e.away).sort((a, b) => a.date.localeCompare(b.date));
  return {id, name:info.displayName, logo:info.logo || (info.logos || [{}])[0]?.href, past, upcoming};
}

function resultFor(ev, tid){
  const isHome = ev.home.id === tid;
  const me = isHome ? ev.home : ev.away, op = isHome ? ev.away : ev.home;
  if (me.score == null || op.score == null) return null;
  let r = me.score > op.score ? "W" : me.score < op.score ? "L" : "D";
  let pk = null;
  if (r === "D" && /PEN/.test(ev.status || "")) pk = me.winner ? "승부차기 승" : "승부차기 패";
  if (r === "D" && L().sport !== "soccer" && me.winner != null) r = me.winner ? "W" : "L";
  return {ev, me, op, r, gf:me.score, ga:op.score, home:isHome, pk};
}
function stats(rs){
  const s = {n:rs.length, W:0, D:0, L:0, gf:0, ga:0, cs:0, fts:0, o25:0, btts:0};
  for (const r of rs){ s[r.r]++; s.gf += r.gf; s.ga += r.ga; if (!r.ga) s.cs++; if (!r.gf) s.fts++; if (r.gf + r.ga > 2) s.o25++; if (r.gf && r.ga) s.btts++; }
  s.avgGf = s.n ? s.gf / s.n : 0; s.avgGa = s.n ? s.ga / s.n : 0; s.avgTot = s.avgGf + s.avgGa; s.margin = s.avgGf - s.avgGa;
  return s;
}
const recordText = s => L().sport === "soccer" ? `${s.W}승 ${s.D}무 ${s.L}패` : `${s.W}승 ${s.L}패`;
function kpis(s, label){
  const sp = L().sport, k = (v, t) => `<div class="kpi"><div class="v">${v}</div><div class="k">${t}</div></div>`;
  const items = [k(recordText(s), label)];
  if (sp === "soccer") items.push(k(fx1(s.avgGf), "경기당 득점"), k(fx1(s.avgGa), "경기당 실점"), k(s.cs, "무실점 경기"), k(s.fts, "무득점 경기"), k(pct(s.o25, s.n), "2.5골 오버"), k(pct(s.btts, s.n), "양팀 득점"));
  else if (sp === "basketball") items.push(k(fx1(s.avgGf), "평균 득점"), k(fx1(s.avgGa), "평균 실점"), k(fx1s(s.margin), "평균 점수차"), k(fx1(s.avgTot), "평균 총점"));
  else items.push(k(fx1(s.avgGf), "경기당 득점"), k(fx1(s.avgGa), "경기당 실점"), k(fx1(s.avgTot), "경기당 총점"), k(s.cs, "무실점 경기"), k(s.fts, "무득점 경기"));
  return `<div class="kpis">${items.join("")}</div>`;
}

function formStrip(tid){
  const d = D();

}

const decOdds = ml => { const n = Number(ml); if (ml == null || ml === "" || !isFinite(n) || n === 0) return null; return n > 0 ? 1 + n / 100 : 1 + 100 / Math.abs(n); };
const fOdds = ml => { const d = decOdds(ml); return d ? d.toFixed(2) : "-"; };
const sgn = v => { const n = Number(v); return n > 0 ? "+" + n : n === 0 ? "0" : String(n); };
function pickOdds(sum){
  const list = [...((sum && sum.pickcenter) || []), ...((sum && sum.odds) || [])].filter(Boolean);
  return list.find(x => x.overUnder != null || x.spread != null || (x.homeTeamOdds && x.homeTeamOdds.moneyLine != null)) || null;
}
function oddsBlock(m, o, compact){
  if (!o) return "";
  const soccer = L().sport === "soccer", ho = o.homeTeamOdds || {}, ao = o.awayTeamOdds || {};
  const hs = Number(m.home.score) || 0, as = Number(m.away.score) || 0, started = m.state !== "pre";
  const cell = (k, v, hit) => `<span class="oc ${hit ? "hit" : ""}"><small>${k}</small><b>${v}</b></span>`;
  const rows = [];
  if (ho.moneyLine != null || ao.moneyLine != null){
    const lead = !started ? "" : hs > as ? "h" : hs < as ? "a" : "d";
    rows.push(`<div class="orow"><span class="ok">${soccer ? "승무패" : "승패"}</span>${cell("홈승", fOdds(ho.moneyLine), lead === "h")}${soccer ? cell("무", fOdds((o.drawOdds || {}).moneyLine), lead === "d") : ""}${cell("원정승", fOdds(ao.moneyLine), lead === "a")}</div>`);
  }
  if (o.spread != null && !isNaN(Number(o.spread))){
    const sp = Number(o.spread), adj = hs + sp - as;  // 홈 핸디 적용 후 차이
    const fin = m.state === "post";
    const st = started ? `<span class="onow">${fin ? "결과 " : ""}${adj > 0 ? (fin ? "홈" : "홈 우세") : adj < 0 ? (fin ? "원정" : "원정 우세") : "동점"}</span>` : "";
    rows.push(`<div class="orow"><span class="ok">핸디</span>${cell("홈 " + sgn(sp), fOdds(ho.spreadOdds), started && adj > 0)}${cell("원정 " + sgn(-sp), fOdds(ao.spreadOdds), started && adj < 0)}${st}</div>`);
  }
  if (o.overUnder != null && !isNaN(Number(o.overUnder))){
    const line = Number(o.overUnder), tot = hs + as;
    const st = !started ? "" : m.state === "post" ? `<span class="onow">결과 ${tot} · ${tot > line ? "오버" : tot < line ? "언더" : "적특"}</span>`
      : `<span class="onow">현재 ${tot}${tot > line ? " · 오버" : ` · ${+(line - tot).toFixed(1)} 남음`}</span>`;
    rows.push(`<div class="orow"><span class="ok">언더오버</span>${cell("기준", line, false)}${cell("오버", fOdds(o.overOdds), started && tot > line)}${cell("언더", fOdds(o.underOdds), started && tot < line)}${st}</div>`);
  }
  if (!rows.length) return "";
  const src = `${esc((o.provider || {}).name || "ESPN")} 경기 전 기준 · 소수점 배당`;
  return compact ? `<div class="odds compact">${rows.join("")}<div class="osrc">${src}</div></div>`
    : `<div class="sec"><div class="sec-h"><h3>배당·기준점</h3><span class="muted sp">${src} · 프로토 배당과 다를 수 있음</span></div><div class="card odds">${rows.join("")}</div></div>`;
}

function getSummary(ev, lg = S.lg){
  const d = D(lg), Lg = LEAGUES[lg];
  if (d.sumCache[ev.id]) return d.sumCache[ev.id];

  if (ev.completed){ d.sumCache[ev.id] = p; p.catch(() => { delete d.sumCache[ev.id]; }); }
  return p;
}

// ================================================================ 선수 한국어 이름·사진 (위키데이터)
const WD_KEY = "wdPlayers.v2";
let WD = {};
try { WD = JSON.parse(localStorage.getItem(WD_KEY) || "{}") || {}; } catch { WD = {}; }
const wk = (n, occ) => occ + "|" + n;
function playerNames(sum){
  const out = [];
  for (const r of sum?.rosters || []) for (const p of r.roster || []) out.push(p.athlete?.displayName);
  for (const t of sum?.boxscore?.players || []) for (const st of t.statistics || []) for (const a of st.athletes || []) out.push(a.athlete?.displayName);
  for (const t of sum?.injuries || []) for (const i of t.injuries || []) out.push(i.athlete?.displayName);
  return out.filter(Boolean);
}
async function lookupPlayers(names, occ){
  const need = [...new Set(names)].filter(n => !(wk(n, occ) in WD));
  for (let i = 0; i < need.length; i += 60){
    const chunk = need.slice(i, i + 60);
    const vals = chunk.map(n => JSON.stringify(n) + "@en").join(" ");
    const q = `SELECT ?name ?ko ?kow ?img WHERE { VALUES ?name { ${vals} } ?item rdfs:label|skos:altLabel ?name ; wdt:P106 wd:${occ} .
      OPTIONAL { ?item rdfs:label ?ko FILTER(LANG(?ko) = "ko") }
      OPTIONAL { ?art schema:about ?item ; schema:isPartOf <https://ko.wikipedia.org/> ; schema:name ?kow }
      OPTIONAL { ?item wdt:P18 ?img } }`;
    try {
      const r = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(q));
      if (!r.ok) continue;
      const rows = (await r.json()).results.bindings;
      chunk.forEach(n => { WD[wk(n, occ)] = 0; });  // 0 = 조회했지만 정보 없음
      for (const b of rows){
        const key = wk(b.name.value, occ), cur = WD[key] || {};
        const k = b.ko || b.kow;  // 한국어 레이블이 없으면 한국어 위키백과 문서 제목
        if (k && !cur.ko) cur.ko = k.value.replace(/\s*\(.*?\)\s*/g, " ").trim();
        if (b.img && !cur.img) cur.img = b.img.value;
        WD[key] = cur;
      }
    } catch { /* 위키데이터 실패 시 영어 이름 그대로 */ }
  }
  try { localStorage.setItem(WD_KEY, JSON.stringify(WD)); } catch {}
}
const curOcc = () => OCC[L().sport];
const wd = (n, occ = curOcc()) => WD[wk(n, occ)] || null;
const lastName = n => { const p = (n || "").trim().split(/\s+/); return p.length > 1 ? p.slice(1).join(" ") : (n || ""); };
const koFull = n => (wd(n) && wd(n).ko) || n || "";
function koShort(n, occ){
  const ko = wd(n, occ) && wd(n, occ).ko, en = lastName(n);
  if (!ko) return en;
  const kt = ko.split(/\s+/);
  if (kt.length < 2) return ko;
  return kt.slice(-Math.min(en.split(/\s+/).length, kt.length - 1)).join(" ");
}
const imgOf = (n, w = 120) => { const u = wd(n) && wd(n).img; return u ? u.replace(/^http:/, "https:") + "?width=" + w : null; };
const nameTitle = n => esc(koFull(n) === n ? n : `${koFull(n)} (${n})`);
const headImg = (url, cls = "hs") => url ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";

// ================================================================ 축구 라인업
const parseLineups = sum => {
  const evs = {};
  const get = id => evs[id] || (evs[id] = {goals:[], og:[], y:[], r:[], in:null, out:null});
  for (const k of sum.keyEvents || []){
    const t = (k.type || {}).type || "", min = (k.clock || {}).displayValue || "";
    const ps = (k.participants || []).map(p => String((p.athlete || {}).id));
    if (!ps.length) continue;
    if (t === "own-goal") get(ps[0]).og.push(min);
    else if (t.startsWith("goal")) get(ps[0]).goals.push(min);
    else if (t === "yellow-card") get(ps[0]).y.push(min);
    else if (t === "red-card") get(ps[0]).r.push(min);
    else if (t === "substitution"){ get(ps[0]).in = min; if (ps[1]) get(ps[1]).out = min; }
  }
  const out = {};
  for (const r of sum.rosters || []){
    const players = (r.roster || []).map(p => {
      const id = String((p.athlete || {}).id);
      return {id, name:(p.athlete || {}).displayName, no:p.jersey, pos:(p.position || {}).abbreviation || "",
              place:Number(p.formationPlace) || 99, starter:!!p.starter, subIn:!!p.subbedIn, ev:evs[id]};
    });
    const used = p => !!(p.subIn || (p.ev && p.ev.in));
    out[r.homeAway] = {teamId:String((r.team || {}).id), formation:r.formation,
      starters:players.filter(p => p.starter),
      subs:players.filter(p => !p.starter).sort((a, b) => used(b) - used(a) || (Number(a.no) || 99) - (Number(b.no) || 99))};
  }
  return out;
};
const hasLineup = lu => !!lu && ((lu.home?.starters.length || 0) + (lu.away?.starters.length || 0)) > 0;
function rowOf(pos){
  pos = pos.toUpperCase();
  if (pos === "G" || pos === "GK") return 0;
  if (/^DM/.test(pos)) return 2;
  if (/^AM/.test(pos)) return 4;
  if (/^(CD|CB|LB|RB|LWB|RWB|WB|SW|D)/.test(pos)) return 1;
  if (/M/.test(pos)) return 3;
  return 5;
}
const sideOf = pos => /(^L|-L$)/i.test(pos) ? 0 : /(^R|-R$)/i.test(pos) ? 2 : 1;
function evIcons(e, starter){
  if (!e) return "";
  const o = [];
  e.goals.forEach(t => o.push(`<span class="pg" title="득점 ${esc(t)}">⚽${esc(t)}</span>`));
  e.og.forEach(t => o.push(`<span class="pg og" title="자책골 ${esc(t)}">⚽자책</span>`));
  e.y.forEach(t => o.push(`<i class="card-y" title="경고 ${esc(t)}"></i>`));

  if (starter && e.out) o.push(`<span class="so" title="교체 아웃">↓${esc(e.out)}</span>`);
  if (!starter && e.in) o.push(`<span class="si" title="교체 투입">↑${esc(e.in)}</span>`);
  return o.join("");
}
function pitch(t, cls){
  if (!t.starters.length) return '<div class="card empty">선발 정보 없음</div>';
  const rows = {};
  t.starters.forEach(p => (rows[rowOf(p.pos)] = rows[rowOf(p.pos)] || []).push(p));
  const keys = Object.keys(rows).map(Number).sort((a, b) => a - b);
  return `<div class="pitch ${cls}">${keys.map(k => `<div class="prow">${rows[k]
    .sort((a, b) => sideOf(a.pos) - sideOf(b.pos) || a.place - b.place)
    .map(p => { const img = imgOf(p.name); return `<div class="pl ${k === 0 ? "gk" : ""}" title="${nameTitle(p.name)} · ${esc(p.pos)}">
      <span class="av ${img ? "has" : ""}"><span class="n">${esc(p.no || "")}</span>${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has');this.remove()">` : ""}</span>
      <span class="nm">${esc(koShort(p.name))}</span><span class="pe">${evIcons(p.ev, true)}</span></div>`; }).join("")}</div>`).join("")}</div>`;
}
function subsList(t){

function lineupCol(team, t, cls, note = "", withSubs = true){

}
function lineupSection(m, lu){
  if (hasLineup(lu)) return `<div class="sec"><div class="sec-h"><h3>라인업</h3><span class="muted sp">${m.state === "pre" ? "발표된 선발 명단" : "⚽ 득점 · 🟨 경고 · ↓ 교체 아웃 · ↑ 교체 투입"}</span></div>

  if (m.state === "pre") return `<div class="sec"><div class="sec-h"><h3>라인업</h3></div>
    <div class="card empty">아직 라인업이 발표되지 않았습니다. 보통 킥오프 약 1시간 전에 발표됩니다.</div>
    <div id="prev-lu" data-mid="${m.id}"><div class="loading">직전 경기 선발 라인업을 불러오는 중…</div></div></div>`;
  return `<div class="sec"><div class="sec-h"><h3>라인업</h3></div><div class="card empty">이 경기의 라인업 정보가 없습니다.</div></div>`;
}
function goalsLine(m, sum){
  if (!sum || m.state === "pre") return "";
  const gs = {home:[], away:[]};
  for (const k of sum.keyEvents || []){
    const t = (k.type || {}).type || "";
    if (!(t.startsWith("goal") || t === "own-goal")) continue;
    const tid = String((k.team || {}).id), side = tid === m.home.id ? "home" : tid === m.away.id ? "away" : null;
    const who = ((k.participants || [])[0] || {}).athlete?.displayName;
    if (side && who) gs[side].push(`${esc(koShort(who))} ${esc((k.clock || {}).displayValue || "")}${t === "own-goal" ? " (자책)" : ""}`);
  }
  if (!gs.home.length && !gs.away.length) return "";
  return `<div class="goals"><div>${gs.home.join("<br>")}</div><div>⚽</div><div>${gs.away.join("<br>")}</div></div>`;
}
async function fillPrevLineups(m, h, a){
  const prev = t => t.past.find(e => e.id !== m.id && e.date < m.date);
  const ph = prev(h), pa = prev(a);
  const [sh, sa] = await Promise.all([ph ? getSummary(ph).catch(() => null) : null, pa ? getSummary(pa).catch(() => null) : null]);
  await withTimeout(lookupPlayers([...playerNames(sh), ...playerNames(sa)], OCC.soccer), 6000);
  const box = document.querySelector(`#prev-lu[data-mid="${m.id}"]`);
  if (!box || S.modalMatch !== m.id) return;
  const pick = (sum, tid) => { if (!sum) return null; const lu = parseLineups(sum); return [lu.home, lu.away].find(x => x && x.teamId === tid && x.starters.length) || null; };
  const th = pick(sh, m.home.id), ta = pick(sa, m.away.id);
  if (!th && !ta){ box.innerHTML = ""; return; }
  const note = (ev, tid) => { const r = ev && resultFor(ev, tid); return r ? `<div class="note lu-note">${dShort(ev.date)} vs ${esc(ko(r.op.name))} ${r.gf}-${r.ga} · ${esc(compKo(ev.competition))}</div>` : ""; };
  box.innerHTML = `<div class="sec-h" style="margin-top:14px"><h3>직전 경기 선발 라인업</h3><span class="muted sp">예상 라인업이 아닌 참고용</span></div>
    <div class="lineups">${th ? lineupCol(m.home, th, "home", note(ph, m.home.id), false) : '<div class="card empty">정보 없음</div>'}${ta ? lineupCol(m.away, ta, "away", note(pa, m.away.id), false) : '<div class="card empty">정보 없음</div>'}</div>`;
}

// ================================================================ 농구·야구 공통
function orderTeams(m, list, idOf){
  return [m.home.id, m.away.id].map(id => list.find(x => String(idOf(x)) === id)).filter(Boolean);
}
const teamHead = (m, tid) => { const t = tid === m.home.id ? m.home : m.away; return `<div class="lu-h">${logo(t.logo)}<span>${esc(ko(t.name))}</span><span class="fm">${tid === m.home.id ? "홈" : "원정"}</span></div>`; };
function playerCell(a, extra = ""){
  const nm = a.athlete?.displayName || "", hs = a.athlete?.headshot?.href || imgOf(nm, 80);
  return `<td class="pn"><span class="pn-in">${extra}${headImg(hs)}<span title="${nameTitle(nm)}">${esc(koFull(nm))}</span><small>${esc(a.position?.abbreviation || a.athlete?.position?.abbreviation || "")}</small></span></td>`;
}
function injuriesBlock(m, sum){
  const teams = orderTeams(m, sum?.injuries || [], x => x.team?.id).filter(t => (t.injuries || []).length);

  return `<div class="sec"><div class="sec-h"><h3>부상·결장 선수</h3></div><div class="cols">${teams.map(t => `<div>${teamHead(m, String(t.team.id))}
    <ul class="inj">${t.injuries.map(i => `<li>${headImg(i.athlete?.headshot?.href || imgOf(i.athlete?.displayName, 80))}<span title="${nameTitle(i.athlete?.displayName)}">${esc(koFull(i.athlete?.displayName))}</span>
      <small class="muted">${esc((i.details || {}).type || "")}</small><span class="stt">${esc(INJ[i.status] || i.status || "")}</span></li>`).join("")}</ul></div>`).join("")}</div></div>`;

// ---------------------------------------------------------------- 농구
const BB_COLS = [["MIN","출전"],["PTS","득점"],["REB","리바"],["AST","어시"],["STL","스틸"],["BLK","블록"],["TO","턴오버"],["FG","야투"],["3PT","3점"],["FT","자유투"],["+/-","+/-"]];
function basketballSection(m, sum){
  const teams = orderTeams(m, sum?.boxscore?.players || [], x => x.team?.id).filter(t => (t.statistics?.[0]?.athletes || []).length);
  if (!teams.length){
    const msg = m.state === "pre" ? "선수 기록은 경기가 시작되면 나옵니다. 선발 명단은 보통 경기 30분 전쯤 확정됩니다." : "이 경기의 선수 기록이 없습니다.";
    return `<div class="sec"><div class="sec-h"><h3>선수 기록</h3></div><div class="card empty">${msg}</div></div>` + injuriesBlock(m, sum);
  }
  const html = teams.map(t => {
    const st = t.statistics[0], lab = st.names || st.labels || [];
    const cols = BB_COLS.filter(([k]) => lab.includes(k));
    const top = Math.max(...st.athletes.map(a => Number(a.stats?.[lab.indexOf("PTS")]) || 0));
    const row = a => {
      if (a.didNotPlay || !(a.stats || []).length) return `<tr class="dnp">${playerCell(a)}<td colspan="${cols.length}" class="tl">${esc(a.reason || "출전하지 않음")}</td></tr>`;
      return `<tr>${playerCell(a)}${cols.map(([k]) => { const v = a.stats[lab.indexOf(k)]; return `<td class="${k === "PTS" && Number(v) === top && top > 0 ? "hi" : ""}">${esc(v ?? "")}</td>`; }).join("")}</tr>`;
    };
    const starters = st.athletes.filter(a => a.starter), bench = st.athletes.filter(a => !a.starter);
    return `<div class="sec">${teamHead(m, String(t.team.id))}<div class="box-wrap"><table class="box">
      <thead><tr><th class="tl">선수</th>${cols.map(([, h]) => `<th>${h}</th>`).join("")}</tr></thead>
      <tbody><tr class="grp-row"><td colspan="${cols.length + 1}">선발</td></tr>${starters.map(row).join("")}
      <tr class="grp-row"><td colspan="${cols.length + 1}">벤치</td></tr>${bench.map(row).join("")}</tbody></table></div></div>`;
  }).join("");
  return `<div class="sec"><div class="sec-h"><h3>선수 기록</h3><span class="muted sp">출전 시간(분) · 득점 최다 선수 굵게</span></div></div>${html}`;
}

// ---------------------------------------------------------------- 야구
const BAT_COLS = [["AB","타수"],["R","득점"],["H","안타"],["RBI","타점"],["HR","홈런"],["BB","볼넷"],["K","삼진"],["AVG","타율"]];
const PIT_COLS = [["IP","이닝"],["H","피안타"],["R","실점"],["ER","자책"],["BB","볼넷"],["K","삼진"],["HR","피홈런"],["PC","투구수"],["ERA","평균자책"]];
function lineScore(m, sum){
  const comps = sum?.header?.competitions?.[0]?.competitors || [];
  const rows = orderTeams(m, comps, c => c.team?.id || c.id).filter(c => (c.linescores || []).length);
  if (rows.length < 2) return "";
  const n = Math.max(9, ...rows.map(c => c.linescores.length));
  const cell = (c, i) => { const v = c.linescores[i]; return v == null ? "" : (v.displayValue ?? v.value ?? ""); };
  return `<div class="sec"><div class="box-wrap"><table class="box"><thead><tr><th class="tl">팀</th>${[...Array(n)].map((_, i) => `<th>${i + 1}</th>`).join("")}<th>R</th><th>H</th><th>E</th></tr></thead>
    <tbody>${rows.map(c => `<tr><td class="pn"><span class="pn-in">${logo(c.team?.logo || (c.team?.logos || [{}])[0]?.href)}${esc(ko(c.team?.displayName))}</span></td>
      ${[...Array(n)].map((_, i) => `<td>${esc(cell(c, i))}</td>`).join("")}<td class="hi">${esc(c.score ?? "")}</td><td>${esc(c.hits ?? "")}</td><td>${esc(c.errors ?? "")}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function probablesBlock(m){
  const p = [m.home, m.away];
  if (!p.some(t => t.probable)) return "";
  return `<div class="sec"><div class="sec-h"><h3>선발 투수 예고</h3></div><div class="prob">${p.map(t => `<div class="card">
    ${headImg(t.probable?.img || imgOf(t.probable?.name, 96))}<div><div class="muted" style="font-size:12px">${esc(ko(t.name))}</div>
    <b title="${nameTitle(t.probable?.name || "")}">${esc(t.probable ? koFull(t.probable.name) : "미정")}</b>${t.probable?.stat ? `<div class="note">${esc(t.probable.stat)}</div>` : ""}</div></div>`).join("")}</div></div>`;
}
function baseballSection(m, sum){
  const teams = orderTeams(m, sum?.boxscore?.players || [], x => x.team?.id);
  const has = teams.some(t => (t.statistics || []).some(s => (s.athletes || []).length));
  if (!has){
    const msg = m.state === "pre" ? "타순은 보통 경기 몇 시간 전에 발표됩니다." : "이 경기의 선수 기록이 없습니다.";
    return probablesBlock(m) + `<div class="sec"><div class="sec-h"><h3>타순·투수 기록</h3></div><div class="card empty">${msg}</div></div>` + injuriesBlock(m, sum);
  }
  const html = teams.map(t => {
    const bat = (t.statistics || []).find(s => s.type === "batting"), pit = (t.statistics || []).find(s => s.type === "pitching");
    const table = (st, defs, isBat) => {
      if (!st || !(st.athletes || []).length) return "";
      const lab = st.names || st.labels || [], cols = defs.filter(([k]) => lab.includes(k));
      const rows = st.athletes.map(a => {
        const sub = isBat && !a.starter;
        const bo = isBat ? `<span class="bo">${a.starter && a.batOrder ? a.batOrder : ""}</span>` : "";
        return `<tr class="${sub ? "sub" : ""}">${playerCell(a, bo)}${cols.map(([k]) => `<td>${esc((a.stats || [])[lab.indexOf(k)] ?? "")}</td>`).join("")}</tr>`;
      }).join("");
      return `<div class="box-wrap" style="margin-top:8px"><table class="box"><thead><tr><th class="tl">${isBat ? "타자" : "투수"}</th>${cols.map(([, h]) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
    };
    return `<div class="sec">${teamHead(m, String(t.team.id))}${table(bat, BAT_COLS, true)}${table(pit, PIT_COLS, false)}</div>`;
  }).join("");
  return lineScore(m, sum) + `<div class="sec"><div class="sec-h"><h3>타순·투수 기록</h3><span class="muted sp">숫자는 타순, 들여쓴 선수는 교체 출전</span></div></div>${html}`;
}

// ================================================================ LIVE 탭 (자동 갱신)
const LV = {};            // 리그별 실시간 데이터 {events, raw, t, err, loading}
const LIVE_FAST = 20000;  // 경기 중 갱신 간격
const LIVE_SLOW = 60000;  // 진행 중 경기가 없을 때

function liveCount(lg = S.lg){
  const lv = LV[lg];
  const list = lv && lv.t ? lv.events : D(lg).matches;
  return list.filter(m => m.state === "in").length;
}
function updateLiveBadge(){
  const n = L().disabled ? 0 : liveCount();
  const b = document.querySelector("#tabs .tab-live");
  if (!b) return;
  b.classList.toggle("has", n > 0);
  $("#lcnt").textContent = n ? String(n) : "";
}

async function loadLive(lg){
  const Lg = LEAGUES[lg], base = `site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard`;
  // ESPN 기준 '오늘' + 이 기기 날짜 기준 오늘 (한국은 미국보다 하루 빠름)
  const paths = [base, `${base}?dates=${ymd(new Date())}`];
  const lists = await Promise.all(paths.map(p => espn(p, 0).then(j => j.events || []).catch(() => null)));
  if (lists.every(x => x === null)) throw new Error("데이터를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
  const raw = {};
  for (const e of lists.filter(Boolean).flat()) raw[String(e.id)] = e;
  const events = dedupe(Object.values(raw));
  // 다른 탭(경기 일정 등)도 같은 점수를 보도록 반영
  const d = D(lg);
  for (const m of events){
    const i = d.matches.findIndex(x => x.id === m.id);
    if (i >= 0) d.matches[i] = m;
  }
  // 진행 중인 경기 배당 (경기 상세 데이터에 들어 있음, 2분마다만 새로 받기)
  const odds = {};
  await withTimeout(Promise.all(events.filter(m => m.state === "in").map(m =>
    espn(summaryPath(lg, m.id), 120).then(s => { odds[m.id] = pickOdds(s); }).catch(() => {}))), 5000);
  if (Lg.sport === "soccer"){
    const names = [];
    for (const e of Object.values(raw)) for (const x of ((e.competitions || [{}])[0].details || [])) for (const a of x.athletesInvolved || []) names.push(a.displayName);
    if (names.length) await withTimeout(lookupPlayers([...new Set(names)], OCC.soccer), 3000);
  }
  return {events, raw, odds};
}

async function refreshLive(){
  const lg = S.lg;
  if (L().disabled) return;
  const lv = LV[lg] || (LV[lg] = {events:[], raw:{}, t:0, prev:{}});
  if (lv.loading) return;
  if (document.hidden && lv.t){ scheduleLive(); return; }  // 화면이 꺼져 있으면 쉬기
  lv.loading = true;
  try {
    const r = await loadLive(lg);
    lv.prev = Object.fromEntries(lv.events.map(m => [m.id, [m.home.score, m.away.score]]));
    lv.events = r.events; lv.raw = r.raw; lv.odds = {...(lv.odds || {}), ...r.odds}; lv.t = Date.now(); lv.err = null;
  } catch (e) { lv.err = e.message; if (!lv.t) lv.t = -1; }
  finally { lv.loading = false; }
  if (S.lg === lg){
    updateLiveBadge();
    if (S.tab === "live") renderLive(true);
    updateModalScore();
  }
  scheduleLive();
}
function scheduleLive(){
  clearTimeout(S.livePoll);
  if (S.tab !== "live" || L().disabled) return;
  const lv = LV[S.lg], now = Date.now();
  const busy = lv && lv.events.some(m => m.state === "in" || (m.state === "pre" && new Date(m.date) - now < 15 * 60000 && new Date(m.date) - now > -3 * 3600000));
  S.livePoll = setTimeout(refreshLive, busy ? LIVE_FAST : LIVE_SLOW);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.tab === "live" && LV[S.lg] && Date.now() - LV[S.lg].t > 10000) refreshLive();
});

// 경기 상세 창이 열려 있으면 점수만 바꿔 줌
function updateModalScore(){
  if (!modal.open || !S.modalMatch) return;
  const m = (LV[S.lg] || {events:[]}).events.find(x => x.id === S.modalMatch);
  const sc = document.querySelector("#mbody .mh .sc");
  if (!m || !sc || m.state === "pre") return;
  sc.textContent = `${m.home.score ?? "-"} : ${m.away.score ?? "-"}`;
  const w = document.querySelector("#mbody .mh .when .live");
  if (w) w.textContent = "● " + (m.state === "in" ? liveText(m) : "경기 종료");
}

// 축구 득점·퇴장 [홈[], 원정[]]
function soccerEvents(m, comp){
  const cols = [[], []];
  for (const x of comp.details || []){
    const id = String((x.team || {}).id), s = id === m.home.id ? 0 : id === m.away.id ? 1 : -1;
    if (s < 0) continue;
    const who = (x.athletesInvolved || [])[0], nm = who ? koShort(who.displayName, OCC.soccer) : "", t = (x.clock || {}).displayValue || "";
    if (x.scoringPlay) cols[s].push(`⚽${esc(nm)} ${esc(t)}${x.penaltyKick ? "(PK)" : ""}${x.ownGoal ? "(자책)" : ""}`);
    else if (x.redCard) cols[s].push(`🟥${esc(nm)} ${esc(t)}`);
  }
  return cols;
}
// 배당 한 줄 요약 (LIVE 카드용)
function oddsLine(m, o, sp = L().sport){
  if (!o) return "";
  const soccer = sp === "soccer", ho = o.homeTeamOdds || {}, ao = o.awayTeamOdds || {};
  const hs = Number(m.home.score) || 0, as = Number(m.away.score) || 0;
  const live = m.state !== "pre";
  const td = (txt, hit) => `<td class="${hit && live ? "hit" : ""}">${txt}</td>`;
  const rows = [];
  if (ho.moneyLine != null || ao.moneyLine != null)
    rows.push(`<tr><th>${soccer ? "승무패" : "승패"}</th><td class="ln">-</td>${td(fOdds(ho.moneyLine), hs > as)}${soccer ? td(fOdds((o.drawOdds || {}).moneyLine), hs === as) : ""}${td(fOdds(ao.moneyLine), hs < as)}</tr>`);
  if (o.spread != null && !isNaN(Number(o.spread))){
    const adj = hs + Number(o.spread) - as;
    rows.push(`<tr><th>핸디</th><td class="ln">홈 ${sgn(o.spread)}</td>${td(fOdds(ho.spreadOdds), adj > 0)}${soccer ? "<td></td>" : ""}${td(fOdds(ao.spreadOdds), adj < 0)}</tr>`);
  }
  if (o.overUnder != null && !isNaN(Number(o.overUnder))){
    const line = Number(o.overUnder), tot = hs + as;
    rows.push(`<tr><th>언오버</th><td class="ln">${line}</td>${td(`<small>오버</small> ${fOdds(o.overOdds)}`, tot > line)}${soccer ? "<td></td>" : ""}${td(`<small>언더</small> ${fOdds(o.underOdds)}`, tot < line)}</tr>`);
  }
  if (!rows.length) return "";
  return `<table class="otab"><thead><tr><th></th><th>기준</th><th>홈</th>${soccer ? "<th>무</th>" : ""}<th>원정</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
}

// ctx: {lg, raw, odds, prev, my} — My 경기 탭에서는 다른 리그 경기도 그림
function liveCard(m, ctx){
  if (!ctx || typeof ctx !== "object"){ const lv = LV[S.lg]; ctx = {lg:S.lg, raw:lv.raw, odds:lv.odds || {}, prev:lv.prev || {}}; }
  const Lg = LEAGUES[ctx.lg], sp = Lg.sport;
  const e = ctx.raw[m.id], comp = (e && (e.competitions || [{}])[0]) || {};
  const prev = (ctx.prev || {})[m.id];
  const up = [prev && prev[0] !== m.home.score, prev && prev[1] !== m.away.score];
  const hs = Number(m.home.score) || 0, as = Number(m.away.score) || 0;
  const cOf = side => (comp.competitors || []).find(c => c.homeAway === side) || {};
  const ev = sp === "soccer" ? soccerEvents(m, comp) : [[], []];
  const qs = side => sp === "basketball" ? (cOf(side).linescores || []).map(x => x.value) : [];
  // 좁은 화면에서는 NBA·MLB 팀을 애칭만 (골든스테이트 워리어스 → 워리어스)
  const nm = t => { const full = ko(t.name), parts = full.split(" ");
    return sp !== "soccer" && parts.length > 1 ? `<span class="fulln">${esc(full)}</span><span class="shortn">${esc(parts[parts.length - 1])}</span>` : esc(full); };
  const fin = m.state === "post", pre = m.state === "pre";
  const team = (t, side, i) => {
    const q = qs(side), lead = !pre && (i === 0 ? hs > as : as > hs);
    const win = fin && lead ? `<em class="wbadge">승</em>` : "";
    const sub = [q.length ? `<span class="lq">${q.join(" ")}</span>` : "", ev[i].length ? `<small>${ev[i].join(" ")}</small>` : ""].join("");
    return `<div class="lt ${i ? "away" : "home"} ${lead || pre ? "lead" : ""}">
      <div class="nmrow">${i ? logo(t.logo) : win}<span class="nm">${nm(t)}</span>${i ? win : logo(t.logo)}</div>${sub}</div>`;
  };
  let extra = "";
  if (sp === "baseball" && comp.situation && m.state === "in"){
    const s = comp.situation;
    const dia = `<span class="dia"><i class="${s.onSecond ? "on" : ""}" style="left:10px;top:0"></i><i class="${s.onThird ? "on" : ""}" style="left:2px;top:8px"></i><i class="${s.onFirst ? "on" : ""}" style="left:18px;top:8px"></i></span>`;
    const outs = `<span class="outs">아웃${[0, 1, 2].map(i => `<i class="${i < (s.outs || 0) ? "on" : ""}"></i>`).join("")}</span>`;
    const bat = s.batter?.athlete?.shortName, pit = s.pitcher?.athlete?.shortName;
    extra = `<div class="lx">${dia}${outs}${s.balls != null ? `<span>B-S ${s.balls}-${s.strikes}</span>` : ""}${bat ? `<span>타자 ${esc(bat)}</span>` : ""}${pit ? `<span>투수 ${esc(pit)}</span>` : ""}</div>`;
  }
  const sum = sp === "soccer" || pre ? "" : `<span class="ltot">합 ${hs + as}</span>`;
  const center = pre
    ? `<div class="lsc"><b style="font-size:.8em">${timeOnly(m.date)}</b></div><div class="lclk muted">${esc(new Date(m.date).toLocaleDateString("ko-KR", {month:"numeric", day:"numeric", weekday:"short"}))} 예정</div>`
    : `<div class="lsc"><b class="${up[0] ? "up" : ""}">${hs}</b><span>:</span><b class="${up[1] ? "up" : ""}">${as}</b>${sum}</div>
        <div class="lclk ${fin ? "muted" : "live"}">${fin ? "경기 종료" : "● " + esc(liveText(m, sp))}</div>`;
  const head = ctx.my ? `<div class="myhd"><span class="mk" style="background:${Lg.color}">${Lg.mark}</span>${Lg.short !== Lg.mark ? esc(Lg.short) : ""}${pickBtn(ctx.lg, m.id, true)}</div>` : pickBtn(ctx.lg, m.id);
  const open = ctx.my ? `data-mymatch="${ctx.lg}|${m.id}"` : `data-match="${m.id}"`;
  return `<div class="lcard ${fin ? "fin" : pre ? "pre" : ""} ${up[0] || up[1] ? "flash" : ""}" ${open} role="button" tabindex="0">
    ${head}
    <div class="lmain">
      ${team(m.home, "home", 0)}
      <div class="lc">${center}</div>
      ${team(m.away, "away", 1)}
    </div>
    ${extra}${oddsLine(m, (ctx.odds || {})[m.id], sp)}</div>`;
}

function renderLive(fromRefresh){
  const lv = LV[S.lg];
  if (!lv || !lv.t){
    $("#main").innerHTML = '<div class="loading">실시간 경기를 불러오는 중…</div>';
    refreshLive();
    return;
  }
  if (!fromRefresh && Date.now() - lv.t > 15000) refreshLive();  // 탭을 다시 열면 바로 새로 받기
  else if (!fromRefresh) scheduleLive();
  const now = Date.now(), evs = lv.events.filter(chipOk);
  const live = evs.filter(m => m.state === "in");
  const soon = evs.filter(m => m.state === "pre" && new Date(m.date) - now < 24 * 3600000 && new Date(m.date) - now > -3 * 3600000);
  const done = evs.filter(m => m.state === "post" && now - new Date(m.date) < 30 * 3600000).reverse();
  const upd = lv.t > 0 ? new Date(lv.t).toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit", second:"2-digit"}) : "-";
  const sec = live.length ? LIVE_FAST / 1000 : LIVE_SLOW / 1000;
  let html = chipsBar() + `<div class="live-bar"><h2><span class="ldot"></span><span class="live">LIVE</span> 진행 중인 경기 <span class="muted" style="font-size:14px">${live.length}경기</span></h2>
    <span class="auto"><i></i>${sec}초마다 자동 업데이트 · ${upd}</span></div>`;
  if (lv.err) html += `<div class="card empty" style="margin-bottom:10px">업데이트 실패: ${esc(lv.err)} · 잠시 후 다시 시도합니다.</div>`;
  const hasOdds = live.some(m => (lv.odds || {})[m.id]);
  html += live.length ? `<div class="lgrid">${live.map(liveCard).join("")}</div>${hasOdds ? `<div class="muted" style="font-size:11px;margin:-12px 0 16px;text-align:right">배당: DraftKings 경기 전 기준 · 소수점 · 프로토와 다를 수 있음 · 초록색은 현재 점수 기준 맞는 쪽</div>` : ""}`
    : `<div class="card live-empty" style="margin-bottom:18px"><b>지금 진행 중인 경기가 없습니다</b><span class="muted">경기가 시작되면 이 화면에 점수가 자동으로 나타납니다.</span></div>`;
  const list = (title, ms) => {
    if (!ms.length) return "";
    let last = "", body = "";
    for (const m of ms){
      const k = dkey(m.date);
      if (k !== last){ body += `<div class="muted" style="font-size:12px;margin:4px 0 0 2px;grid-column:1/-1">${esc(dayLabel(m.date))}</div>`; last = k; }
      body += matchCard(m, true);
    }
    return `<div class="strip-h"><h3>${title}</h3><span class="muted">${ms.length}경기</span></div>
      <div class="lmini">${body}</div>`;
  };
  html += list("곧 시작하는 경기", soon);
  if (!live.length && !soon.length) html += nextStrip();  // 오늘 경기가 없으면 다음 경기 일정
  html += list("최근 끝난 경기", done);
  $("#main").innerHTML = html;
}

// ================================================================ My 경기 (내가 담은 경기만 따로)
const MY_KEY = "myPicks.v1";
let PICKS = [];
try { PICKS = JSON.parse(localStorage.getItem(MY_KEY)) || []; } catch {}
// 경기일(또는 담은 날) 기준 7일 지난 경기는 자동 정리
PICKS = PICKS.filter(p => p && LEAGUES[p.lg] && Date.now() - Math.max(new Date(p.date).getTime() || 0, p.at || 0) < 7 * 864e5);
const MY = {ev:{}, raw:{}, odds:{}, prev:{}, t:0, loading:false, err:null};
const savePicks = () => { try { localStorage.setItem(MY_KEY, JSON.stringify(PICKS)); } catch {} };
const isPicked = (lg, id) => PICKS.some(p => p.lg === lg && p.id === id);
const pickBtn = (lg, id, inline) => { const on = isPicked(lg, id);
  return `<span class="pick ${inline ? "inl" : ""} ${on ? "on" : ""}" data-pick="${lg}|${id}" role="button" title="${on ? "My 경기에서 빼기" : "My 경기에 담기"}">${on ? "★" : "☆"}</span>`; };
function findMatch(lg, id){
  return D(lg).matches.find(x => x.id === id) || ((LV[lg] || {}).events || []).find(x => x.id === id) || MY.ev[lg + "|" + id] || null;
}
function togglePick(lg, id){
  const i = PICKS.findIndex(p => p.lg === lg && p.id === id);
  if (i >= 0) PICKS.splice(i, 1);
  else {
    const m = findMatch(lg, id);
    if (!m) return;
    PICKS.push({lg, id, date:m.date, home:m.home.name, away:m.away.name, at:Date.now()});
    MY.t = 0;  // 다음에 My 탭을 열 때 새로 받기
  }
  savePicks();
  const on = isPicked(lg, id);
  document.querySelectorAll(`[data-pick="${lg}|${id}"]`).forEach(el => {
    el.classList.toggle("on", on);
    el.title = on ? "My 경기에서 빼기" : "My 경기에 담기";
    el.textContent = el.classList.contains("chip-pick") ? (on ? "★ My 경기에 담음" : "☆ My 경기에 담기") : (on ? "★" : "☆");
  });
  updateMyBadge();
  if (S.tab === "my") renderMy(true);
}
function updateMyBadge(){
  const el = $("#mycnt"); if (!el) return;
  el.textContent = PICKS.length ? String(PICKS.length) : "";
  const liveN = PICKS.filter(p => (MY.ev[p.lg + "|" + p.id] || findMatch(p.lg, p.id) || {}).state === "in").length;
  document.querySelector("#tabs .tab-my")?.classList.toggle("has", liveN > 0);
}
// 미국 동부 날짜 + UTC 날짜 (ESPN 일정 날짜 기준이 리그마다 달라 둘 다 조회)
const espnDates = iso => { const d = new Date(iso);
  return [...new Set([d.toLocaleDateString("en-CA", {timeZone:"America/New_York"}), d.toISOString().slice(0, 10)].map(s => s.replace(/-/g, "")))]; };

async function loadMy(){
  const reqs = new Map();
  for (const p of PICKS){ const Lg = LEAGUES[p.lg]; for (const dd of espnDates(p.date)) reqs.set(`site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard?dates=${dd}`, p.lg); }
  const raw = {};
  const res = await Promise.all([...reqs].map(([path, lg]) => espn(path, 15).then(j => { for (const e of j.events || []) raw[lg + "|" + e.id] = e; return true; }).catch(() => false)));
  if (res.length && !res.some(Boolean)) throw new Error("데이터를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
  const ev = {};
  for (const p of PICKS){ const k = p.lg + "|" + p.id; if (raw[k]){ const n = dedupe([raw[k]])[0]; if (n) ev[k] = n; } }
  // 다른 화면에도 반영
  for (const [k, m] of Object.entries(ev)){ const lg = k.split("|")[0], d = D(lg), i = d.matches.findIndex(x => x.id === m.id); if (i >= 0) d.matches[i] = m; }
  const odds = {};
  await withTimeout(Promise.all(Object.entries(ev).map(([k, m]) => espn(summaryPath(k.split("|")[0], m.id), m.state === "post" ? 3600 : 120)
    .then(s => { odds[k] = pickOdds(s); }).catch(() => {}))), 6000);
  const names = [];
  for (const [k, e] of Object.entries(raw)) if (ev[k] && LEAGUES[k.split("|")[0]].sport === "soccer")
    for (const x of ((e.competitions || [{}])[0].details || [])) for (const a of x.athletesInvolved || []) names.push(a.displayName);
  if (names.length) await withTimeout(lookupPlayers([...new Set(names)], OCC.soccer), 3000);
  return {ev, raw, odds};
}
async function refreshMy(){
  if (MY.loading) return;
  if (document.hidden && MY.t){ scheduleMy(); return; }
  MY.loading = true;
  try {
    const r = await loadMy();
    MY.prev = Object.fromEntries(Object.entries(MY.ev).map(([k, m]) => [k, [m.home.score, m.away.score]]));
    MY.ev = r.ev; MY.raw = r.raw; MY.odds = {...MY.odds, ...r.odds}; MY.t = Date.now(); MY.err = null;
  } catch (e) { MY.err = e.message; if (!MY.t) MY.t = -1; }
  finally { MY.loading = false; }
  updateMyBadge();
  if (S.tab === "my") renderMy(true);
  scheduleMy();
}
function scheduleMy(){
  clearTimeout(S.myPoll);
  if (S.tab !== "my" || !PICKS.length) return;
  const now = Date.now();
  const busy = Object.values(MY.ev).some(m => m.state === "in" || (m.state === "pre" && new Date(m.date) - now < 15 * 60000));
  S.myPoll = setTimeout(refreshMy, busy ? LIVE_FAST : LIVE_SLOW);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.tab === "my" && Date.now() - MY.t > 10000) refreshMy();
});

function renderMy(fromRefresh){
  const bar = n => `<div class="live-bar"><h2><span class="mystar">★</span> My 경기 <span class="live">LIVE</span> <span class="muted" style="font-size:14px">${n}경기</span></h2>${MY.t > 0
    ? `<span class="auto"><i></i>${Object.values(MY.ev).some(m => m.state === "in") ? LIVE_FAST / 1000 : LIVE_SLOW / 1000}초마다 자동 업데이트 · ${new Date(MY.t).toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit", second:"2-digit"})}</span>` : ""}</div>`;
  if (!PICKS.length){
    clearTimeout(S.myPoll);
    $("#main").innerHTML = bar(0) + `<div class="card live-empty"><b>아직 담은 경기가 없습니다</b>
      <span class="muted">경기 카드 오른쪽 위의 <b class="mystar">☆</b>를 누르면 여기에 모입니다.<br>여러 리그 경기를 섞어서 담을 수 있고, 진행 중인 경기는 점수가 자동으로 바뀝니다.</span></div>`;
    return;
  }
  if (!MY.t){ $("#main").innerHTML = bar(PICKS.length) + '<div class="loading">담은 경기를 불러오는 중…</div>'; refreshMy(); return; }
  if (!fromRefresh && Date.now() - MY.t > 15000) refreshMy();
  else if (!fromRefresh) scheduleMy();
  const items = PICKS.map(p => ({p, k:p.lg + "|" + p.id, m:MY.ev[p.lg + "|" + p.id]}))
    .sort((a, b) => new Date(a.p.date) - new Date(b.p.date));
  const card = it => {
    if (!it.m) return `<div class="lcard"><div class="myhd"><span class="mk" style="background:${LEAGUES[it.p.lg].color}">${LEAGUES[it.p.lg].mark}</span>${esc(LEAGUES[it.p.lg].short)}${pickBtn(it.p.lg, it.p.id, true)}</div>
      <div class="muted" style="text-align:center;padding:6px 0">${esc(ko(it.p.home))} vs ${esc(ko(it.p.away))} · 정보를 불러오지 못했습니다</div></div>`;
    const id = it.m.id;
    return liveCard(it.m, {lg:it.p.lg, raw:{[id]:MY.raw[it.k]}, odds:{[id]:MY.odds[it.k]}, prev:MY.prev[it.k] ? {[id]:MY.prev[it.k]} : {}, my:true});
  };
  const live = items.filter(x => x.m && x.m.state === "in"), soon = items.filter(x => !x.m || x.m.state === "pre"), done = items.filter(x => x.m && x.m.state === "post").reverse();
  const sec = (title, list) => list.length ? `<div class="strip-h"><h3>${title}</h3><span class="muted">${list.length}경기</span></div><div class="lgrid">${list.map(card).join("")}</div>` : "";
  let html = bar(PICKS.length);
  if (MY.err) html += `<div class="card empty" style="margin-bottom:10px">업데이트 실패: ${esc(MY.err)} · 잠시 후 다시 시도합니다.</div>`;
  if (done.length){
    const w = done.filter(x => x.m.home.winner || x.m.away.winner).length;
    html += `<div class="muted" style="font-size:12px;margin:-4px 0 10px">끝난 경기 ${done.length} · 진행 중 ${live.length} · 예정 ${soon.length}${w < done.length ? ` · 무승부 ${done.length - w}` : ""}</div>`;
  }
  html += sec("● 진행 중", live) + sec("예정", soon) + sec("결과", done);
  html += `<div class="muted" style="font-size:11px;margin:-8px 0 16px">담은 경기는 이 기기에만 저장되고, 경기(또는 담은 날) 후 7일이 지나면 자동으로 빠집니다. ★를 다시 누르면 뺄 수 있습니다.${Object.keys(MY.odds).some(k => MY.odds[k]) ? " · 배당: DraftKings 경기 전 기준 · 초록색은 현재(최종) 점수 기준 맞는 쪽" : ""}</div>`;
  $("#main").innerHTML = html;
}
async function openMyMatch(lg, id){
  if (S.lg !== lg){ setLeague(lg); }
  if (!D(lg).loaded){ await (D(lg).loading || loadLeague(lg)); }
  openMatch(id);
}

// ================================================================ 로딩
async function loadLeague(lg, force){
  const d = D(lg);
  if (d.loading) return d.loading;
  d.loading = (async () => {
    $("#upd").textContent = "불러오는 중…";
    try {
      applyStandings(lg, await loadStandings(lg));
      await loadMatches(lg);
      d.loaded = true;
      if (S.lg === lg) render();
      $("#upd").textContent = "업데이트 " + new Date().toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"});
      if (d.forms === null || force) loadForms(lg);
      schedulePoll();
    } catch (e) {
      $("#upd").textContent = "";
      if (S.lg === lg && !d.loaded) $("#main").innerHTML = errBox(e) + '<button class="btn" data-retry="1">다시 시도</button>';
      else $("#upd").textContent = "업데이트 실패";
    } finally { d.loading = null; }
  })();
  return d.loading;
}
function schedulePoll(){
  clearTimeout(S.poll);
  const now = Date.now(), lg = S.lg;
  const active = D().matches.some(m => m.state === "in" || (m.state === "pre" && new Date(m.date).getTime() < now + 10 * 60000 && new Date(m.date).getTime() > now - 4 * 3600000));
  if (active) S.poll = setTimeout(async () => {  // 경기 중에는 1분마다 자동 갱신
    if (S.lg !== lg) return;
    try { applyStandings(lg, await loadStandings(lg)); await loadMatches(lg); if (S.lg === lg && !modal.open) render(); } catch {}
    schedulePoll();
  }, 60000);
}
function setLeague(lg){
  if (!LEAGUES[lg]) lg = DEFAULT_LG;
  S.lg = lg; S.chip = "ALL"; S.mStatus = "ALL";
  try { localStorage.setItem("league", lg); } catch {}
  if (location.hash.slice(1) !== lg) history.replaceState(null, "", "#" + lg);
  window.scrollTo(0, 0);
  render();
  if (!LEAGUES[lg].disabled && !D(lg).loaded) loadLeague(lg);
  else schedulePoll();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-pick],[data-mymatch],[data-lg],[data-tab],[data-chip],[data-mstatus],[data-week],[data-match],[data-team],[data-retry]");
  if (!t) return;
  if (t.dataset.pick){ e.preventDefault(); const [lg, id] = t.dataset.pick.split("|"); togglePick(lg, id); return; }
  if (t.dataset.mymatch){ const [lg, id] = t.dataset.mymatch.split("|"); openMyMatch(lg, id); return; }
  if (t.dataset.lg) setLeague(t.dataset.lg);
  else if (t.dataset.tab){ S.tab = t.dataset.tab; window.scrollTo(0, 0); render(); }
  else if (t.dataset.chip){ S.chip = t.dataset.chip; render(); }
  else if (t.dataset.mstatus){ S.mStatus = t.dataset.mstatus; render(); }
  else if (t.dataset.week){ moveWeek(Number(t.dataset.week)); }
  else if (t.dataset.match){ openMatch(t.dataset.match); }
  else if (t.dataset.team){ openTeam(t.dataset.team, Number(t.dataset.n) || 5); }
  else if (t.dataset.retry){ loadLeague(S.lg); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr[data-team]")) openTeam(e.target.dataset.team); });
$("#mclose").onclick = () => modal.close();
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
$("#refresh").onclick = () => {
  if (L().disabled) return;
  memo.clear();
  const d = D(); d.teamCache = {}; d.sumCache = {}; d.forms = null;
  loadLeague(S.lg, true);
};
window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (LEAGUES[k] && k !== S.lg) setLeague(k); });

let start = location.hash.slice(1);
if (!LEAGUES[start]) { try { start = localStorage.getItem("league") || DEFAULT_LG; } catch { start = DEFAULT_LG; } }
setLeague(start);

        <ol class="ios-steps"><li>오른쪽 아래(또는 위) <b>⋮ / 공유</b> 메뉴를 누르세요.</li>

    } else {
      steps = `<p>브라우저 메뉴에서 설치할 수 있습니다.</p>
        <ol class="ios-steps"><li>Chrome 오른쪽 위 <b>⋮</b> 메뉴를 누르세요.</li>
        <li><b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.</li></ol>`;
    }
    $("#mbody").innerHTML = `<h2 style="margin:4px 0 8px">앱으로 설치하기</h2>${steps}
      <p class="muted" style="margin-top:12px">설치하면 홈 화면 아이콘으로 바로 열리고, 주소창 없이 앱처럼 보입니다. 업데이트는 자동으로 반영됩니다.</p>`;
    $("#modal").showModal();
  };
})();
