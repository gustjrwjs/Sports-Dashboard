<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPORTS LIVE!</title>
<meta name="description" content="축구·농구·야구 순위표, 경기 일정·결과, 라인업을 한곳에서">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPORTS LIVE!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f0f2f7; --text:#131722; --muted:#5f6779;
  --border:#e1e5ee; --accent:#1d4ed8; --accent-soft:#e7eeff;
  --win:#15803d; --win-bg:#dcfce7; --draw:#5f6779; --draw-bg:#eceef3; --loss:#b91c1c; --loss-bg:#fee2e2;
  --live:#e11d48; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1016; --surface:#151a23; --surface-2:#1c2230; --text:#e7eaf0; --muted:#97a0b2;
    --border:#262d3b; --accent:#7096ff; --accent-soft:#1b2747;
    --win:#4ade80; --win-bg:#13301f; --draw:#a3abbb; --draw-bg:#262c38; --loss:#f87171; --loss-bg:#3a1a1c;
    --live:#fb7185; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);overflow:hidden}
header.top>.wrap{position:relative;z-index:1}
/* 리그 색 배경 (은은한 그라데이션 + 위쪽 색 띠) */
header.top{background:linear-gradient(115deg, color-mix(in srgb, var(--lgc, #1d4ed8) 15%, var(--surface)) 0%, color-mix(in srgb, var(--lgc, #1d4ed8) 6%, var(--surface)) 45%, var(--surface) 75%, color-mix(in srgb, var(--lgc, #1d4ed8) 9%, var(--surface)) 100%);transition:background .3s}
header.top::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--lgc, #1d4ed8);z-index:2}
@media (prefers-color-scheme: dark){
  header.top{background:linear-gradient(115deg, color-mix(in srgb, var(--lgc, #1d4ed8) 28%, var(--surface)) 0%, color-mix(in srgb, var(--lgc, #1d4ed8) 10%, var(--surface)) 45%, var(--surface) 75%, color-mix(in srgb, var(--lgc, #1d4ed8) 16%, var(--surface)) 100%)}
}
/* 토너먼트 대진표 */
.stview{max-width:360px;margin:14px 0 12px}
.bwrap{overflow-x:auto;margin:0 -4px 16px;padding:0 4px 6px;-webkit-overflow-scrolling:touch}
.bracket{display:flex;gap:26px;min-width:max-content}
.bcol{display:flex;flex-direction:column;width:210px;flex:none}
.bhead{height:30px;font-size:12px;font-weight:800;color:var(--lgc, var(--accent));text-align:center;letter-spacing:-.2px}
.bbody{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.bpair{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.bpair::after{content:"";position:absolute;right:-14px;top:25%;bottom:25%;width:12px;border:2px solid var(--border);border-left:0;border-radius:0 8px 8px 0}
.bslot{flex:1;display:flex;align-items:center;position:relative}
.bcol.lnk .bslot::before{content:"";position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid var(--border)}
.btie{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:5px 8px;box-shadow:var(--shadow);font-size:12.5px}
.btie.live{border-color:var(--live)}
.btie.bye{background:transparent;box-shadow:none;border-style:dashed;text-align:center;padding:10px 6px;font-size:11px}
.bcol.fin .btie{border:2px solid color-mix(in srgb, #f59e0b 70%, var(--border));box-shadow:0 2px 10px color-mix(in srgb, #f59e0b 25%, transparent)}
.brow{display:flex;align-items:center;gap:6px;min-width:0;height:24px}
.brow .lg{width:18px;height:18px;flex:none}
.brow .bn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brow .bs{font-weight:800;font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
.brow.l{color:var(--muted)}
.brow.l .bs{font-weight:600}
.brow .wbadge{font-size:9.5px;padding:2px 3px}
.binfo{font-size:10.5px;text-align:right;margin-top:1px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-bottom:16px}
.sitefoot{margin-top:28px;padding-top:14px;padding-bottom:22px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;line-height:1.7;text-align:center}
.sitefoot b{color:var(--text)}
/* 경기 상세 배당 표 */
.otbl-wrap{padding:4px 6px;overflow-x:auto}
table.otbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
table.otbl thead th{font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 4px;text-align:center;border-bottom:1px solid var(--border)}
table.otbl tbody th{text-align:left;color:var(--muted);font-weight:700;padding:9px 6px;white-space:nowrap;width:70px}
table.otbl td{text-align:center;padding:5px 3px;border-top:1px solid var(--border)}
table.otbl tbody tr:first-child td,table.otbl tbody tr:first-child th{border-top:0}
table.otbl tbody th{border-top:1px solid var(--border)}
table.otbl td b{display:inline-block;min-width:46px;padding:4px 6px;border-radius:7px;background:var(--surface-2);font-weight:800}
table.otbl td small{display:block;font-size:10px;color:var(--muted);margin-bottom:1px}
table.otbl td.hit b{background:var(--win-bg);color:var(--win);box-shadow:inset 0 0 0 1px var(--win)}
table.otbl td.hit small{color:var(--win)}
table.otbl td.ln{color:var(--muted);font-weight:700;white-space:nowrap}
table.otbl td.ores{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
table.otbl td.ores.on{color:var(--live)}
/* 1·2차전: 차전별 결과 줄 */
.blegbox{margin-top:5px;padding-top:4px;border-top:1px dashed var(--border);display:grid;gap:2px}
.bleg{display:flex;align-items:center;gap:5px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--text)}
.bleg .lk{color:var(--muted);font-size:10.5px;font-weight:700;width:30px;flex:none}
.bleg .lg{width:15px;height:15px;flex:none}
.bleg b{min-width:10px;text-align:center;font-weight:800}
.bleg .col{color:var(--muted);font-size:10px}
.bleg .ab{font-size:9px;font-weight:800;color:var(--muted);width:24px;text-align:center;flex:none}
.bleg .hn{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px;min-width:0}
/* 경기 카드: 홈 배지 · 경기장 */
.match .hb{font-style:normal;flex:none;font-size:9.5px;font-weight:800;line-height:1;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:2px 4px}
.match .mvenue{grid-column:1/-1;text-align:center;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-2px;line-height:1.2}
.bleg .hb{flex:none;font-size:9px;font-weight:800;line-height:1;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:2px 3px;margin-right:-1px}
.bleg.live b{color:var(--live)}
/* 1·2차전 표 (이전 방식, 미사용) */
.bracket.two .bcol{width:250px}
table.blegs{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
table.blegs thead td{font-size:9.5px;color:var(--muted);text-align:center;padding:0 0 2px;font-weight:600}
table.blegs th{text-align:left;font-weight:600;padding:2px 0;white-space:nowrap;overflow:hidden}
table.blegs th .lg{width:18px;height:18px;vertical-align:middle;margin-right:5px}
table.blegs th>span:not(.lg),table.blegs th .bn{vertical-align:middle}
table.blegs th{text-overflow:ellipsis}
table.blegs th .wbadge{font-size:9.5px;padding:2px 3px;margin-left:3px;vertical-align:middle}
table.blegs tbody td{width:38px;text-align:center;font-weight:700;padding:2px 0;line-height:1.05}
table.blegs tbody td i{display:block;font-style:normal;font-size:8.5px;font-weight:600;color:var(--muted)}
table.blegs thead td:last-child,table.blegs td.agg{width:34px;border-left:1px solid var(--border)}
table.blegs td.agg{font-size:15px;font-weight:800}
table.blegs tr.l{color:var(--muted)}
table.blegs tr.l td.agg{font-weight:600}
table.blegs td.live{color:var(--live)}
/* 커뮤니티 */
.nickchip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text)}
.nickchip i{font-style:normal;opacity:.6;margin-left:2px}
.adm{font-size:11px;font-weight:800;color:#fff;background:#0f766e;border-radius:6px;padding:2px 6px}
.tkseg{display:flex;gap:4px;padding:3px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);margin-bottom:12px}
.tkseg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.tkseg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.14)}
.tkseg.sm{margin-bottom:10px}.tkseg.sm button{padding:7px 6px;font-size:13px}
.tkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:12.5px}
.btn.tkbtn{background:var(--lgc, var(--accent));border-color:var(--lgc, var(--accent));color:#fff;font-weight:700;white-space:nowrap}
.btn.tkbtn:hover{filter:brightness(1.1);background:var(--lgc, var(--accent))}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.on{background:var(--win-bg);color:var(--win);border-color:var(--win)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px 4px}
.tklist{display:grid;gap:8px;margin-bottom:16px}
.tkpost{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.tkpost:hover{border-color:var(--lgc, var(--accent))}
.tkthumb{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;background:var(--surface-2)}
.tkmain{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.tkt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkb{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.tkm{font-size:12px;color:var(--muted)}
em.me{font-style:normal;font-size:10px;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 3px}
.tkin{display:block;width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;margin-bottom:8px;resize:vertical}
.tkin:focus{outline:2px solid color-mix(in srgb, var(--lgc, var(--accent)) 50%, transparent);border-color:transparent}
.tkerr{color:var(--loss);font-size:13px;min-height:1em;margin-top:4px}
.tkfile{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600}
.tkfile input{display:none}
.tkprev{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-top:8px}
.tkhead h2{margin:8px 0 4px;font-size:19px;word-break:break-word}
.tkimgfull{display:block;max-width:100%;max-height:520px;border-radius:12px;margin:12px 0;object-fit:contain;background:var(--surface-2)}
.tkbody{white-space:pre-wrap;word-break:break-word;line-height:1.6;margin:12px 0;font-size:14.5px}
.tkacts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
ul.tkcs{list-style:none;margin:0 0 10px;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:10px}
ul.tkcs li{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13.5px;word-break:break-word}
ul.tkcs li:last-child{border-bottom:0}
ul.tkcs li div{margin-top:2px;white-space:pre-wrap}
ul.tkcs li.adm{background:color-mix(in srgb, #0f766e 9%, var(--surface))}
ul.tkcs li.adm b{color:#0f766e}
ul.tkcs .linkbtn{float:right}
.faq{display:grid;gap:6px}
.faq details{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.faq summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq .chev{font-style:normal;color:var(--muted);transition:transform .15s;flex:none}
.faq details[open] .chev{transform:rotate(180deg)}
.faq details>div{padding:0 14px 12px;color:var(--muted);line-height:1.6;font-size:13.5px}
.faq details>div b{color:var(--text)}
nav.tabs button.tab-talk{white-space:nowrap}
/* 경기 카드 라운드 표시 */
.mid .rd{font-style:normal;font-size:10px;font-weight:700;color:var(--lgc, var(--accent));line-height:1.1;white-space:nowrap;letter-spacing:-.2px}
@media (prefers-color-scheme: dark){ .mid .rd{color:color-mix(in srgb, var(--lgc, #7096ff) 45%, #fff)} }
/* 헤더 배경의 리그 로고 (옅게) */
.lgwm{position:absolute;right:4%;top:50%;width:260px;height:260px;transform:translateY(-50%) rotate(-10deg);background:center/contain no-repeat;opacity:.09;pointer-events:none;z-index:0}
.lgwm.dk{display:none}
@media (prefers-color-scheme: dark){ .lgwm.lt{display:none} .lgwm.dk{display:block;opacity:.12} }
body{padding-bottom:env(safe-area-inset-bottom)}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
#install{border-color:var(--accent);color:var(--accent);font-weight:600}
#install[hidden]{display:none}
.ios-steps{margin:8px 0 0;padding-left:20px;line-height:1.9}
/* LIVE 탭 */
nav.tabs button.tab-live{color:var(--live);display:inline-flex;align-items:center;gap:6px;letter-spacing:.3px}
nav.tabs button.tab-live.on{color:var(--live);border-bottom-color:var(--live)}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--live);flex:none}
.tab-live.has .ldot{animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(225,29,72,.55)}80%,100%{box-shadow:0 0 0 7px rgba(225,29,72,0)}}
.lcnt{background:var(--live);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px;min-width:17px;text-align:center}
.lcnt:empty{display:none}
.live-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.live-bar h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.live-bar .auto{color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.live-bar .auto i{width:7px;height:7px;border-radius:50%;background:var(--win);animation:pulse 1.6s infinite}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:8px;margin-bottom:18px}
.lgrid>*{min-width:0}
.lcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--live);border-radius:10px;padding:8px 10px;cursor:pointer;box-shadow:var(--shadow)}
.lcard:hover{border-color:var(--live)}
.match .sc{white-space:nowrap}
.lmini .match .sc{font-size:15px}
.lmain{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.lt{min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.3;color:var(--muted)}
.lt.home{align-items:flex-end;text-align:right}
.lt.away{align-items:flex-start;text-align:left}
.lt.lead{color:var(--text)}
.nmrow{display:flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.nmrow .lg{width:22px;height:22px;flex:none}
.nmrow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lt .lq{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.5px;white-space:nowrap}
.lt small{font-size:10.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc{text-align:center;padding:0 2px}
.lsc{position:relative;display:inline-flex;align-items:center;gap:5px;font-size:22px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.lsc span{color:var(--muted);font-weight:600}
.lsc b{border-radius:5px;padding:0 3px}
.lsc b.up{animation:goal 2.2s ease-out}
.ltot{margin-left:2px;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:1px 5px;white-space:nowrap}
.lclk{font-size:11.5px;white-space:nowrap;margin-top:1px}
.lmini{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:6px;margin-bottom:18px}
.lmini>*{min-width:0}
.lmini .match{padding:6px 10px}
@media (max-width:640px){ .lmini{grid-template-columns:1fr} }
/* 승 표시, My 경기 */
.wbadge{font-style:normal;flex:none;display:inline-block;border:1.5px solid var(--live);color:var(--live);background:rgba(225,29,72,.08);border-radius:5px;font-size:11px;font-weight:800;line-height:1;padding:3px 4px}
.match,.lcard{position:relative}
/* 즐겨찾기 별: 누르기 쉽게 터치 영역 40px */
.pick{position:absolute;top:50%;right:2px;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--muted);opacity:.6;cursor:pointer;z-index:1;border-radius:50%;-webkit-tap-highlight-color:transparent}
.pick:hover{opacity:1;background:color-mix(in srgb, #f59e0b 12%, transparent)}
.pick:active{transform:translateY(-50%) scale(.88)}
.pick.on{color:#f59e0b;opacity:1}
.pick.inl{position:static;transform:none;margin-left:auto;width:36px;height:36px;font-size:22px;margin-top:-6px;margin-bottom:-6px}
.pick.inl:active{transform:scale(.88)}
.match{padding-right:40px!important}
.lcard>.pick{top:0;right:0;transform:none;width:38px;height:38px;font-size:21px}
.lcard>.pick:active{transform:scale(.88)}
.lcard>.pick ~ .lmain{padding:0 24px}
/* 경기 상세 창: 경기 정보 카드 왼쪽 위 별 */
.mh{position:relative}
.pick.mhpick{top:6px;right:6px;left:auto;transform:none;width:38px;height:38px;font-size:22px}
.pick.mhpick:active{transform:scale(.88)}
nav.tabs button.tab-my{display:inline-flex;align-items:center;gap:5px}
nav.tabs button.tab-my.on{border-bottom-color:#f59e0b}
.mystar{color:#f59e0b}
.tab-my .lcnt{background:#f59e0b}
.tab-my.has .lcnt{background:var(--live)}
.myhd{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);margin:-2px 0 4px}
.myhd .mk{width:20px;height:20px;font-size:7px;border-radius:5px}
.lcard.fin{border-left-color:var(--muted)}
.lcard.pre{border-left-color:var(--accent)}
.otab{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px;font-variant-numeric:tabular-nums;table-layout:fixed}
.otab th,.otab td{padding:3px 4px;text-align:center;border-top:1px solid var(--border)}
.otab thead th{border-top:1px dashed var(--border);color:var(--muted);font-weight:600;font-size:11px}
.otab tbody th{text-align:left;color:var(--muted);font-weight:700;width:52px}
.otab thead th:nth-child(2){width:62px}
.otab td{font-weight:700}
.otab td.ln{font-weight:600;color:var(--muted)}
.otab td small{font-weight:500;color:var(--muted);font-size:10.5px}
.otab td.hit{background:var(--win-bg);color:var(--win)}
.otab td.hit small{color:var(--win)}
.lx,.lodds{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:11px;color:var(--muted);border-top:1px dashed var(--border);padding-top:4px;margin-top:3px}
.og{display:inline-flex;align-items:center;gap:3px}
.og em{font-style:normal;font-weight:700;margin-right:1px}
.og b{font-weight:700;color:var(--text);background:var(--surface-2);border-radius:4px;padding:0 4px;font-variant-numeric:tabular-nums}
.og b.hit{background:var(--win-bg);color:var(--win)}
.lc-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.lc-t{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:600;min-width:0}
.lc-t span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-t .lg{width:34px;height:34px}
.lc-t.lead{color:var(--text)}
.lc-c{text-align:center}
.lc-sc{font-size:30px;font-weight:800;letter-spacing:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lc-sc b{display:inline-block;border-radius:6px;padding:0 4px}
.lc-sc b.up{animation:goal 2.2s ease-out}
@keyframes goal{0%{background:var(--live);color:#fff}100%{background:transparent}}
.lcard.flash{animation:cardflash 2.2s ease-out}
@keyframes cardflash{0%{box-shadow:0 0 0 3px var(--live)}100%{box-shadow:var(--shadow)}}
.lc-st{font-size:12px}
.lc-ex{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted)}
.lc-ex .r{text-align:right}
.lc-ex.one{grid-template-columns:1fr}
.qt{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.qt th,.qt td{padding:2px 4px;text-align:center}
.qt th{color:var(--muted);font-weight:600}
.qt td:first-child,.qt th:first-child{text-align:left;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt td.tot{font-weight:800}
.bases{display:inline-flex;align-items:center;gap:10px;color:var(--text)}
.dia{position:relative;width:30px;height:24px}
.dia i{position:absolute;width:9px;height:9px;border:1.5px solid var(--muted);transform:rotate(45deg);border-radius:1px}
.dia i.on{background:#f59e0b;border-color:#f59e0b}
.outs i{display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);margin-left:2px}
.outs i.on{background:var(--live);border-color:var(--live)}
.live-empty{text-align:center;padding:28px 16px}
.live-empty b{display:block;font-size:16px;margin-bottom:4px;color:var(--text)}
.shortn{display:none}
@media (max-width:640px){ .lgrid{grid-template-columns:1fr} .lcard{padding:7px 8px} .lmain{gap:6px} .lsc{font-size:19px;gap:4px} .nmrow{gap:4px} .nmrow .lg{width:18px;height:18px} .ltot{font-size:10px;padding:1px 4px} }
@media (max-width:480px){ .fulln{display:none} .shortn{display:inline} }
/* 배당 */
.odds{display:grid;gap:6px}
.odds.compact{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)}
.orow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ok{width:56px;flex:none;font-size:12px;font-weight:700;color:var(--muted)}
.oc{display:inline-flex;align-items:baseline;gap:5px;background:var(--surface-2);border:1px solid transparent;border-radius:7px;padding:3px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.oc small{color:var(--muted)}
.oc b{font-weight:800}
.oc.hit{border-color:var(--win);background:var(--win-bg)}
.oc.hit b{color:var(--win)}
.onow{font-size:11px;color:var(--live);font-weight:700;margin-left:auto}
.osrc{font-size:11px;color:var(--muted);text-align:right}
@media (max-width:480px){
  .appbar .btn{padding:5px 9px;font-size:13px}
  .appbar:has(#install:not([hidden])) .upd{display:none}
}
.top-in{display:flex;align-items:center;gap:12px;padding:8px 0 0;flex-wrap:wrap}
/* 시즌 선택 */
.seasonsel{font:inherit;font-size:12px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:2px 6px;margin-top:2px;cursor:pointer}
.brand .sub .linkbtn{margin-left:6px;font-size:11.5px}
/* 맨 위 서비스 이름 줄 */
.appbar{display:flex;align-items:center;gap:10px;padding:10px 0 0}
.appname{display:flex;align-items:center;gap:8px;margin-right:auto;font-weight:900;font-style:italic;font-size:19px;letter-spacing:-.4px;white-space:nowrap;color:var(--text)}
.appname img{width:30px;height:30px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.appname b{color:#e11d48;font-weight:900}
@media (max-width:480px){ .appname{font-size:17px} .appname img{width:26px;height:26px} }
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mk{border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-.4px;flex:none}
.brand .mk{width:36px;height:36px;font-size:12px}
.brand h1{font-size:17px;margin:0;letter-spacing:-.3px}
.brand .sub{color:var(--muted);font-size:12px}
.upd{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.lgbar{display:flex;flex-wrap:wrap;gap:8px 14px;padding:12px 0 4px}
.lggrp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lggrp + .lggrp{padding-left:14px;border-left:1px solid var(--border)}
.lgcat{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px;white-space:nowrap}
.lgbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:5px 12px 5px 5px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}
.lgbtn .mk{width:26px;height:26px;border-radius:7px;font-size:9px}
.lgbtn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.lgbtn.off{opacity:.6}
.lgbtn small{font-size:10px;color:var(--muted);font-weight:500}
/* 리그 메뉴 (종목 선택 + 리그 칩) */
.lgbar{display:flex;align-items:center;gap:10px;padding:10px 0 2px;flex-wrap:wrap}
.sportseg{display:inline-flex;flex:none;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--border);background:color-mix(in srgb, var(--surface-2) 85%, transparent)}
.sportseg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.sportseg button:hover{color:var(--text)}
.sportseg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.14)}
.lgchips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.lgc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:color-mix(in srgb, var(--surface) 75%, transparent);border-radius:999px;padding:3px 12px 3px 3px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--text)}
.lgc .mk{width:22px;height:22px;border-radius:50%;font-size:7.5px;letter-spacing:-.3px}
.lgc:hover{border-color:var(--c)}
.lgc.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 2px 6px color-mix(in srgb, var(--c) 40%, transparent)}
.lgc.on .mk{background:rgba(255,255,255,.2)!important}
.lgc.off{opacity:.5}
.lgc small{font-size:10px;opacity:.8;margin-left:2px}
.ibtn{width:34px;height:34px;padding:0!important;display:inline-grid;place-items:center;font-size:17px;line-height:1;border-radius:50%}
nav.tabs{display:flex;gap:2px;margin-top:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
main{padding:18px 0 48px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.7;margin-left:4px;font-size:12px}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;gap:8px;padding:12px 14px 6px}
.card-h h3{margin:0;font-size:15px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:14px}
.groups.wide{grid-template-columns:1fr}
.groups>*,.mlist>*,.cols>*,.lineups>*{min-width:0}
.tbl-wrap{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.st th{font-size:12px;color:var(--muted);font-weight:600;padding:6px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.st td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.st tr:last-child td{border-bottom:0}
table.st tbody tr{cursor:pointer}
table.st tbody tr:hover td{background:var(--surface-2)}
.tl{text-align:left!important}
td.rk{font-weight:700;box-shadow:inset 4px 0 0 var(--zone);width:34px}
td.pts{font-weight:800}
.tm{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.lg{width:20px;height:20px;object-fit:contain;flex:none}
.lg.big{width:44px;height:44px}
.lg.mid{width:28px;height:28px}
.form{display:inline-flex;gap:3px}
.f{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;font-weight:700}
.f-W{background:var(--win-bg);color:var(--win)}
.f-D{background:var(--draw-bg);color:var(--draw)}
.f-L{background:var(--loss-bg);color:var(--loss)}
.f-x{background:var(--surface-2);animation:pulse 1.2s infinite ease-in-out}
@keyframes pulse{50%{opacity:.4}}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* 경기 목록 */
.day{margin-bottom:16px}
.day h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.day h4 .today{color:var(--accent);margin-left:6px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:8px}
.match{display:grid;grid-template-columns:34px 1fr 92px 1fr;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow)}
.match.nogrp{grid-template-columns:1fr 92px 1fr}
.match:hover{border-color:var(--accent)}
.grp{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 0;text-align:center}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side.home{justify-content:flex-end;text-align:right}
.side.won{font-weight:700}
.mid{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.sc{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.vs{font-weight:700;color:var(--muted)}
.mid small{font-size:11px;color:var(--muted)}
.live{color:var(--live)!important;font-weight:700}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.strip .match{min-width:310px;grid-template-columns:1fr 86px 1fr}
.strip .sc{white-space:nowrap}
.strip-h{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}
.strip-h h3{margin:0;font-size:15px}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav .rng{font-weight:700;min-width:140px;text-align:center}

/* 팀 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.tbtn:hover{border-color:var(--accent)}
.tbtn .meta{font-size:12px;color:var(--muted)}
.lsec{margin-bottom:20px}
.lsec h3{font-size:15px;margin:0 0 10px}

/* 모달 */
dialog{border:0;padding:0;border-radius:16px;background:var(--bg);color:var(--text);width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(5,8,14,.55)}
.m-in{padding:0 18px 18px}
.m-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 10px 6px;background:var(--bg)}
.m-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.m-head h2{margin:0;font-size:20px}
.pill{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.kpi .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted)}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:15px}
.sec-h .sp{margin-left:auto}
ul.res{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:10px}
ul.res li{display:grid;grid-template-columns:76px 96px 36px 1fr auto 26px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border)}
ul.res li:last-child{border-bottom:0}
ul.res .d,ul.res .c,ul.res .ha{font-size:12px;color:var(--muted)}
ul.res .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.res .o{display:flex;align-items:center;gap:8px;min-width:0}
ul.res .o span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.res .s{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
ul.res .s small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
ul.res.fx li{grid-template-columns:120px 96px 36px 1fr}
.empty{padding:14px;color:var(--muted);text-align:center}
.mh{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}

.mh .t small{font-weight:500;color:var(--muted);font-size:12px}
.mh .ctr .sc{font-size:30px}
.mh .ctr .when{font-size:13px;color:var(--muted)}
.meta-line{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.cmp{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.cmp .r{display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;padding:7px 14px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.cmp .r:last-child{border-bottom:0}
.cmp .r>div:first-child{text-align:right}
.cmp .r .k{text-align:center;color:var(--muted);font-size:12px}
.cmp .best{font-weight:800;color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols ul.res li{grid-template-columns:64px 1fr auto 26px}
.err{background:var(--loss-bg);color:var(--loss);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.soon{padding:28px;text-align:center;line-height:1.7}
.soon h2{margin:0 0 6px;font-size:18px}

/* 축구 라인업 */
.goals{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.goals>div:first-child{text-align:right}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lu-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
.lu-h .fm{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.lu-note{margin:0 0 6px}
.pitch{position:relative;background:linear-gradient(180deg,#2f8f4e,#287a42);border-radius:10px;padding:18px 4px 14px;display:flex;flex-direction:column-reverse;justify-content:space-around;gap:12px;min-height:380px;overflow:hidden}
.pitch::before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(255,255,255,.3);border-radius:3px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:28%;right:28%;bottom:7px;height:13%;border:1.5px solid rgba(255,255,255,.3);border-bottom:0;pointer-events:none}
.prow{display:flex;justify-content:space-around;position:relative;z-index:1}
.pl{display:flex;flex-direction:column;align-items:center;width:66px;min-width:0;text-align:center;color:#fff}
.av{position:relative;width:42px;height:42px;border-radius:50%;background:#fff;color:#111;font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#dfe5ec;border:2px solid #fff;box-sizing:border-box}
.av.has .n{position:absolute;right:-6px;bottom:-3px;z-index:1;width:18px;height:18px;border-radius:50%;font-size:10px;background:#fff;color:#111;display:grid;place-items:center;border:1.5px solid #111}
.pitch.away .av,.pitch.away .av.has .n{background:#1e293b;color:#fff}
.pitch.away .av{border:1.5px solid rgba(255,255,255,.85)}
.pitch.away .av.has .n{border-color:#fff}
.pitch.away .av img{border-color:rgba(255,255,255,.85)}
.pitch .pl.gk .av,.pitch .pl.gk .av.has .n{background:#facc15;color:#111;border-color:#111}
.pitch .pl.gk .av img{border-color:#facc15}
.pl .nm{font-size:11px;line-height:1.25;margin-top:3px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pe{display:inline-flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;font-size:10px;line-height:1.2}
.pl .pe{margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.card-y,.card-r{display:inline-block;width:7px;height:10px;border-radius:1px;background:#facc15}
.card-r{background:#ef4444}
.so{color:#fca5a5;font-weight:700}
.si{color:var(--win);font-weight:700}
.subs-h{font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 6px}
ul.subs{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:10px}
ul.subs li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);font-size:13px}
ul.subs li:last-child{border-bottom:0}

let MODE = location.protocol.startsWith("http") ? "server" : "direct";
const memo = new Map();
function espn(path, ttl = 60){
  const hit = memo.get(path);
  if (hit && Date.now() - hit.t < ttl * 1000) return hit.p;
  const p = (async () => {
    if (MODE === "server"){
      try {
        const r = await fetch("/espn/" + path, {cache:"no-store"});
        if (r.ok) return await r.json();
        if (r.status !== 404) throw new Error("서버 " + r.status);
      } catch (e) { /* 서버가 없거나 오래된 버전이면 직접 호출 */ }
      MODE = "direct";
    }
    let r;
    try { r = await fetch(ESPN + path, {cache:"no-store"}); }
    catch { throw new Error("데이터를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."); }
    if (!r.ok) throw new Error("ESPN 응답 오류 (" + r.status + ")");
    return r.json();
  })();
  memo.set(path, {t:Date.now(), p});
  p.catch(() => memo.delete(path));
  return p;
}

function nTeam(c){
  const t = c.team || {};
  const prob = (c.probables || [])[0];
  return {id:String(t.id), name:t.displayName || t.name, abbr:t.abbreviation, logo:t.logo || (t.logos || [{}])[0]?.href,
          score:toInt(c.score), shootout:toInt(c.shootoutScore), winner:c.winner,
          probable: prob && prob.athlete ? {name:prob.athlete.displayName, img:prob.athlete.headshot?.href || prob.athlete.headshot, stat:(prob.statistics || []).map(s => `${s.abbreviation || s.name} ${s.displayValue}`).join(" · ")} : null,
          record:(c.records || []).find(r => r.type === "total" || r.name === "overall")?.summary};
}
function nEvent(ev){
  const comp = (ev.competitions || [{}])[0], status = comp.status || ev.status || {}, st = status.type || {};
  let home = null, away = null;
  for (const c of comp.competitors || []) { if (c.homeAway === "home") home = nTeam(c); else away = nTeam(c); }
  return {id:String(ev.id), date:ev.date, stype:(ev.season || {}).slug || "", state:st.state, completed:!!st.completed, status:st.name, detail:st.shortDetail || st.detail,
          clock:status.displayClock, period:status.period, home, away, venue:(comp.venue || {}).fullName, neutral:!!comp.neutralSite,
          competition:(ev.league || {}).name || "", note:((comp.notes || [])[0] || {}).headline || ""};
}
const dedupe = evs => { const seen = new Set(), out = []; for (const e of evs){ const n = nEvent(e); if (seen.has(n.id) || !n.home || !n.away) continue; seen.add(n.id); out.push(n); } return out.sort((a, b) => (a.date || "").localeCompare(b.date || "")); };

// ---------------------------------------------------------------- 리그 상태
const ST = {};
const S = {lg:"unl", tab:"standings", chip:"ALL", mStatus:"ALL", modalMatch:null, poll:null, livePoll:null, myPoll:null, stView:"table"};
const L = () => LEAGUES[S.lg];
// 지난 시즌을 보고 있으면(S.season) 그 리그의 데이터는 "리그@연도" 칸에 따로 보관
const seasonOf = lg => lg === S.lg ? S.season : null;
const dkeyOf = k => LEAGUES[k] && seasonOf(k) ? k + "@" + seasonOf(k) : k;
const D = (k = S.lg) => { const key = dkeyOf(k); return ST[key] || (ST[key] = {groups:[], info:{}, matches:[], forms:null, teamCache:{}, teamRes:{}, sumCache:{}, week:null, weekCache:{}, loaded:false, scrolled:false}); };

function lettersInclude(spec, x){
  for (const tok of spec.replace(/\s/g, "").split(",")){
    if (tok.includes("-")){ const [a, b] = tok.split("-"); if (x >= a && x <= b) return true; }
    else if (tok === x) return true;
  }
  return false;
}
function noteKo(desc, letter){
  if (!desc) return "";
  if (!letter) return NOTE[desc] || desc;
  for (const part of desc.split(";")){
    const m = part.trim().match(/^([A-D](?:\s*[-,]\s*[A-D])*)\s*:\s*(.+)$/);
    if (m && lettersInclude(m[1], letter)) return NOTE[m[2].trim()] || m[2].trim();
  }
  return "";
}
const MLB_DIV = {ALE:"AL 동부", ALC:"AL 중부", ALW:"AL 서부", NLE:"NL 동부", NLC:"NL 중부", NLW:"NL 서부"};
function groupLabel(lg, g){
  if (lg === "unl") return g.name.replace(/^Group\s*/i, "") + "조";
  if (lg === "mls") return /East/i.test(g.name) ? "동부 콘퍼런스" : /West/i.test(g.name) ? "서부 콘퍼런스" : g.name;
  const gm = (g.name || "").match(/^Group\s+([A-L])$/i);
  if (gm) return gm[1].toUpperCase() + "조";  // 예전 챔스·유로파 조별리그
  if (LEAGUES[lg].sport === "soccer") return LEAGUES[lg].name;  // 단일 리그 표
  if (lg === "mlb") return MLB_DIV[g.abbreviation] || g.name;
  return (g.name || "").replace("Eastern Conference", "동부 콘퍼런스").replace("Western Conference", "서부 콘퍼런스");
}

// seasonYr: 시즌 연도(예: 2025). 없으면 현재 시즌
async function loadStandings(lg, seasonYr, noFallback){
  const Lg = LEAGUES[lg], q = Lg.standingsQuery || "";
  const sq = seasonYr ? (q ? q + "&" : "?") + "season=" + seasonYr : q;
  const d = await espn(`v2/sports/${Lg.sport}/${Lg.slug}/standings${sq}`, seasonYr ? 3600 : 60);
  // 새 시즌이 아직 시작 전이라 모든 팀이 0경기면(예: MLS 비시즌) 지난 시즌 최종 순위를 보여줌
  if (!seasonYr && !noFallback && Lg.sport === "soccer"){
    const ents = []; (function w(n){ if (n.standings?.entries) ents.push(...n.standings.entries); (n.children || []).forEach(w); })(d);
    const gp = e => Number(((e.stats || []).find(s => s.name === "gamesPlayed") || {}).value) || 0;
    const y = Number((d.seasons || [{}])[0].year);
    if (ents.length && ents.every(e => gp(e) === 0) && y) { const r = await loadStandings(lg, y - 1, true); r.offseason = true; r.season = `${y - 1} 시즌 최종 순위 (새 시즌 시작 전)`; return r; }
  }
  const season = (d.seasons || [{}])[0], groups = [];
  (function walk(n){ if (n.standings?.entries?.length) groups.push(n); (n.children || []).forEach(walk); })(d);
  const out = groups.map(g => {
    const code = lg === "unl" ? (g.name || "").replace(/^Group\s*/i, "") : (g.abbreviation || g.name);
    const letter = lg === "unl" ? code[0] : null;
    let rows = g.standings.entries.map(e => {
      const v = {}, dv = {};
      for (const x of e.stats || []){ v[x.name] = x.value; dv[x.name] = x.displayValue; }
      const t = e.team || {}, note = e.note || {};
      const w = toInt(v.wins) || 0, l = toInt(v.losses) || 0, d = toInt(v.ties) || 0;
      return {id:String(t.id), name:t.displayName, abbr:t.abbreviation, logo:(t.logos || [{}])[0]?.href,
        rank:toInt(v.rank) || 0, seed:toInt(v.playoffSeed) || 0, p:toInt(v.gamesPlayed) ?? (w + l + d), w, d, l,
        gf:toInt(v.pointsFor) || 0, ga:toInt(v.pointsAgainst) || 0, gd:toInt(v.pointDifferential) || 0, pts:toInt(v.points) || 0,
        wp:Number(v.winPercent) || 0, pct:dv.winPercent || "-", gb:dv.gamesBehind || "-", home:dv.Home || "-", road:dv.Road || "-",
        l10:dv["Last Ten Games"] || "-", streak:dv.streak || "-", avgFor:dv.avgPointsFor || "-", avgAgainst:dv.avgPointsAgainst || "-",
        clincher:dv.clincher || "", note:note.description, noteColor:note.color};
    });
    if (Lg.sport === "soccer") rows.sort((a, b) => (a.rank || 99) - (b.rank || 99));
    else if (lg === "nba" && rows.every(r => r.seed)) rows.sort((a, b) => a.seed - b.seed);
    else rows.sort((a, b) => b.wp - a.wp || b.w - a.w);
    rows.forEach((r, i) => {
      if (Lg.sport !== "soccer") r.rank = i + 1;
      // 순위 구간 표시
      if (Lg.sport === "soccer"){ r.zone = noteKo(r.note, letter); r.noteColor = r.zone ? (ZONE_COLOR[r.zone] || cleanColor(r.noteColor)) : ""; }
      else if (lg === "nba"){ if (r.seed && r.seed <= 6){ r.zone = "플레이오프 직행"; r.noteColor = "#81D6AC"; } else if (r.seed && r.seed <= 10){ r.zone = "플레이-인"; r.noteColor = "#FEE59A"; } }
      else if (lg === "mlb" && /^[xyzw*]$/.test(r.clincher)){ r.zone = "포스트시즌 진출"; r.noteColor = "#81D6AC"; }
    });
    return {name:g.name, code, letter, label:groupLabel(lg, g), rows};
  });
  if (lg === "unl") out.sort((a, b) => a.code.localeCompare(b.code));
  const yr = (season.displayName || "").match(/\d{4}(-\d{2})?/);
  return {season:yr ? yr[0] + " 시즌" : "", year:season.year, start:season.startDate, end:season.endDate, groups:out};
}
function applyStandings(lg, st){
  const d = D(lg);
  d.season = st.season; d.year = st.year; d.start = st.start; d.end = st.end; d.groups = st.groups; d.info = {};
  if (!seasonOf(lg) && st.year) ST[lg].curYear = Number(st.year);  // 시즌 선택 메뉴 기준 연도
  if (seasonOf(lg)){
    const y = Number(seasonOf(lg));
    d.season = seasonLabel(lg, y) + " 시즌"; d.year = y;
    d.start = lg === "nba" ? `${y - 1}-09-01` : (lg === "mlb" || lg === "mls") ? `${y}-01-01` : `${y}-07-01`;
  }  // ESPN 시즌 이름이 현재 시즌으로 올 때가 있음
  for (const g of st.groups) for (const r of g.rows) d.info[r.id] = {...r, group:g.code, groupLabel:g.label, letter:g.letter};
}

// ---------------------------------------------------------------- 경기 목록
async function loadSeasonMatches(lg){
  const Lg = LEAGUES[lg], y = Number(D(lg).year) || new Date().getFullYear();
  const months = [`${y}09`, `${y}10`, `${y}11`, `${y+1}03`, `${y+1}06`];
  const lists = await Promise.all(months.map(m => espn(`site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard?dates=${m}&limit=300`, 60).then(j => j.events || []).catch(() => [])));
  return dedupe(lists.flat());
}
function weekStart(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
async function loadWeek(lg, start){
  const Lg = LEAGUES[lg];
  const days = [...Array(7)].map((_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return ymd(d); });
  const lists = await Promise.all(days.map(dd => espn(`site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard?dates=${dd}`, 60).then(j => j.events || []).catch(() => [])));
  return dedupe(lists.flat());
}
async function initialWeek(lg){
  const Lg = LEAGUES[lg];
  try {
    const sb = await espn(`site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard`, 60);
    const day = sb.day?.date || (sb.events || [])[0]?.date;
    if (day) return weekStart(new Date(day.length === 10 ? day + "T12:00:00" : day));
  } catch {}
  return weekStart(new Date());
}
async function loadMatches(lg){
  const d = D(lg);
  if (LEAGUES[lg].sched === "months") { d.matches = await loadSeasonMatches(lg); return; }
  if (!d.week && seasonOf(lg)){  // 지난 시즌: 시즌 마지막 즈음 주부터 보여줌 (ESPN 종료일은 믿기 어려워 종목별로 지정)
    const y = Number(seasonOf(lg));
    const last = lg === "nba" ? `${y}-06-10` : lg === "mlb" ? `${y}-09-26` : lg === "mls" ? `${y}-10-15` : `${y + 1}-05-17`;
    d.week = weekStart(new Date(last + "T12:00:00"));
  }
  if (!d.week) d.week = await initialWeek(lg);
  d.matches = await loadWeek(lg, d.week);
}

// ---------------------------------------------------------------- 팀 일정
async function teamData(lg, id){
  const Lg = LEAGUES[lg];
  let past = [], upcoming = [], info = {};
  const sy = seasonOf(lg), sq = sy ? `?season=${sy}` : "";  // 지난 시즌이면 그 시즌 일정
  if (Lg.scope === "all"){
    const base = `site/v2/sports/${Lg.sport}/all/teams/${id}/schedule`;
    const [p, f] = await Promise.all([espn(base + sq, sy ? 3600 : 600), sy ? {} : espn(base + "?fixture=true", 300).catch(() => ({}))]);
    info = p.team || {};
    past = (p.events || []).map(nEvent);
    upcoming = (f.events || []).map(nEvent);
    if (!Lg.national) past = past.filter(e => !/Friendly|Emirates Cup|Trofeo|Gamper/i.test(e.competition));  // 클럽 친선·프리시즌 경기 제외
  } else {
    const base = `site/v2/sports/${Lg.sport}/${Lg.slug}/teams/${id}/schedule`;
    const p = await espn(base + sq, sy ? 3600 : 600);
    info = p.team || {};
    let evs = (p.events || []).map(nEvent);
    if (Lg.sport === "baseball" || evs.filter(e => e.completed).length < 10){  // 기본 일정이 포스트시즌뿐일 수 있어 정규시즌도 합침
      const r = await espn(base + (sq ? sq + "&" : "?") + "seasontype=2", 600).catch(() => ({}));
      evs = evs.concat((r.events || []).map(nEvent));
    }
    const seen = new Set(); evs = evs.filter(e => !seen.has(e.id) && seen.add(e.id));
    past = evs; upcoming = evs;
  }
  past = past.filter(e => e.completed && e.home && e.away).sort((a, b) => b.date.localeCompare(a.date));
  upcoming = upcoming.filter(e => !e.completed && e.state !== "post" && e.home && e.away).sort((a, b) => a.date.localeCompare(b.date));
  return {id, name:info.displayName, logo:info.logo || (info.logos || [{}])[0]?.href, past, upcoming};
}
function getTeam(id, lg = S.lg){
  const d = D(lg);
  if (!d.teamCache[id]) d.teamCache[id] = teamData(lg, id).then(t => { d.teamRes[id] = t; return t; }).catch(e => { delete d.teamCache[id]; throw e; });
  return d.teamCache[id];
}
async function loadForms(lg){
  const d = D(lg), ids = d.groups.flatMap(g => g.rows.map(r => r.id)), out = {};
  for (let i = 0; i < ids.length; i += 8)
    await Promise.all(ids.slice(i, i + 8).map(id => getTeam(id, lg).then(t => { out[id] = t.past.slice(0, 5); }).catch(() => { out[id] = []; })));
  d.forms = out;
  if (S.lg === lg && S.tab === "standings") renderStandings();
  if (S.lg === lg && S.tab === "matches" && LEAGUES[lg].sport === "soccer") renderMatches();  // 라운드 표시 갱신
}

// 축구 라운드: 두 팀의 이번 시즌 같은 대회 일정 중 이 경기 전 경기 수 + 1 (ESPN이 라운드 번호를 주지 않아 계산)
function roundOf(m, lg = S.lg){
  const Lg = LEAGUES[lg];
  if (!Lg || Lg.sport !== "soccer" || !m.home || !m.away) return "";
  const d = D(lg), start = d.start ? d.start.slice(0, 10) : "0000";
  const phase = lg === "ucl" || lg === "uel";
  const count = id => {
    const t = d.teamRes[id]; if (!t) return null;
    const seen = new Set(); let n = 0;
    for (const e of [...t.past, ...t.upcoming]){
      if (seen.has(e.id)) continue; seen.add(e.id);
      if (e.competition !== Lg.comp || dkey(e.date) < start) continue;
      if (phase && e.stype && e.stype !== "league-phase") continue;  // 챔스·유로파 예선·토너먼트 제외
      if (e.date < m.date) n++;
    }
    return n + 1;
  };
  const a = count(m.home.id), b = count(m.away.id);
  const n = a == null ? b : b == null ? a : Math.min(a, b);
  if (!n) return "";
  if (phase){ if (m.stype && m.stype !== "league-phase") return ""; return n <= 8 ? `리그 페이즈 ${n}차전` : ""; }
  if (lg === "unl") return `${n}차전`;
  return `${n}R`;
}

// ---------------------------------------------------------------- 결과·통계
function resultFor(ev, tid){
  const isHome = ev.home.id === tid;
  const me = isHome ? ev.home : ev.away, op = isHome ? ev.away : ev.home;
  if (me.score == null || op.score == null) return null;
  let r = me.score > op.score ? "W" : me.score < op.score ? "L" : "D";
  let pk = null;
  if (r === "D" && /PEN/.test(ev.status || "")) pk = me.winner ? "승부차기 승" : "승부차기 패";
  if (r === "D" && L().sport !== "soccer" && me.winner != null) r = me.winner ? "W" : "L";
  return {ev, me, op, r, gf:me.score, ga:op.score, home:isHome, pk};
}
function stats(rs){
  const s = {n:rs.length, W:0, D:0, L:0, gf:0, ga:0, cs:0, fts:0, o25:0, btts:0};
  for (const r of rs){ s[r.r]++; s.gf += r.gf; s.ga += r.ga; if (!r.ga) s.cs++; if (!r.gf) s.fts++; if (r.gf + r.ga > 2) s.o25++; if (r.gf && r.ga) s.btts++; }
  s.avgGf = s.n ? s.gf / s.n : 0; s.avgGa = s.n ? s.ga / s.n : 0; s.avgTot = s.avgGf + s.avgGa; s.margin = s.avgGf - s.avgGa;
  return s;
}
const recordText = s => L().sport === "soccer" ? `${s.W}승 ${s.D}무 ${s.L}패` : `${s.W}승 ${s.L}패`;
function kpis(s, label){
  const sp = L().sport, k = (v, t) => `<div class="kpi"><div class="v">${v}</div><div class="k">${t}</div></div>`;
  const items = [k(recordText(s), label)];
  if (sp === "soccer") items.push(k(fx1(s.avgGf), "경기당 득점"), k(fx1(s.avgGa), "경기당 실점"), k(s.cs, "무실점 경기"), k(s.fts, "무득점 경기"), k(pct(s.o25, s.n), "2.5골 오버"), k(pct(s.btts, s.n), "양팀 득점"));
  else if (sp === "basketball") items.push(k(fx1(s.avgGf), "평균 득점"), k(fx1(s.avgGa), "평균 실점"), k(fx1s(s.margin), "평균 점수차"), k(fx1(s.avgTot), "평균 총점"));
  else items.push(k(fx1(s.avgGf), "경기당 득점"), k(fx1(s.avgGa), "경기당 실점"), k(fx1(s.avgTot), "경기당 총점"), k(s.cs, "무실점 경기"), k(s.fts, "무득점 경기"));
  return `<div class="kpis">${items.join("")}</div>`;
}
const badge = r => `<span class="f f-${r}">${RK[r]}</span>`;
function formStrip(tid){
  const d = D();
  if (d.forms === null) return `<span class="form">${'<span class="f f-x"></span>'.repeat(5)}</span>`;
  const evs = (d.forms[tid] || []).map(e => resultFor(e, tid)).filter(Boolean).reverse();
  if (!evs.length) return '<span class="muted">-</span>';
  return `<span class="form">${evs.map(x => `<span class="f f-${x.r}" title="${esc(dShort(x.ev.date))} ${esc(ko(x.op.name))} ${x.gf}-${x.ga} · ${esc(compKo(x.ev.competition) || L().short)}">${RK[x.r]}</span>`).join("")}</span>`;
}
const HOSTS = ["United States","USA","Mexico","Canada"];
const isNeutral = ev => ev.neutral || (/^FIFA World Cup$/.test(ev.competition || "") && !HOSTS.includes(ev.home.name));
const venueKo = (ev, home) => isNeutral(ev) ? "중립" : home ? "홈" : "원정";

// ================================================================ 렌더링
function renderHeader(){
  const Lg = L(), d = D();
  $("#mark").textContent = Lg.mark; $("#mark").style.background = Lg.color;
  document.documentElement.style.setProperty("--lgc", Lg.color);  // 리그 색: 헤더 배경·라운드 표시
  $("#lgname").textContent = Lg.name;
  // 시즌 선택 메뉴 (현재 + 지난 시즌들)
  const cur = (ST[S.lg] || {}).curYear;
  if (Lg.disabled) $("#season").textContent = "준비 중";
  else if (!cur) $("#season").textContent = d.season || "불러오는 중…";
  else {
    const step = S.lg === "unl" ? 2 : 1, yrs = [];

// ================================================================ 토너먼트 대진표
// kind별: 받아올 달, 라운드 구분, 라운드 이름
const BR_KIND = {ucl:"uefa", uel:"uefa", unl:"unl", nba:"nba", mlb:"mlb"};
const BR_ROUNDS = {
  uefa:[["round-of-16", "16강"], ["quarterfinals", "8강"], ["semifinals", "4강"], ["final", "결승"]],
  unl:[["quarterfinals", "8강"], ["semifinals", "4강"], ["final", "결승"]],
  nba:[["1st Round", "1라운드"], ["Semifinals", "콘퍼런스 준결승"], ["Finals", "콘퍼런스 결승"], ["NBA Finals", "NBA 파이널"]],
  mlb:[["WC", "와일드카드"], ["DS", "디비전시리즈"], ["CS", "챔피언십시리즈"], ["World Series", "월드시리즈"]],
};
const BR = {};  // lg → {state, yr, last, ties, rounds, extra}
function stViewBar(){
  if (!BR_KIND[S.lg]) return "";
  const v = S.stView === "bracket" ? "bracket" : "table";
  return `<div class="tkseg sm stview"><button class="${v === "table" ? "on" : ""}" data-stview="table">📊 순위표</button><button class="${v === "bracket" ? "on" : ""}" data-stview="bracket">🏆 ${S.lg === "nba" || S.lg === "mlb" ? "플레이오프" : "토너먼트"}</button></div>`;

// 경기 하나의 라운드 번호 (BR_ROUNDS 순서), 해당 없으면 -1. 'po' = 챔스·유로파 녹아웃 PO
function brRound(kind, ev){
  const slug = (ev.season || {}).slug || "", note = ((ev.competitions || [{}])[0].notes || [{}])[0]?.headline || "";
  if (kind === "uefa" || kind === "unl"){
    if (slug === "knockout-round-playoffs") return "po";
    if (slug === "3rd-place-match") return "3rd";
    return BR_ROUNDS[kind].findIndex(([s]) => s === slug);
  }
  const head = note.split(" - ")[0];
  if (kind === "nba"){
    if (/^NBA Finals/.test(head)) return 3;
    if (/Finals$/.test(head)) return 2;
    if (/Semifinals$/.test(head)) return 1;
    if (/1st Round$/.test(head)) return 0;
    return -1;
  }
  if (/^World Series/.test(head)) return 3;
  if (/^(AL|NL)CS$/.test(head)) return 2;
  if (/^(AL|NL)DS$/.test(head)) return 1;
  if (/^(AL|NL)WC$/.test(head)) return 0;
  return -1;
}
async function brFetch(lg, yr){
  const Lg = LEAGUES[lg], kind = BR_KIND[lg];
  // MLB 와일드카드는 9월 말이라 9월 전체를 받으면 정규시즌에 밀려 잘림 → 9/27~30은 하루씩
  const months = kind === "uefa" ? ["02", "03", "04", "05", "06"] : kind === "unl" ? ["03", "06"] : kind === "nba" ? ["04", "05", "06"] : ["0927", "0928", "0929", "0930", "10", "11"];
  const st = kind === "nba" || kind === "mlb" ? "&seasontype=3" : "";
  const lists = await Promise.all(months.map(m => espn(`site/v2/sports/${Lg.sport}/${Lg.slug}/scoreboard?dates=${yr}${m}${st}&limit=300`, 600).then(j => j.events || []).catch(() => [])));
  return lists.flat();
}
// 같은 두 팀의 경기(1·2차전 또는 시리즈)를 하나의 '대결'로 묶음
function brTies(kind, events){
  const map = new Map();
  for (const ev of events){
    const r = brRound(kind, ev); if (r === -1) continue;
    const comp = (ev.competitions || [{}])[0], cs = comp.competitors || [];
    if (cs.length !== 2) continue;
    const ids = cs.map(c => String(c.team.id)).sort(), key = r + "|" + ids.join("-");
    let t = map.get(key);
    if (!t){ t = {key, round:r, teams:{}, games:[], order:[]}; map.set(key, t); }
    for (const c of cs){
      const id = String(c.team.id);
      if (!t.teams[id]){ t.teams[id] = {id, name:c.team.displayName, logo:c.team.logo || (c.team.logos || [{}])[0]?.href, goals:0, wins:0, seed:c.curatedRank?.current}; t.order.push(id); }
    }
    t.games.push({ev, comp, date:ev.date, done:!!comp.status?.type?.completed, state:comp.status?.type?.state});
  }
  for (const t of map.values()){
    t.games.sort((a, b) => a.date.localeCompare(b.date));
    const last = t.games[t.games.length - 1];
    for (const g of t.games) if (g.done || g.state === "in") for (const c of g.comp.competitors) t.teams[String(c.team.id)].goals += Number(c.score) || 0;
    const ser = last.comp.series;
    if (ser && Array.isArray(ser.competitors)){
      for (const sc of ser.competitors){ const tm = t.teams[String(sc.id)]; if (!tm) continue; if (sc.wins != null) tm.wins = sc.wins; if (sc.aggregateScore != null) tm.agg = sc.aggregateScore; if (sc.winner) t.winner = String(sc.id); }
      if (ser.completed && !t.winner && (kind === "nba" || kind === "mlb")){ const [a, b] = t.order.map(id => t.teams[id]); t.winner = a.wins > b.wins ? a.id : b.id; }
    }
    if (!t.winner){
      const adv = last.comp.competitors.find(c => c.advance === true) || (last.done && (t.games.length === 1 || kind === "uefa" || kind === "unl") ? last.comp.competitors.find(c => c.winner === true) : null);
      if (adv && last.done && (t.games.length === 1 || adv.advance === true || (ser && ser.completed))) t.winner = String(adv.team.id);
    }
    t.done = !!t.winner;
    t.live = t.games.some(g => g.state === "in");
    t.series = kind === "nba" || kind === "mlb";
    const note = ((last.comp.notes || [{}])[0] || {}).headline || "";
    t.pens = /penalt/i.test(note);
    t.next = t.games.find(g => !g.done);
  }
  return [...map.values()];
}
// 결승에서 거꾸로 따라가며 대진표 트리를 만듦 (부전승 자리는 null)
function brTree(ties, nRounds){
  const byRound = r => ties.filter(t => t.round === r);
  const finals = byRound(nRounds - 1);
  const build = (tie, r) => {
    if (!tie) return null;
    const kids = r === 0 ? [] : tie.order.map(id => build(byRound(r - 1).find(t => t.teams[id]) || null, r - 1));
    return {tie, kids};
  };
  if (finals.length === 1) return build(finals[0], nRounds - 1);
  // 결승 전이면: 가장 늦은 라운드의 대결들을 맨 오른쪽에 놓고 앞 라운드를 붙임
  for (let r = nRounds - 1; r >= 0; r--){
    const cur = byRound(r);
    if (!cur.length) continue;
    return {tie:null, kids:cur.map(t => build(t, r)), partial:r};
  }
  return null;
}
async function loadBracket(lg){
  const kind = BR_KIND[lg], d = D(lg), bk = dkeyOf(lg), past = !!seasonOf(lg);
  const y = Number(d.year) || new Date().getFullYear();
  // 지난 시즌을 고른 경우엔 그 시즌 대진표만
  const cands = kind === "uefa" ? (past ? [y + 1] : [y + 1, y]) : kind === "unl" ? (past ? [y + 1] : [y + 1, y - 1]) : (past ? [y] : [y, y - 1]);
  if (BR[bk] && BR[bk].loading) return;
  const prev = BR[bk];
  BR[bk] = prev && prev.state === "ok" ? {...prev, loading:true} : {state:"loading", loading:true};
  let found = false;
  for (let i = 0; i < cands.length; i++){
    const evs = await brFetch(lg, cands[i]);
    const ties = brTies(kind, evs);
    if (ties.some(t => t.round !== "po" && t.round !== "3rd")){
      BR[bk] = {state:"ok", yr:cands[i], last:i > 0, ties, nextYr:i > 0 ? cands[0] : null, t:Date.now(), past};
      found = true;
      break;
    }
  }
  if (!found) BR[bk] = prev && prev.state === "ok" ? {...prev, loading:false, t:Date.now()} : {state:"empty", nextYr:cands[0], past};
  if (S.lg === lg && S.tab === "standings" && S.stView === "bracket") renderBracket();
}

function renderBracket(){
  const lg = S.lg, kind = BR_KIND[lg], b = BR[dkeyOf(lg)], rounds = BR_ROUNDS[kind];
  let html = stViewBar();
  if (!b || b.state === "loading"){ if (!b) loadBracket(lg); $("#main").innerHTML = html + '<div class="loading">대진표를 불러오는 중…</div>'; return; }
  if (b.t && !b.last && Date.now() - b.t > 300000) setTimeout(() => loadBracket(lg), 0);  // 진행 중인 토너먼트는 5분마다 새로
  if (b.state === "empty"){ $("#main").innerHTML = html + (b.past ? `<div class="card live-empty"><b>이 시즌의 토너먼트 기록이 ESPN에 없습니다</b><span class="muted">다른 시즌을 골라 보세요.</span></div>`
    : `<div class="card live-empty"><b>아직 토너먼트 경기가 없습니다</b><span class="muted">${b.nextYr}년에 토너먼트가 시작되면 여기에 대진표가 나옵니다.</span></div>`); return; }
  const seasonLabel = kind === "uefa" ? `${b.yr - 1}-${String(b.yr).slice(2)} 시즌` : kind === "unl" ? `${b.yr - 1}-${String(b.yr).slice(2)} 네이션스리그` : `${b.yr} ${kind === "nba" ? "플레이오프" : "포스트시즌"}`;
  html += `<div class="live-bar"><h2>🏆 ${esc(seasonLabel)}</h2>${b.last ? `<span class="auto">지난 시즌 · 이번 시즌 ${kind === "nba" ? "플레이오프" : kind === "mlb" ? "포스트시즌" : "토너먼트"}는 ${b.nextYr}년 시작</span>` : ""}</div>`;
  const tree = brTree(b.ties.filter(t => typeof t.round === "number"), rounds.length);
  if (tree){
    // 트리를 라운드별 열로 펼침 (왼쪽 = 첫 라운드). 깊이 우선으로 돌면 각 열의 위→아래 순서가 맞음
    const nCols = tree.tie ? rounds.length : tree.partial + 1;
    const cols = [...Array(nCols)].map(() => []);
    const collect = (n, col) => {
      cols[col].push(n ? n.tie : null);
      if (col === 0) return;
      const kids = n && n.kids.length === 2 ? n.kids : [null, null];
      kids.forEach(k => collect(k, col - 1));
    };
    if (tree.tie) collect(tree, nCols - 1); else tree.kids.forEach(k => collect(k, nCols - 1));
    // 맨 왼쪽 열이 전부 빈칸(부전승)이면 그 열은 빼기
    while (cols.length > 1 && cols[0].every(x => !x)) cols.shift();
    const offset = nCols - cols.length;
    const two = kind === "uefa" || kind === "unl", slotH = two ? 118 : 86, rows = cols[0].length;
    html += `<div class="bwrap"><div class="bracket ${two ? "two" : ""}" style="height:${rows * slotH + 30}px">${cols.map((c, ci) => {
      const label = rounds[ci + offset] ? rounds[ci + offset][1] : "";
      const items = c.map(x => brTieCard(x, kind));
      let inner = "";
      if (ci < cols.length - 1) for (let i = 0; i < items.length; i += 2) inner += `<div class="bpair"><div class="bslot">${items[i]}</div><div class="bslot">${items[i + 1] ?? ""}</div></div>`;
      else inner = items.map(x => `<div class="bslot">${x}</div>`).join("");
      return `<div class="bcol ${ci ? "lnk" : ""} ${ci === cols.length - 1 && tree.tie ? "fin" : ""}"><div class="bhead">${esc(label)}</div><div class="bbody">${inner}</div></div>`;
    }).join("")}</div></div>`;
  }
  const extra = [];
  const po = b.ties.filter(t => t.round === "po"), third = b.ties.filter(t => t.round === "3rd");
  if (third.length) extra.push(`<div class="strip-h"><h3>3·4위전</h3></div><div class="bgrid">${third.map(t => brTieCard(t, kind)).join("")}</div>`);
  if (po.length) extra.push(`<div class="strip-h"><h3>녹아웃 플레이오프</h3><span class="muted">리그 페이즈 9~24위 · 이긴 팀이 16강 진출</span></div><div class="bgrid">${po.map(t => brTieCard(t, kind)).join("")}</div>`);
  html += extra.join("");
  html += `<p class="note">${kind === "nba" || kind === "mlb" ? "숫자는 시리즈 승수입니다." : "두 경기로 치르는 라운드는 1·2차전 합계 점수입니다."} 진행 중인 토너먼트는 경기가 끝날 때마다 자동으로 반영됩니다.</p>`;
  $("#main").innerHTML = html;
}

// ---------------------------------------------------------------- 팀 정보: 주목할 선수 · 부상자 · 뉴스 (팀 창 열 때마다 최신으로)
const flatRoster = r => (r && r.athletes || []).flatMap(a => a.items ? a.items : [a]);
const statMap = (names, vals) => { const o = {}; (names || []).forEach((k, i) => { o[k] = vals[i]; }); return o; };
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const md = iso => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };
const timeAgo = iso => { const s = (Date.now() - new Date(iso)) / 1000; if (!isFinite(s)) return "";
  return s < 60 ? "방금 전" : s < 3600 ? Math.round(s / 60) + "분 전" : s < 86400 ? Math.round(s / 3600) + "시간 전" : Math.round(s / 86400) + "일 전"; };

async function keyPlayers(lg, id, roster){
  const sp = LEAGUES[lg].sport, list = flatRoster(roster);
  if (!list.length) return [];
  if (sp === "soccer"){
    return list.map(a => {
      const cats = ((a.statistics || {}).splits || {}).categories || [];
      const s = {}; for (const c of cats) for (const x of c.stats || []) s[x.name] = x.value;
      const g = s.totalGoals || 0, as = s.goalAssists || 0, ap = s.appearances || 0;
      return {a, score:g * 3 + as * 2 + ap * .1 + (s.shotsOnTarget || 0) * .2,
        stats:[["출전", ap], ["골", g], ["도움", as], ["유효슈팅", s.shotsOnTarget ?? "-"]]};
    }).filter(x => x.score > 0).sort((x, y) => y.score - x.score).slice(0, 4);
  }
  // 농구·야구: 선수별 시즌 기록 (1시간 캐시)
  const path = a => `common/v3/sports/${sp}/${LEAGUES[lg].slug}/athletes/${a.id}/overview`;
  const out = [];
  for (let i = 0; i < list.length; i += 10)
    await Promise.all(list.slice(i, i + 10).map(a => espn(path(a), 3600).then(o => { if (o && o.statistics) out.push({a, st:o.statistics}); }).catch(() => {})));
  const rows = out.map(({a, st}) => {
    const split = (st.splits || []).find(x => /Regular|Season/i.test(x.displayName || "") && !/Career/i.test(x.displayName || "")) || (st.splits || [])[0];
    if (!split) return null;
    const m = statMap(st.names, split.stats);
    if (sp === "basketball"){
      if (!num(m.gamesPlayed)) return null;
      return {a, score:num(m.avgPoints) + num(m.avgRebounds) * .5 + num(m.avgAssists) * .7,
        stats:[["득점", m.avgPoints], ["리바", m.avgRebounds], ["어시", m.avgAssists], ["야투%", m.fieldGoalPct], ["경기", m.gamesPlayed]]};
    }
    const pitch = /Pitch/i.test(st.displayName || "") || m.ERA != null || m.earnedRunAverage != null;
    if (pitch){
      const ip = num(m.innings || m.inningsPitched), so = num(m.strikeouts), era = m.ERA ?? m.earnedRunAverage;
      if (!ip) return null;
      return {a, pitch:true, score:ip * .3 + so * .2 - num(era) * 2, stats:[["평균자책", era], ["승", m.wins ?? "-"], ["탈삼진", so], ["이닝", m.innings ?? m.inningsPitched ?? "-"]]};
    }
    const ab = num(m.atBats), h = num(m.hits);
    if (ab < 20) return null;
    return {a, score:num(m.homeRuns) * 3 + num(m.RBIs) + h * .3,
      stats:[["타율", (h / ab).toFixed(3).replace(/^0/, "")], ["홈런", m.homeRuns], ["타점", m.RBIs], ["안타", m.hits]]};
  }).filter(Boolean).sort((x, y) => y.score - x.score);
  if (sp === "baseball") return [...rows.filter(r => !r.pitch).slice(0, 2), ...rows.filter(r => r.pitch).slice(0, 2)];
  return rows.slice(0, 4);
}

// 최근 경기에 뛴 선수 (부상 복귀 확인용): {이름: "선발"|"교체"}
function playedIn(sum, teamId, sp){
  const out = {};
  if (!sum) return out;
  if (sp === "soccer"){
    for (const r of sum.rosters || []) if (String(r.team?.id) === String(teamId))
      for (const p of r.roster || []) { const n = p.athlete?.displayName; if (n && (p.starter || p.subbedIn)) out[n] = p.starter ? "선발" : "교체"; }
    return out;
  }
  for (const t of sum.boxscore?.players || []) if (String(t.team?.id) === String(teamId))
    for (const st of t.statistics || []) for (const a of st.athletes || []) {
      const n = a.athlete?.displayName; if (!n || a.didNotPlay || !(a.stats || []).length) continue;
      if (!out[n] || a.starter) out[n] = a.starter ? "선발" : "교체";
    }
  return out;
}

async function teamInjuries(lg, id, roster, t){
  const Lg = LEAGUES[lg], sp = Lg.sport, list = [];
  const add = (name, status, note, date, img) => { if (name && !list.some(x => x.name === name)) list.push({name, status, note, date, img}); };
  if (sp !== "soccer"){
    const all = await espn(`site/v2/sports/${sp}/${Lg.slug}/injuries`, 600).catch(() => null);
    const mine = ((all || {}).injuries || []).find(x => String(x.id) === String(id));
    for (const i of (mine || {}).injuries || []) add(i.athlete?.displayName, i.status, i.shortComment || "", i.date, i.athlete?.headshot?.href);
  }
  for (const a of flatRoster(roster)) for (const i of a.injuries || [])
    add(a.displayName, i.status || i.type?.description || "부상", (i.details || {}).type || "", i.date, a.headshot?.href);
  // 다음 경기 미리보기의 부상자 명단 (축구는 여기서 주로 나옴)
  const next = t.upcoming[0], last = t.past[0];
  const [nsum, lsum] = await Promise.all([
    next ? espn(summaryPath(lg, next.id), 600).catch(() => null) : null,
    last ? espn(summaryPath(lg, last.id), 3600).catch(() => null) : null]);
  for (const g of (nsum || {}).injuries || []) if (String(g.team?.id) === String(id))
    for (const i of g.injuries || []) add(i.athlete?.displayName, i.status, (i.details || {}).type || "", i.date, i.athlete?.headshot?.href);
  // 복귀 확인: 부상 보고 이후 경기에서 뛰었으면 '복귀'
  const played = playedIn(lsum, id, sp), lastDate = last ? new Date(last.date) : null;
  for (const x of list){
    const how = played[x.name];
    if (!how || !lastDate) continue;
    if (!x.date || new Date(x.date) < lastDate) { x.back = how; x.backDate = last.date; }  // 보고 이후 경기에 뜀 → 복귀
    else { x.played = how; x.backDate = last.date; }  // 최근 경기엔 뛰었지만 그 뒤 새 보고가 있음 → 상태 유지 + 출전 기록 표시
  }
  return list.sort((a, b) => (a.back ? 1 : 0) - (b.back ? 1 : 0));
}

    return;

  const [roster, news] = await Promise.all([

const decOdds = ml => { const n = Number(ml); if (ml == null || ml === "" || !isFinite(n) || n === 0) return null; return n > 0 ? 1 + n / 100 : 1 + 100 / Math.abs(n); };

}
function oddsBlock(m, o, compact){

  const soccer = L().sport === "soccer", ho = o.homeTeamOdds || {}, ao = o.awayTeamOdds || {};

  }
  if (o.spread != null && !isNaN(Number(o.spread))){

    const fin = m.state === "post";

}
// 경기 상세 창용 배당 표: 구분 | 기준 | 홈 | (무) | 원정 | 결과
function oddsTable(m, o){
  const soccer = L().sport === "soccer", ho = o.homeTeamOdds || {}, ao = o.awayTeamOdds || {};
  const hs = Number(m.home.score) || 0, as = Number(m.away.score) || 0, started = m.state !== "pre", fin = m.state === "post";
  const td = (v, hit, sub) => `<td class="${hit && started ? "hit" : ""}">${sub ? `<small>${sub}</small>` : ""}<b>${v}</b></td>`;
  const res = (txt, good) => `<td class="ores ${good ? "on" : ""}">${txt}</td>`;
  const rows = [];
  if (ho.moneyLine != null || ao.moneyLine != null){
    const r = !started ? "-" : hs > as ? (fin ? "홈승" : "홈 우세") : hs < as ? (fin ? "원정승" : "원정 우세") : (fin ? "무승부" : "동점");
    rows.push(`<tr><th>${soccer ? "승무패" : "승패"}</th><td class="ln">-</td>${td(fOdds(ho.moneyLine), hs > as)}${soccer ? td(fOdds((o.drawOdds || {}).moneyLine), hs === as) : ""}${td(fOdds(ao.moneyLine), hs < as)}${res(r, started)}</tr>`);
  }
  if (o.spread != null && !isNaN(Number(o.spread))){
    const sp = Number(o.spread), adj = hs + sp - as;
    const r = !started ? "-" : adj > 0 ? (fin ? "홈 적중" : "홈 우세") : adj < 0 ? (fin ? "원정 적중" : "원정 우세") : (fin ? "적특" : "동점");
    rows.push(`<tr><th>핸디</th><td class="ln">홈 ${sgn(sp)}</td>${td(fOdds(ho.spreadOdds), adj > 0)}${soccer ? '<td class="na"></td>' : ""}${td(fOdds(ao.spreadOdds), adj < 0)}${res(r, started)}</tr>`);
  }
  if (o.overUnder != null && !isNaN(Number(o.overUnder))){
    const line = Number(o.overUnder), tot = hs + as;
    const r = !started ? "-" : fin ? `${tot}점 · ${tot > line ? "오버" : tot < line ? "언더" : "적특"}` : `현재 ${tot}${tot > line ? " · 오버" : ` · ${+(line - tot).toFixed(1)} 남음`}`;
    rows.push(`<tr><th>언더오버</th><td class="ln">${line}</td>${td(fOdds(o.overOdds), tot > line, "오버")}${soccer ? '<td class="na"></td>' : ""}${td(fOdds(o.underOdds), tot < line, "언더")}${res(r, started)}</tr>`);
  }
  if (!rows.length) return "";
  return `<div class="sec"><div class="sec-h"><h3>배당·기준점</h3><span class="muted sp">${esc((o.provider || {}).name || "ESPN")} 경기 전 기준 · 소수점 · 프로토와 다를 수 있음</span></div>
    <div class="card otbl-wrap"><table class="otbl"><thead><tr><th></th><th>기준</th><th>홈</th>${soccer ? "<th>무</th>" : ""}<th>원정</th><th>${fin ? "결과" : started ? "현재" : "결과"}</th></tr></thead><tbody>${rows.join("")}</tbody></table></div></div>`;
}

// ================================================================ 선수 한국어 이름·사진 (위키데이터)
const WD_KEY = "wdPlayers.v2";
let WD = {};
try { WD = JSON.parse(localStorage.getItem(WD_KEY) || "{}") || {}; } catch { WD = {}; }
const wk = (n, occ) => occ + "|" + n;
function playerNames(sum){
  const out = [];
  for (const r of sum?.rosters || []) for (const p of r.roster || []) out.push(p.athlete?.displayName);
  for (const t of sum?.boxscore?.players || []) for (const st of t.statistics || []) for (const a of st.athletes || []) out.push(a.athlete?.displayName);
  for (const t of sum?.injuries || []) for (const i of t.injuries || []) out.push(i.athlete?.displayName);
  return out.filter(Boolean);
}
async function lookupPlayers(names, occ){
  const need = [...new Set(names)].filter(n => !(wk(n, occ) in WD));
  for (let i = 0; i < need.length; i += 60){
    const chunk = need.slice(i, i + 60);
    const vals = chunk.map(n => JSON.stringify(n) + "@en").join(" ");
    const q = `SELECT ?name ?ko ?kow ?img WHERE { VALUES ?name { ${vals} } ?item rdfs:label|skos:altLabel ?name ; wdt:P106 wd:${occ} .
      OPTIONAL { ?item rdfs:label ?ko FILTER(LANG(?ko) = "ko") }
      OPTIONAL { ?art schema:about ?item ; schema:isPartOf <https://ko.wikipedia.org/> ; schema:name ?kow }
      OPTIONAL { ?item wdt:P18 ?img } }`;
    try {
      const r = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(q));
      if (!r.ok) continue;
      const rows = (await r.json()).results.bindings;
      chunk.forEach(n => { WD[wk(n, occ)] = 0; });  // 0 = 조회했지만 정보 없음
      for (const b of rows){
        const key = wk(b.name.value, occ), cur = WD[key] || {};
        const k = b.ko || b.kow;  // 한국어 레이블이 없으면 한국어 위키백과 문서 제목
        if (k && !cur.ko) cur.ko = k.value.replace(/\s*\(.*?\)\s*/g, " ").trim();
        if (b.img && !cur.img) cur.img = b.img.value;
        WD[key] = cur;
      }
    } catch { /* 위키데이터 실패 시 영어 이름 그대로 */ }
  }
  try { localStorage.setItem(WD_KEY, JSON.stringify(WD)); } catch {}
}
const curOcc = () => OCC[L().sport];
const wd = (n, occ = curOcc()) => WD[wk(n, occ)] || null;
const lastName = n => { const p = (n || "").trim().split(/\s+/); return p.length > 1 ? p.slice(1).join(" ") : (n || ""); };
const koFull = n => (wd(n) && wd(n).ko) || n || "";
function koShort(n, occ){
  const ko = wd(n, occ) && wd(n, occ).ko, en = lastName(n);
  if (!ko) return en;
  const kt = ko.split(/\s+/);
  if (kt.length < 2) return ko;
  return kt.slice(-Math.min(en.split(/\s+/).length, kt.length - 1)).join(" ");
}
const imgOf = (n, w = 120) => { const u = wd(n) && wd(n).img; return u ? u.replace(/^http:/, "https:") + "?width=" + w : null; };
const nameTitle = n => esc(koFull(n) === n ? n : `${koFull(n)} (${n})`);
